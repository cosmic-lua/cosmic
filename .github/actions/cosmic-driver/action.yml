# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
#
# The pinned CI driver, for a job that runs it: restores the bootstrap
# cache, keyed by ci/cosmic-driver.pin, then runs
# .github/scripts/cosmic-driver.sh from ci/, which checks what was
# restored against the pin, fetches it where it is missing and puts it
# on the job's PATH as cosmic-driver. A job uses it after its checkout,
# as one step; one that later asks whether the driver is there gives it
# `id: driver` and reads its outcome.
#
# Neither a job's `defaults.run` nor its `working-directory` reaches a
# composite action's steps, so each says its own. A job whose steps run
# through a shell of their own passes it as `shell`. One whose steps run
# as another user than its job container's root (fuzz.yml) passes that
# user as `owner` too, and uses this action after its hand-over. The
# restore runs as root, like every action in a job container, so the
# action hands what it restored to `owner` before the bootstrap runs as
# that user, which then owns the driver's link and cache. ci.yml's Linux
# legs run their actions on the host, as a user of the container's
# `runner`'s uid, and pass none.
#
# build/workflows_test.tl holds the expressions here only to naming
# inputs declared above (see the TODO there).
{
  name: "cosmic-driver",
  description: "Restore, verify and put on PATH the CI driver ci/cosmic-driver.pin names",

  inputs: {
    "zig-cache": {
      description: "true to also point the job's later steps at the zig caches ci.yml's platform job restores (cosmic-driver.sh zig-cache)",
      required: false,
      default: "false",
    },
    shell: {
      description: "The shell the bootstrap runs under: the job's own, where its steps drop to an unprivileged user",
      required: false,
      default: "sh",
    },
    owner: {
      description: "The user the restored cache is handed to, as the container's root, before the bootstrap runs as that user; empty for none",
      required: false,
      default: "",
    },
  },

  runs: {
    using: "composite",
    steps: [
      # Every run restores it; only main's push and scheduled runs save it
      # (below), so a branch's miss, as a branch that moves the pin has,
      # fetches the driver and keeps nothing, where a save per branch and
      # queue ref wrote a copy no other ref could read. GitHub lets a
      # branch read main's caches but main read none of a branch's.
      {
        name: "restore the pinned CI driver",
        id: "restore",
        uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
        with: {
          path: "${{ runner.temp }}/cache/cosmic/bootstrap",
          key: "cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}",
        },
      },

      {
        name: "hand the restored driver cache to the user the job runs as",
        if: "inputs.owner != ''",
        "working-directory": "/",
        shell: "sh",
        env: {OWNER: "${{ inputs.owner }}"},
        run: "[ ! -e \"$RUNNER_TEMP/cache\" ] || chown -R \"$OWNER\" \"$RUNNER_TEMP/cache\"",
      },

      {
        name: "bootstrap the pinned CI driver",
        "working-directory": "ci",
        shell: "${{ inputs.shell }}",
        run: "sh ../.github/scripts/cosmic-driver.sh${{ inputs.zig-cache == 'true' && ' zig-cache' || '' }}",
      },

      # After the bootstrap has fetched and verified what was missing.
      {
        name: "save the pinned CI driver",
        if: "steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')",
        uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
        with: {
          path: "${{ runner.temp }}/cache/cosmic/bootstrap",
          key: "cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}",
        },
      },
    ],
  },
}
