# Hash the checkout before ci.yml moves it. Both jobs use these names;
# each job keeps its own restore/save policy and cache scope.
{
  name: "cache-names",
  description: "Name the leg's build caches and record the run's start",
  inputs: {
    leg: {description: "The platform leg whose build caches the job uses", required: true},
  },
  outputs: {
    vendor: {description: "Zig build cache prefix for this leg and vendor inputs", value: "${{ steps.names.outputs.vendor }}"},
    core: {description: "Core inputs hash", value: "${{ steps.names.outputs.core }}"},
    compiles: {description: "Branch compile cache prefix for this leg and compiler inputs", value: "${{ steps.names.outputs.compiles }}"},
    image: {description: "Runner image identity", value: "${{ steps.names.outputs.image }}"},
    since: {description: "Run start in Unix seconds for cache trimming", value: "${{ steps.names.outputs.since }}"},
  },
  runs: {
    using: "composite",
    steps: [
      {
        id: "names",
        shell: "sh",
        "working-directory": ".",
        env: {
          LEG: "${{ inputs.leg }}",
          VENDOR: "${{ hashFiles('bin/zig.pin', 'build.zig', 'build.zig.zon', 'build/zig.tl', 'vendor/**', '!vendor/tl/**', '!vendor/tzdata/**', '!vendor/cacert/**', '!vendor/wpt-url/**', '!vendor/html5lib-tokenizer/**', '!vendor/wpt-html-parsing/**', 'patch/**', '!patch/tl/**', 'core/ares_config.h', 'core/curl_config.h', 'core/mbedtls_cosmic_config.h', 'core/xz_config/**', 'core/darwin-compat/**') }}",
          CORE: "${{ hashFiles('core/*.c', 'core/*.h', 'core/*.zig', 'test/portable/*.c') }}",
          COMPILER: "${{ hashFiles('build/**/*.tl', '!build/**/*_test.tl', 'vendor/tl/PIN', 'vendor/lua/PIN', 'patch/tl/**', 'patch/lua/**') }}",
        },
        run: "exec sh .github/scripts/cache-names.sh",
      },
    ],
  },
}
