# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "publish next prerelease",

  # Publishes from each ci run on main -- a push or a manual run, not
  # the scheduled one -- that completed green, so no branch's run shows
  # this job as a skipped check. A workflow_run always runs main's copy
  # of this file, in main's context: the commit and run it publishes are
  # the triggering run's (github.event.workflow_run), not github.sha or
  # github.run_id. The write permission is this job's alone; ci.yml's
  # jobs remain read-only.
  "on": {
    workflow_run: {
      workflows: ["ci"],
      types: ["completed"],
      branches: ["main"],
    },
  },

  permissions: {contents: "read"},

  jobs: {
    publish: {
      permissions: {
        contents: "write",
        # To download the triggering run's products.
        actions: "read",
      },
      if: "github.repository == 'cosmic-lua/cosmic' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      concurrency: {
        group: "prerelease-${{ github.event.workflow_run.head_sha }}",
        "cancel-in-progress": false,
      },
      steps: [
        # The job checks out, from the commit it publishes, only what the
        # pinned CI driver needs: ci/ (the driver runs cosmic_ci in place
        # and keeps its database under ci/o/), bin/cosmic-bootstrap, and the
        # script and the local action that run it (not cone mode, which
        # would add the root's files), and keeps no credential in the
        # checkout. Beyond the
        # actions, the job runs only the scripts that fetch the driver and
        # verify it against ci/cosmic-driver.pin's digest, and the driver
        # itself. The write token reaches only the driver's publish step,
        # where cosmic_ci/prerelease.tl hands it to the gh CLI. The
        # candidate bytes the job downloads are data only: none of them is
        # ever executed.
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
          with: {
            ref: "${{ github.event.workflow_run.head_sha }}",
            "sparse-checkout": "/ci/\n/bin/cosmic-bootstrap\n/.github/scripts/cosmic-driver.sh\n/.github/actions/cosmic-driver/\n",
            "sparse-checkout-cone-mode": false,
            "persist-credentials": false,
          },
        },
        {
          name: "bootstrap the pinned CI driver",
          uses: "./.github/actions/cosmic-driver",
        },
        {
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            pattern: "portable-product-*",
            path: "${{ runner.temp }}/products",
            "run-id": "${{ github.event.workflow_run.id }}",
            "github-token": "${{ github.token }}",
          },
        },

        {
          name: "verify and stage the tested product",
          "working-directory": "ci",
          env: {
            PRODUCTS: "${{ runner.temp }}/products",
            RELEASE: "${{ runner.temp }}/release",
            SOURCE_COMMIT: "${{ github.event.workflow_run.head_sha }}",
            SOURCE_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}",
          },
          run: "cosmic-driver cosmic_ci/driver.tl prerelease-stage",
        },

        {
          name: "publish or verify the immutable prerelease",
          "working-directory": "ci",
          env: {
            GH_TOKEN: "${{ github.token }}",
            REPOSITORY: "${{ github.repository }}",
            RELEASE: "${{ runner.temp }}/release",
            SOURCE_COMMIT: "${{ github.event.workflow_run.head_sha }}",
            SOURCE_RUN_PREFIX: "${{ github.server_url }}/${{ github.repository }}/actions/runs/",
          },
          run: "cosmic-driver cosmic_ci/driver.tl prerelease-publish",
        },
      ],
    },
  },
}
