# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "publish next prerelease",

  "on": {
    workflow_call: {},
  },

  # The caller and this workflow both restrict publication to cosmic-lua/cosmic's
  # main branch. The write permission exists only on the caller job that invokes
  # this workflow; the build and provenance jobs remain read-only.
  jobs: {
    publish: {
      if: "github.repository == 'cosmic-lua/cosmic' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      concurrency: {
        group: "prerelease-${{ github.sha }}",
        "cancel-in-progress": false,
      },
      steps: [
        # The job checks out, from the commit it publishes, only what the
        # pinned CI driver needs: ci/ (the driver runs cosmic_ci in place
        # and keeps its database under ci/o/), bin/cosmic-bootstrap and the
        # script that runs it (not cone mode, which would add the root's
        # files), and keeps no credential in the checkout. The only code
        # this job executes, with its write token, is that driver: the
        # release ci/cosmic-driver.pin names, verified against the pin's
        # digest before it runs, running cosmic_ci/prerelease.tl, and the
        # gh CLI it drives. The candidate bytes it downloads are data
        # only: none of them is executed.
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
          with: {
            "sparse-checkout": "/ci/\n/bin/cosmic-bootstrap\n/.github/scripts/cosmic-driver.sh\n",
            "sparse-checkout-cone-mode": false,
            "persist-credentials": false,
          },
        },
        {
          name: "cache the pinned CI driver",
          uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830", # v4.3.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/bootstrap",
            key: "cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}",
          },
        },
        {
          name: "bootstrap the pinned CI driver",
          "working-directory": "ci",
          run: "sh ../.github/scripts/cosmic-driver.sh",
        },
        {
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            pattern: "portable-product-*",
            path: "${{ runner.temp }}/products",
          },
        },

        {
          name: "verify and stage the tested product",
          "working-directory": "ci",
          env: {
            PRODUCTS: "${{ runner.temp }}/products",
            RELEASE: "${{ runner.temp }}/release",
            SOURCE_COMMIT: "${{ github.sha }}",
            SOURCE_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          },
          run: "cosmic-driver cosmic_ci/driver.tl prerelease-stage",
        },

        {
          name: "publish or verify the immutable prerelease",
          "working-directory": "ci",
          env: {
            GH_TOKEN: "${{ github.token }}",
            REPOSITORY: "${{ github.repository }}",
            RELEASE: "${{ runner.temp }}/release",
            SOURCE_COMMIT: "${{ github.sha }}",
            SOURCE_RUN_PREFIX: "${{ github.server_url }}/${{ github.repository }}/actions/runs/",
          },
          run: "cosmic-driver cosmic_ci/driver.tl prerelease-publish",
        },
      ],
    },
  },
}
