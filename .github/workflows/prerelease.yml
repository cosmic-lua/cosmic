# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "publish next prerelease",

  "on": {
    workflow_call: {},
  },

  # The caller and this workflow both restrict publication to cosmic-lua/cosmic's
  # main branch. The write permission exists only on the caller job that invokes
  # this workflow; the build and provenance jobs remain read-only.
  jobs: {
    publish: {
      if: "github.repository == 'cosmic-lua/cosmic' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      concurrency: {
        group: "prerelease-${{ github.sha }}",
        "cancel-in-progress": false,
      },
      steps: [
        # The job checks out only its own scripts, .github/scripts/, from the
        # commit it publishes (not cone mode, which would add the root's
        # files), and keeps no credential in the checkout. The candidate
        # bytes it downloads are data only: none of them is executed.
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
          with: {
            "sparse-checkout": "/.github/scripts/",
            "sparse-checkout-cone-mode": false,
            "persist-credentials": false,
          },
        },
        {
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            pattern: "portable-product-*",
            path: "${{ runner.temp }}/products",
          },
        },

        {
          name: "verify and stage the tested product",
          shell: "bash",
          env: {
            PRODUCTS: "${{ runner.temp }}/products",
            RELEASE: "${{ runner.temp }}/release",
            SOURCE_COMMIT: "${{ github.sha }}",
            SOURCE_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          },
          run: "bash .github/scripts/prerelease-stage.sh",
        },

        {
          name: "publish or verify the immutable prerelease",
          shell: "bash",
          env: {
            GH_TOKEN: "${{ github.token }}",
            REPOSITORY: "${{ github.repository }}",
            RELEASE: "${{ runner.temp }}/release",
            SOURCE_COMMIT: "${{ github.sha }}",
            SOURCE_RUN_PREFIX: "${{ github.server_url }}/${{ github.repository }}/actions/runs/",
          },
          run: "bash .github/scripts/prerelease-publish.sh",
        },
      ],
    },
  },
}
