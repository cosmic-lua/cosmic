name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One Linux lane builds every image, and the database they all share.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The pinned compiler is the one thing a fresh clone fetches, and
      # the pin is the cache key: a bump starts cold.
      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ hashFiles('bin/zig.pin') }}

      - name: build every core, then the database and the binaries
        run: bin/zig build cores boot

      - name: run every test the tree defines, including doctests
        run: o/bin/cosmic test

      - name: the tree renders exactly as `cosmic fix` would write it
        run: o/bin/cosmic fix --check .

      - name: what the build produced
        run: |
          ls -l o/bin o/cosmic.db
          file o/bin/cosmic-*

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binaries
          path: |
            o/bin/cosmic-x86_64-linux-musl
            o/bin/cosmic-aarch64-linux-musl
            o/bin/cosmic-aarch64-macos
            o/cosmic.db
          if-no-files-found: error

  # A fourth core, built with undefined-behavior checking on, running the
  # whole build and test suite. It is not a shipped artifact; it is the run
  # that would report what the release build would only do quietly.
  sanitized:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ hashFiles('bin/zig.pin') }}
      - name: build the tree with the checked core
        run: bin/zig build sanitized
      - name: run every test with the checked core
        run: |
          cmp -n "$(wc -c < o/sanitized/cosmic-core)" \
            o/sanitized/cosmic-core o/sanitized/bin/cosmic
          timeout 30 o/sanitized/bin/cosmic test

  # Each shipped target proves it can build AND test itself: the same
  # tree, built fresh with that platform's own C toolchain, must pass
  # every test the tree defines. A downloaded artifact cannot prove
  # this on its own -- o/types/'s generated declarations only exist
  # once a build has produced them -- so this builds natively instead
  # of testing something cross-compiled elsewhere.
  test-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}
      - name: build every core, then the database and the binaries
        run: bin/zig build cores boot
      - name: run every test the tree defines, including doctests
        run: o/bin/cosmic test

  test-macos:
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}
      - name: build every core, then the database and the binaries
        run: bin/zig build cores boot
      - name: run every test the tree defines, including doctests
        run: o/bin/cosmic test

      # The only place the signature `attach` wrote is judged by the
      # system that has to accept it -- a fresh native build proves
      # nothing about the SHIPPED, cross-compiled artifact's own
      # signature, so this checks that one specifically.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binaries
          path: dl
      - name: the shipped artifact's signature
        shell: bash
        run: |
          set -euo pipefail
          for z in $(find dl -type f -name '*.zip'); do
            python3 -m zipfile -e "$z" dl/
          done
          cosmic=$(find dl -type f -name 'cosmic-aarch64-macos' | head -1)
          chmod +x "$cosmic"
          codesign --verify --strict --verbose=2 "$cosmic"
          codesign --display --verbose=4 "$cosmic"
          echo "signature: PASS"

  # The artifact is a pure function of the tree. A fresh container is a
  # cold tree by construction; building at another path is what catches
  # an absolute path that leaked into the bytes.
  repro:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: a-second-and-rather-longer-checkout-path
      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ hashFiles('a-second-and-rather-longer-checkout-path/bin/zig.pin') }}
      - name: build it again
        working-directory: a-second-and-rather-longer-checkout-path
        run: bin/zig build cores boot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binaries
          path: dl
      - name: compare every byte
        shell: bash
        run: |
          set -euo pipefail
          for z in $(find dl -type f -name '*.zip'); do
            python3 -m zipfile -e "$z" dl/
          done
          again=a-second-and-rather-longer-checkout-path/o
          cmp "$(find dl -type f -name cosmic.db | head -1)" "$again/cosmic.db"
          for target in x86_64-linux-musl aarch64-linux-musl aarch64-macos; do
            cmp "$(find dl -type f -name "cosmic-$target" | head -1)" \
                "$again/bin/cosmic-$target"
          done
          echo "repro: PASS (the database and all three images are byte-identical)"
