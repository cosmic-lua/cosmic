# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
# ci/README.md's "the workflow" says what runs where, and why the caches,
# the container and the concurrency are as they are.
{
  name: "ci",

  "on": {
    # Only main's pushes: a branch's push runs nothing, the merge queue
    # testing every change before it lands. A manual run of a branch runs
    # what main's run does.
    push: {branches: ["main"]},
    # A pull request runs the light check alone (linux-x86_64's leg, below),
    # which reports the `ci` check the merge queue requires of it.
    pull_request: {},
    # main takes changes only through the merge queue, which waits on
    # the `ci` check for the queued merge commit.
    merge_group: {},
    workflow_dispatch: {},
    # Every day, the run that tests macOS and publishes a prerelease
    # (prerelease.yml): every leg and job, on the verdicts main's pushes
    # left. On Sundays (the second line), also every test run whatever
    # stood (COSMIC_CI_EVENT), and zig's caches built cold: for
    # what no key answers for (the clock, a flake).
    # TODO: tell the maintainers of a red scheduled run: GitHub notifies
    # only whoever last edited this cron line. A step that opens (or
    # comments on) an issue when a scheduled run fails would, once one is
    # wanted over the checks' page.
    schedule: [{cron: "41 3 * * 1-6"}, {cron: "41 3 * * 0"}],
  },

  permissions: {contents: "read"},

  env: {
    # Whether this run's jobs save the caches every run restores: a push
    # to main and the scheduled run, no other. The driver does not read it.
    COSMIC_CI_SAVES: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}",
  },

  # A newer manual run supersedes a branch's. Main's pushes run one at a
  # time and to the end, so their saves land in commit order and each
  # completed run can publish a prerelease; the scheduled run and a manual
  # one take groups of their own, so no push cancels them or is cancelled
  # by them.
  concurrency: {
    group: "${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name || 'run' }}-${{ github.ref }}",
    "cancel-in-progress": "${{ github.ref != 'refs/heads/main' }}",
  },

  jobs: { # A platform leg: the native suite on its host, and, on main's runs,
    # the complete product, its regressions and its portable suite, the
    # bytes it ran uploaded for the join. The merge queue runs
    # linux-x86_64's native suite and the tree's format check, and no more:
    # a light, fast gate. A pull request runs lighter still, linux-x86_64's
    # boot and the format check of what it changed. A push to main runs
    # three legs whole, all but macOS; the daily scheduled run and a
    # manual run run all four, macOS among them.
    platform: {
      name: "${{ matrix.name }}",
      defaults: {run: {"working-directory": "ci", shell: "${{ matrix.image && 'leg-shell {0}' || 'sh' }}"}},
      strategy: {
        # Every leg runs to its end and shows every failure.
        "fail-fast": false,
        # The legs, listed whole for each kind of run: an `include` entry
        # naming a leg no dimension holds would start it anyway. Each
        # `image` is the container its Linux leg runs in (ci/images/,
        # ci-images.yml), pinned by digest, its `run` steps run as an
        # unprivileged `runner` through `leg-shell`
        # (.github/scripts/leg-container.sh); macOS has none.
        matrix: {
          include: "${{ fromJSON((github.event_name == 'merge_group' || github.event_name == 'pull_request') && '[{\"name\": \"linux-x86_64\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}]' || github.event_name == 'push' && '[{\"name\": \"linux-x86_64\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"alpine-x86_64\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}]' || '[{\"name\": \"linux-x86_64\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"macos-aarch64\", \"runner\": \"macos-15\", \"target\": \"aarch64-macos\", \"image\": \"\"}, {\"name\": \"alpine-x86_64\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}]') }}",
        },
      },
      "runs-on": "${{ matrix.runner }}",
      # packages: to pull the Linux legs' images from GHCR.
      permissions: {contents: "read", packages: "read"},
      "timeout-minutes": 60,
      env: {
        COSMIC_WORKER: "${{ matrix.name }}",
        TARGET: "${{ matrix.target }}",
        # The checked suite and the format check run in jobs and steps
        # of their own (`checked`, "check the tree's format" below).
        COSMIC_CI_CHECKED_SUITE: "skip",
        COSMIC_CI_FORMAT: "skip",
        # The slowest fixture, the same on every platform (some 275 s on
        # the x86-64 legs): the weekly run (Sunday's) alone (phase_fixtures).
        COSMIC_CI_FIXED_POINT: "${{ github.event.schedule == '41 3 * * 0' && 'run' || 'skip' }}",
        # The small fixtures run beside the self-driven one, within one
        # worker budget of the leg's processors (phase_fixtures,
        # `fixture_lanes`): the two Linux legs whose fixture step the
        # one-test self-driven case idles.
        COSMIC_CI_FIXTURE_BUDGET: "${{ (matrix.name == 'linux-aarch64' || matrix.name == 'alpine-x86_64') && 'run' || 'skip' }}",
        # A Linux leg fails where a confined test's sandbox does not hold
        # (phase_sandbox) and runs its suites sandboxed; macOS cannot.
        COSMIC_CI_REQUIRE_SANDBOX: "${{ matrix.image && '1' || '0' }}",
        # macOS keys verdicts by what each test declares all the same: a
        # Linux leg's sandbox holds the same declaration, so one that lies
        # fails there first.
        COSMIC_CI_DECLARED_KEYS: "${{ matrix.image && '0' || '1' }}",
        # Pushes, the merge queue and the daily scheduled run stand on
        # verdicts; a manual and the weekly run (Sunday's) run every test
        # (orchestration.tl's `stands`).
        COSMIC_CI_EVENT: "${{ github.event_name == 'schedule' && github.event.schedule != '41 3 * * 0' && 'push' || github.event_name }}",
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
          # The queue's or a pull request's merge and its parents, for the format check's base.
          with: {"fetch-depth": "${{ (github.event_name == 'merge_group' || github.event_name == 'pull_request') && 2 || 1 }}"},
        },
        # A Linux leg's container, started by a step (not `container:`) so
        # the host can be set up for spawn's sandbox first
        # (.github/scripts/leg-container.sh, ci/README.md's "the Linux
        # legs' container").
        # TODO: run the container under an AppArmor profile of
        # docker-default's with mount allowed in place of
        # apparmor=unconfined, if the runner lets a step load one
        # (apparmor_parser, as root, before the container starts) and
        # the probe finds every part holds under it.
        {
          name: "start the leg's container",
          if: "matrix.image",
          "working-directory": ".",
          shell: "sh",
          env: {IMAGE: "${{ matrix.image }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}", ACTOR: "${{ github.actor }}"},
          run: "sh .github/scripts/leg-container.sh start \"$IMAGE\"",
        },
        # As root in the container: `runner` takes the workspace's owner's
        # uid, so it owns what the host's actions write. The ubuntu image
        # has useradd (-o: its own `ubuntu` user may hold the uid), the
        # alpine image busybox's adduser.
        {
          name: "create the unprivileged builder",
          if: "matrix.image",
          "working-directory": "/",
          shell: "leg-shell --root {0}",
          run: "uid=\"$(stat -c %u \"$GITHUB_WORKSPACE\")\"; if command -v useradd >/dev/null; then useradd -m -o -u \"$uid\" runner; else adduser -D -u \"$uid\" runner; fi",
        },
        {
          name: "restore the pinned zig",
          id: "zig-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            key: "zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin', 'patch/zig-lib/**') }}",
          },
        },
        {
          name: "name the zig build cache, and the run's start",
          id: "names",
          uses: "./.github/actions/cache-names",
          with: {leg: "${{ matrix.name }}"},
        },
        # TODO: find what a run adds to the cache when its inputs match
        # the entry it restored, and compiles again on every such run:
        # linux-x86_64's grew 323 -> 347 -> 369 -> 388 MB over runs
        # 36317996933 to 36325134876, all with one input hash, where a
        # checkout at a new path, built from the same entry (even through
        # a tar round trip), writes nothing. What zig builds for the
        # runner's detected CPU is the likeliest: its maker (11 MB, in
        # the global cache) and the configurer compiled from build.zig
        # (22 MB, in the project cache, beside its configuration under
        # `c/`). A second boot of an unchanged tree on one machine writes
        # only dependencies.zig, and the maker and configurer are built
        # for the detected CPU with no flag, variable or library file to
        # name another (zig 0.17 compiles them inside its binary), so
        # that stays unverified here and unfixed until a zig that builds
        # them for a baseline CPU is pinned. Once bin/zig.pin names a zig that builds them for
        # the baseline CPU, or the writes name another cause, replace
        # this TODO.
        # The newest of this leg's entries main saved for this vendor part:
        # of this core part, else any. The weekly run restores nothing and
        # builds cold, which bounds what an entry carries; the daily ones
        # restore as a push does.
        {
          name: "restore zig build outputs",
          id: "zig-cache-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-\n${{ steps.names.outputs.vendor }}full-\n${{ steps.names.outputs.vendor }}\n",
            "lookup-only": "${{ github.event.schedule == '41 3 * * 0' }}",
          },
        },
        # Off main, the leg's newest entry of any vendor part; a second
        # step, since a ref's own entries are searched before main's.
        {
          name: "restore zig build outputs of another vendor part",
          if: "github.ref != 'refs/heads/main' && steps.zig-cache-restore.outputs.cache-matched-key == ''",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-restore.outputs.cache-primary-key }}",
            "restore-keys": "zig-build-${{ matrix.name }}-\n",
          },
        },
        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          uses: "./.github/actions/cosmic-driver",
          with: {"zig-cache": true, shell: "${{ matrix.image && 'leg-shell {0}' || 'sh' }}"},
        },
        # What of the host every declared-key verdict's key holds
        # (COSMIC_HOST_ID), and the verdict cache's name.
        {
          name: "name the leg's host",
          id: "host-id",
          shell: "sh",
          env: {STARTED: "${{ hashFiles('.github/seccomp/**', '.github/scripts/leg-container.sh', '.github/scripts/seccomp-profile.sh') }}"},
          run: "cosmic-driver cosmic_ci/driver.tl leg-host-id \"${{ matrix.name }}\" \"${{ matrix.image }}\" \"${{ matrix.runner }}\" \"$STARTED\"",
        },
        # Main's newest verdicts and compiles for this host; only main
        # saves. A restore decides how many tests stand, never whether a
        # verdict is right.
        {
          name: "restore test verdicts",
          id: "verdicts-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}",
            "restore-keys": "${{ steps.host-id.outputs.verdicts }}\n",
          },
        },
        {
          name: "restore compiles and parses",
          id: "compiles-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "compiles-${{ matrix.name }}-",
            "restore-keys": "compiles-${{ matrix.name }}-\n",
          },
        },
        # To a path of this commit's and leg's own, so a test that turns
        # on the tree's path fails some run (driver.tl place-tree). After
        # every hashFiles, which reads the checkout.
        # TODO: move it on the macOS leg alone once "check the pinned CI
        # driver" runs cosmic_ci's tests sandboxed: the tree's own suites
        # here already see it at /tree wherever it is (COSMIC_TEST_SANDBOX=1),
        # and the pinned release sandboxes its workers by default, knows
        # `system` and takes `/parent/` grants (orchestration_test
        # declares its own), but a sandboxed `cosmic test
        # cosmic_ci` from ci/ still fails tests, for the host programs they
        # start and the files they read without declaring them (`system`
        # profiles, grants), which that run lists; the macOS leg has no
        # sandbox at all.
        {
          name: "move the tree to a path of its own",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree",
        },
        # The tree's format check (`fix --check .`), the same on every
        # host: linux-x86_64's, on a pull request, in the merge queue, on
        # the weekly and on a manual run. Never on main's push or the
        # daily run: main moves only through the queue, whose check of the
        # very commit passed. It holds the markers of the tree to the
        # merge base of the commit with main (build/ceilings_base.tl): a
        # marker only falls. Never to the queue's own base
        # (merge_group.base_sha), the entry ahead, whose markers the
        # commit already holds. The base step finds it with git alone,
        # never the API, whose comparison GitHub refuses under load: a
        # pull request for main reads the merge commit's first parent
        # from its checkout, and the other runs fetch the commit's
        # history down to main. Where it finds none it fails the job
        # there, as the check would minutes later, rather than let a
        # raise through; run it again.
        {
          name: "find the base the markers are held to",
          id: "ceilings-base",
          if: "matrix.name == 'linux-x86_64' && github.event_name != 'push' && github.event.schedule != '41 3 * * 1-6'",
          shell: "sh",
          env: {SHA: "${{ github.sha }}", EVENT: "${{ github.event_name }}", REF: "${{ github.ref }}", BASE_REF: "${{ github.event.merge_group.base_ref }}", PR_BASE_REF: "${{ github.base_ref }}"},
          run: "cosmic-driver cosmic_ci/driver.tl ceilings-base",
        },
        {
          name: "name the base the ceilings are held to",
          if: "steps.ceilings-base.outputs.sha != ''",
          shell: "sh",
          env: {BASE: "${{ steps.ceilings-base.outputs.sha }}"},
          run: "echo \"COSMIC_CEILINGS_BASE=$BASE\" >> \"$GITHUB_ENV\"",
        },
        # On a pull request and in the queue, what the commit changed
        # since that base, whose tree the queue held to the check: the
        # check lays out only these and makes every check spanning files
        # over the whole tree (driver.tl changed-paths, `fix --check
        # --changed`), and the queue checks the pinned driver only where
        # they reach what its tests read. Where it names none, both cover
        # everything.
        {
          name: "name the paths the commit changed",
          id: "changed",
          if: "matrix.name == 'linux-x86_64' && (github.event_name == 'merge_group' || github.event_name == 'pull_request') && steps.ceilings-base.outputs.sha != ''",
          shell: "sh",
          "continue-on-error": true,
          env: {BASE: "${{ steps.ceilings-base.outputs.sha }}", OUT: "${{ runner.temp }}/changed-paths"},
          run: "cosmic-driver cosmic_ci/driver.tl changed-paths",
        },
        # cosmic_ci's tests read ci/ and, of the tree around it,
        # .github/workflows/ci.yml alone (their Test.policy grants).
        {
          name: "ask whether the change reaches the CI driver's tests",
          id: "reach",
          if: "matrix.name == 'linux-x86_64' && github.event_name == 'merge_group'",
          shell: "sh",
          env: {PATHS: "${{ steps.changed.outputs.paths }}"},
          run: "if [ -z \"$PATHS\" ] || grep -qE '^(ci|\\.github)/' \"$PATHS\"; then echo driver=run >> \"$GITHUB_OUTPUT\"; fi",
        },
        # --all, unsandboxed: cosmic_ci's tests start the host's own
        # programs and are not all declared to run sandboxed. Every leg
        # of the daily, weekly and a manual run; in the queue, where the
        # change reaches them; never on main's push, whose commit the
        # queue checked.
        {
          name: "check the pinned CI driver",
          if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.reach.outputs.driver == 'run'",
          env: {COSMIC_VERDICT_CACHE: "0", COSMIC_TEST_SANDBOX: "0"},
          run: "cosmic-driver test cosmic_ci",
        },
        # What bin/cosmic-bootstrap runs must type-check under the pinned
        # driver too, each file ci/bootstrap-files.txt lists.
        {
          name: "type-check the bootstrap's scripts on the pinned driver",
          if: "matrix.name == 'linux-x86_64' && github.event_name != 'push'",
          run: "cosmic-driver cosmic_ci/driver.tl check-islands",
        },
        {
          name: "build release Cosmic",
          id: "boot",
          run: "cosmic-driver cosmic_ci/driver.tl platform boot",
        },
        {
          name: "run release Cosmic's native suite",
          id: "release-suite",
          if: "github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform local-suite",
        },
        {
          name: "verify the delayed native database boundary",
          if: "github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform local-boundary",
        },
        {
          name: "check the tree's format",
          if: "matrix.name == 'linux-x86_64' && github.event_name != 'push' && github.event.schedule != '41 3 * * 1-6'",
          env: {COSMIC_CI_FORMAT: "run", COSMIC_CI_FORMAT_CHANGED: "${{ steps.changed.outputs.paths }}"},
          run: "cosmic-driver cosmic_ci/driver.tl platform format",
        },
        # Project dispatch writes the working database: after the native
        # suite's delayed boundary.
        {
          name: "build the credential transition probe",
          if: "runner.os == 'Linux' && github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          "working-directory": ".",
          run: ".github/scripts/credentials-build.sh",
        },
        {
          name: "prove the ordinary credential transition",
          if: "runner.os == 'Linux' && github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          "working-directory": ".",
          shell: "leg-shell --root {0}",
          run: "sh .github/scripts/credentials-proof.sh",
        },
        {
          name: "prove local runner privilege and ownership boundaries",
          if: "runner.os == 'Linux' && github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          "working-directory": ".",
          shell: "leg-shell --root {0}",
          run: "sh .github/scripts/run-local-proof.sh",
        },
        # The macOS leg's darwin-branch tests, which stand on no verdict
        # (ci/darwin-tests.txt).
        {
          name: "run the darwin suite",
          if: "github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform darwin-suite",
        },
        # Fails where a part of spawn's sandbox a confined test needs did
        # not hold (COSMIC_CI_REQUIRE_SANDBOX, phase_sandbox).
        {
          name: "probe the sandbox a confined test runs in",
          if: "runner.os == 'Linux' && github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform sandbox",
        },
        {
          name: "build local portable and checked artifacts",
          id: "assemble",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform assemble",
        },
        # What a save of zig's caches would carry that no build of this tree
        # reads (cosmic_ci/zig_prune.tl): only before main's save.
        {
          name: "prune the zig build outputs no step vouches for",
          if: "always() && steps.assemble.outcome == 'success' && env.COSMIC_CI_SAVES == 'true' && (github.event.schedule == '41 3 * * 0' || !startsWith(steps.zig-cache-restore.outputs.cache-matched-key, format('{0}full-', steps.names.outputs.vendor)))",
          run: "cosmic-driver cosmic_ci/driver.tl zig-prune",
        },
        {
          name: "run runtime, launcher, rebuild, and identity regressions",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform fixtures",
        },
        {
          name: "run the product suite from fresh tracked source",
          id: "portable-suite",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform portable",
        },
        {
          name: "verify the delayed portable database boundary",
          if: "always() && steps.portable-suite.outcome != 'skipped'",
          run: "cosmic-driver cosmic_ci/driver.tl platform portable-boundary \"${{ steps.portable-suite.outcome }}\"",
        },
        {
          name: "attest the exact executed product bytes",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          run: "cosmic-driver cosmic_ci/driver.tl platform attest",
        },
        # Read by the `ci` join, and by prerelease.yml as main's run ends.
        {
          name: "upload the attested product",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "portable-product-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/platform/product",
            "if-no-files-found": "error",
            "retention-days": 7,
          },
        },
        {
          name: "keep only this run's compiles and parses",
          id: "compiles-trim",
          if: "always() && steps.driver.outcome == 'success' && env.COSMIC_CI_SAVES == 'true'",
          run: "cosmic-driver cosmic_ci/driver.tl compiles-trim \"${{ steps.names.outputs.since }}\" \"${{ runner.temp }}/compiles-restored.db\"",
        },
        # A run that failed keeps what it restored too (`whole`). Cut to
        # the rows this run used, named by their digest.
        {
          name: "keep only this run's test verdicts",
          id: "verdicts-trim",
          if: "always() && steps.driver.outcome == 'success' && env.COSMIC_CI_SAVES == 'true'",
