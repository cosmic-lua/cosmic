# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "ci",

  "on": {
    # The merge queue's own gh-readonly-queue/ branches run as merge_group:
    # a push run there too would share its concurrency group and cancel it,
    # which the queue reads as a failed check.
    push: {
      "branches-ignore": [
        "gh-readonly-queue/**",
      ],
    },
    # main takes changes only through the merge queue, which waits on these
    # checks for the queued merge commit before it lands.
    merge_group: {},
    workflow_dispatch: {},
    # Every day, main's whole scope again, every test run whatever stood
    # (see COSMIC_CI_EVENT): what a key does not answer for -- the clock,
    # a flaky test -- is run where no change prompts it.
    # TODO: tell the maintainers of a red scheduled run: GitHub notifies
    # only whoever last edited this cron line. A step that opens (or
    # comments on) an issue when a scheduled run fails would, once one is
    # wanted over the checks' page.
    schedule: [{cron: "41 3 * * *"}],
  },

  permissions: {contents: "read"},

  # A newer push supersedes a branch's run, but every main run finishes:
  # what it saves (its zig build cache, its test verdicts) is what every
  # other branch can restore, and its prerelease is published only from a
  # completed run. So each main commit is a group of its own: one shared
  # group would queue each main run behind the last (minutes, with the
  # merge queue landing back to back), and GitHub keeps only one pending
  # run per group, cancelling the one queued before it when a third
  # arrives.
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}",
    "cancel-in-progress": "${{ github.ref != 'refs/heads/main' }}",
  },

  jobs: {
    # Every leg independently builds the complete product, executes the same
    # Cosmic bytes in its platform environment, and uploads them for the join.
    platform: {
      # The check is the leg's own name (linux-x86_64, ...), so rulesets can
      # require it without spelling out the matrix.
      name: "${{ matrix.name }}",
      defaults: {
        run: {
          "working-directory": "ci",
          shell: "${{ matrix.shell }}",
        },
      },
      strategy: {
        "fail-fast": false,
        matrix: {
          include: [
            # The Linux legs run in images ci-images.yml builds from
            # ci/images/ and publishes to GHCR, named here by digest: the
            # tools the actions and the build need are already installed, so
            # a run installs nothing from a package mirror, and a runner image
            # update changes only the kernel under them. The ubuntu digest is
            # the multi-arch index's, which serves both x86_64 and aarch64;
            # moving a digest is a deliberate edit, after ci-images-publish.yml
            # publishes a new one (its run summary gives it). The packages
            # are private, so the pull logs in with this job's token, which
            # needs packages: read (see the job's permissions). (macOS
            # cannot be containerized; that leg takes the image macos-15
            # names, and runs its steps on it with `sh`.)
            #
            # A Linux leg's container is started by a step, not by the
            # job's `container:` (see "start the leg's container", below):
            # its `run` steps run in it through `leg-shell`
            # (.github/scripts/leg-container.sh) as `runner`, an
            # unprivileged user of the host runner's uid, whom `prepare`
            # creates, as root, first.
            {
              name: "linux-x86_64",
              runner: "ubuntu-24.04",
              target: "x86_64-linux-musl",
              image: "ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a",
              # useradd -o: the image's own `ubuntu` user may hold the uid.
              prepare: "useradd -m -o -u \"$(stat -c %u \"$GITHUB_WORKSPACE\")\" runner",
              shell: "leg-shell {0}",
            },
            {
              name: "linux-aarch64",
              runner: "ubuntu-24.04-arm",
              target: "aarch64-linux-musl",
              image: "ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a",
              prepare: "useradd -m -o -u \"$(stat -c %u \"$GITHUB_WORKSPACE\")\" runner",
              shell: "leg-shell {0}",
            },
            {
              name: "macos-aarch64",
              runner: "macos-15",
              target: "aarch64-macos",
              image: "",
              shell: "sh",
            },
            {
              name: "alpine-x86_64",
              runner: "ubuntu-24.04",
              target: "x86_64-linux-musl",
              image: "ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72",
              prepare: "adduser -D -u \"$(stat -c %u \"$GITHUB_WORKSPACE\")\" runner",
              shell: "leg-shell {0}",
            },
          ],
        },
      },
      "runs-on": "${{ matrix.runner }}",
      permissions: {
        contents: "read",
        # To pull the Linux legs' images from GHCR.
        packages: "read",
      },
      "timeout-minutes": 45,
      env: {
        COSMIC_WORKER: "${{ matrix.name }}",
        TARGET: "${{ matrix.target }}",
        # A branch push (a PR's run) is `light`: each leg builds and runs
        # its native suite, one leg the format check (COSMIC_CI_FORMAT)
        # too, and stops.
        # The merge queue, main and a manual run are `full`: the checked
        # core, the product and portable suites, the regressions,
        # attestation and provenance, so nothing lands on main without all
        # of it.
        COSMIC_CI_SCOPE: "${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && 'full' || 'light' }}",
        # The checked core's whole suite (two to three minutes) runs on
        # linux-x86_64 alone; every leg still builds and verifies the
        # checked core. See orchestration.tl's checked_suite.
        COSMIC_CI_CHECKED_SUITE: "${{ matrix.name == 'linux-x86_64' && 'run' || 'skip' }}",
        # So does the format check (`fix --check`, which type-checks the
        # tree too), on another leg: a tree formats the same on every
        # platform, its C checked for x86_64-linux-musl on every host
        # (build/c/init.tl), and linux-x86_64, which runs the checked
        # suite, is a full run's longest leg, if only just (20:53 against
        # macos-aarch64's 20:19 in run 36340559325). See orchestration.tl's
        # format_check.
        COSMIC_CI_FORMAT: "${{ matrix.name == 'linux-aarch64' && 'run' || 'skip' }}",
        # A Linux leg fails where the sandbox probe finds a confined
        # test's parts do not all hold: its container is given what they
        # need (see "start the leg's container"). See orchestration.tl's
        # phase_sandbox. Its suites run each test's worker sandboxed
        # (COSMIC_TEST_SANDBOX=1, build/test_sandbox.tl), and fail where
        # none can be; the macOS leg's run unsandboxed.
        COSMIC_CI_REQUIRE_SANDBOX: "${{ matrix.image && '1' || '0' }}",
        # Which event started the run: a Linux leg's suites stand on the
        # verdicts their tests' declared inputs key (build/declared_key.tl),
        # this leg's earlier runs' among them (restored below), in a
        # push's run, main's and a branch's alike, and the merge queue's; a
        # manual one and the scheduled one run every test, and so does
        # the macOS leg's, whose workers run unsandboxed. See
        # orchestration.tl's `stands`.
        COSMIC_CI_EVENT: "${{ github.event_name }}",
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },

        # spawn's sandbox (core/process.h's `Sandbox`) confines a test's
        # child in a new user namespace, where it mounts, unveils and
        # goes offline. A Linux leg's container needs three relaxations
        # for it, and no more. The reports of a sandbox-options job (since
        # removed; it tried each image on its host, as uid 65534, under
        # Docker's defaults, seccomp narrowed or unconfined and AppArmor
        # unconfined, with the switch below on and off) found every part
        # -- landlock, pledge, offline, unveil, unveil+offline -- held
        # with all three in the ubuntu and alpine images on ubuntu-24.04
        # (x86_64) and in the ubuntu image on ubuntu-24.04-arm (aarch64;
        # run 36251237863, job 108429542562), and each item below says
        # what failed without it. The runners are ephemeral VMs,
        # discarded after the job.
        #
        # 1. The host's kernel.apparmor_restrict_unprivileged_userns=1
        # (the GitHub hosts set it) withholds a new user namespace's
        # capabilities from a process no AppArmor profile lets have
        # them: with it on, no container option let any part that needs
        # a namespace hold. It is the host's, so
        # .github/scripts/leg-container.sh turns it off before the
        # container starts; a kernel without the switch has no such
        # restriction to turn off.
        #
        # 2. Docker's default seccomp profile allows unshare, mount,
        # umount2 and mount_setattr only to a container holding
        # CAP_SYS_ADMIN, and pivot_root to none, so a new user namespace
        # is refused with EPERM. The profile here is that default with
        # just those five calls allowed (.github/scripts/seccomp-profile.sh
        # narrows .github/seccomp/default.json, moby's default at a pinned
        # commit, checked by its sha256), not seccomp=unconfined, which
        # held too but drops every other rule of the filter.
        #
        # 3. Docker's default AppArmor profile (docker-default) denies
        # mount: with the narrowed profile alone, unveil still failed
        # with EACCES. So the container runs unconfined by AppArmor.
        #
        # Each of these is .github/scripts/leg-container.sh's, and the
        # profile .github/scripts/seccomp-profile.sh's, so the leg's
        # container is named by those files' hash (see "name the leg's
        # container", below), which every sandboxed verdict's key holds.
        #
        # 4. Docker's masked /proc paths keep a confined child from a
        # procfs of its own; .github/scripts/leg-container.sh starts
        # every leg's container with systempaths=unconfined, and says why.
        # TODO: run the container under an AppArmor profile of
        # docker-default's with mount allowed in place of
        # apparmor=unconfined, if the runner lets a step load one
        # (apparmor_parser, as root, before the container starts) and
        # the probe finds every part holds under it.
        #
        # The runner creates a job's `container:` before any step runs,
        # so neither the switch nor the profile's file could be set up
        # for it: the container is started here instead, by
        # .github/scripts/leg-container.sh, with --init, as the job's
        # was (a process-group kill leaves orphaned descendants, and the
        # suite checks they are gone, not zombies nobody collects). From
        # here on a `run` step's shell is `leg-shell` (matrix.shell),
        # which runs it there; the actions (checkout, caches, uploads)
        # run on the host, as the host's `runner`, whose uid the
        # container's `runner` shares, so no hand-over is needed between
        # them.
        {
          name: "start the leg's container",
          if: "matrix.image",
          "working-directory": ".",
          shell: "sh",
          env: {
            IMAGE: "${{ matrix.image }}",
            TOKEN: "${{ secrets.GITHUB_TOKEN }}",
            ACTOR: "${{ github.actor }}",
          },
          run: "sh .github/scripts/leg-container.sh start \"$IMAGE\"",
        },

        {
          name: "create the unprivileged builder",
          if: "matrix.image",
          "working-directory": "/",
          # Creating the unprivileged builder (matrix.prepare) needs
          # root in the container. `runner`'s uid is read from the
          # workspace directory, so it matches the owner of the
          # checkout, RUNNER_TEMP, and the runner's own file-command
          # files, which the container holds at their host paths. Every
          # later `run` step on this leg runs as `runner` (matrix.shell).
          shell: "leg-shell --root {0}",
          run: "${{ matrix.prepare }}",
        },

        {
          name: "cache the pinned zig",
          uses: "actions/cache@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            # v2: installs are named by the pin's sha too (build/zig.tl's
            # install_name); bump it when that name's shape changes again.
            key: "zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}",
          },
        },

        # A fresh checkout starts cold: every leg would recompile vendor/
        # and core/ from nothing even when neither changed. This restores
        # zig's caches from outside the checkout, where bin/zig uses them in
        # place: its zig-cache the project cache (COSMIC_ZIG_CACHE_SEED,
        # cosmic_ci/orchestration.tl), its zig-global zig's global cache
        # (COSMIC_ZIG_GLOBAL_CACHE, set with XDG_CACHE_HOME below), and saves
        # them back once every native build this job runs has had a chance
        # to update them. zig keys what it compiles by the path of what it
        # compiles and of its include directories, so the cache is at the
        # same path each run, unlike the tree (below), and build.zig compiles
        # vendor/ and the tree's own C alike from copies in it (`Own`).
        # The key
        # includes `matrix.name`, one entry per leg, even though
        # linux-x86_64 and alpine-x86_64 target the same
        # `x86_64-linux-musl` triple: sharing a key between two legs that
        # run in parallel means only one of them can ever win the save (the
        # other fails with "another job may be creating this cache" and its
        # own compile is discarded every time), leaving it permanently
        # stuck restoring a cache some OTHER host produced, which zig
        # reuses far less effectively than one it built itself. A key per
        # leg costs a bit of duplicate cache storage in exchange for every
        # leg reliably saving and reusing its own.
        # A saved entry is never replaced under its own key, so every save
        # takes a key of its own:
        #
        #     zig-build-<leg>-<vendor>-<scope>-<core>-<run>-<attempt>
        #
        # `vendor` hashes what compiles the vendored libraries (the pin,
        # build.zig and build/zig.tl, which chooses its flags, vendor/,
        # patch/ and its applier, the configuration headers they read
        # from core/) but not the trees zig never compiles -- tl, which
        # only the boot bridge runs, tzdata and cacert -- so a change to
        # one of them (8 of the 17 commits to vendor/ or patch/ since
        # 09-01) moves no entry; `core` what compiles the core's
        # own C (core/'s .c, .h and .zig, test/portable's .c): nothing
        # else under core/, whose tests build.zig never reads. `scope` is
        # `full` where assemble ("build local portable and checked
        # artifacts") passed, all of it -- the format and codesign checks,
        # the fixtures, the checked core and its suite, the hook cores --
        # else `light`; it comes before `core` so that "a full entry for
        # this vendor part" is a prefix. Only which entry is
        # restored turns on the key: zig's cache is keyed by content, so
        # whatever is restored, the build compiles what it lacks.
        #
        # The restore takes the newest entry for this vendor part --
        # `full` with this core part, else `full`, else either -- whose
        # vendored objects are all there, so a changed core file costs a
        # recompile of that file (every core object, for a header). Where
        # none has this vendor part, a run off main takes the newest entry
        # of the leg in a second step and compiles vendor/ from what it
        # holds; main's runs compile it from nothing (below). Two steps,
        # since GitHub searches this ref's entries for every key before
        # the default branch's: in one, a branch's own entry of an older
        # vendor part would win over main's of this one.
        #
        # A run saves only where it had nothing for this vendor part --
        # where assemble passed, nothing `full` for it -- so an entry is
        # saved once per vendor part and leg, not once per core change:
        # main pushes moved the old key's inputs in 27 of 51 commits
        # (09-25 21:46 to 09-27), the core part in 23 and the vendor part
        # in 5 (build.zig in 3, build/patch.tl in 2), and 3 moved the old
        # key with nothing zig compiles. The merge queue saves nothing (no
        # other ref restores its entries), and main's scheduled run
        # restores nothing: it
        # compiles cold, minutes no one waits on, and saves a compact
        # `full` entry, which the day's runs restore until the vendor
        # part moves. Since main never takes another vendor part's entry
        # either, every entry it saves is a cold build's: about 150 MB on
        # each Linux leg and 123 MB on macOS (runs 36268737048 and
        # 36292711231), 0.6 GB a save for the four legs. So a day's saves
        # from main are 0.6 GB for the nightly and 0.6 GB for each change
        # to the vendor part, whatever the push rate: 3.6 GB at 09-26's
        # five. That is main's floor: a branch saves `light` where it
        # moved the vendor part, restorable only by its own runs, on
        # each push that moves it again, and two main runs landing back
        # to back with one new vendor part both build cold and both
        # save. The cost: a vendor change's first main run builds cold
        # (about 5 minutes more a Linux leg, 7 on macOS: runs 36292711231
        # against 36325134876), and a core change is compiled again,
        # incrementally, by every run after it until the nightly save
        # (15-29 s a leg on main's runs after one), where an eviction
        # costs a cold build of everything to whoever meets it next (the
        # fuzz job's checked core took 4m45s).
        #
        # Nor does main save where only the core part moved, though
        # every run after such a change until the nightly compiles it
        # again: that is up to 30 of main's commits a day (140 from
        # 09-17 to 09-27, 17 or more on six of those days), and a whole
        # entry is about 0.53 GB for the four legs, compressed (136-142
        # MB a Linux leg and 118 on macOS, as run 36358036690 restored them),
        # and more with each save, which carries what it restored: a
        # core change writes 29-40 MB (15 compressed, for a header) for
        # the boot's three targets alone, and assemble links more cores.
        # A save per core change is 9-16 GB a day from main at 17-30 of
        # them, past the repository's 10 GB, beside the verdicts' saves
        # (8.5-13 MB a Linux leg, trimmed, each main push a newer
        # commit's save has not overtaken).
        # TODO: keep a core change's compiles for main's later runs at
        # the cost of the change rather than of an entry: save beside
        # the entry restored only what the build wrote under zig-build
        # since (files newer than a stamp made after the restore), keyed
        # by the restored entry's run, and restore it over that entry,
        # everything since the entry in each such save so the newest
        # holds the day's core changes. That waits on the TODO below
        # (what a run adds when nothing moved would land in every such
        # save) and on room in the repository's cache.
        #
        # Before, main saved after every run and a branch wherever its
        # exact inputs missed: 230-610 MB a leg a save (run 36322968083
        # restored 584 MB on alpine, 347 on linux-x86_64, 323 on
        # linux-aarch64, 234 on macOS), about 28 GB on 09-26 from main
        # alone. The repository's cache holds 10 GB, and GitHub evicted
        # the least recently used entries: the nightly fuzz job's zig and
        # bootstrap caches (run 36321208908), and linux-x86_64's,
        # linux-aarch64's and macOS's own, which run 36292711231 found
        # under no key and compiled cold. Every save held all that was
        # restored and more, and zig never prunes its cache, so an entry
        # only grew: the Linux legs saved about 150 MB cold in run
        # 36268737048, and twelve main runs later run 36325134876 restored
        # 369 MB on linux-x86_64 and 607 MB on alpine. Alpine's was the
        # larger only for being older: the other legs' were evicted, and
        # started cold again, before run 36292711231, while alpine's
        # carried on. Nor can a sweep prune one: a build that finds its
        # outputs up to date writes nothing (h/timestamp aside), so an
        # entry it used keeps the times the restore gave it, as one it
        # did not does. The nightly cold build is what bounds an entry.
        # TODO: find what a run adds to the cache when its inputs match
        # the entry it restored, and compiles again on every such run:
        # linux-x86_64's grew 323 -> 347 -> 369 -> 388 MB over runs
        # 36317996933 to 36325134876, all with one input hash, where a
        # checkout at a new path, built from the same entry (even through
        # a tar round trip), writes nothing. zig's build runner, compiled
        # for the runner's detected CPU, is the likeliest (40 MB, and
        # about 3 s to compile here); a step listing what the build wrote
        # under zig-build (find -newer a stamp made after the restore)
        # would say.
        {
          name: "name the zig build cache",
          id: "zig-cache-key",
          shell: "sh",
          run: "echo \"vendor=zig-build-${{ matrix.name }}-${{ hashFiles('bin/zig.pin', 'build.zig', 'build.zig.zon', 'build/zig.tl', 'vendor/**', '!vendor/tl/**', '!vendor/tzdata/**', '!vendor/cacert/**', 'patch/**', '!patch/tl/**', 'build/patch.tl', 'core/ares_config.h', 'core/curl_config.h', 'core/mbedtls_cosmic_config.h', 'core/xz_config/**', 'core/darwin-compat/**') }}-\" >> \"$GITHUB_OUTPUT\"; echo \"core=${{ hashFiles('core/*.c', 'core/*.h', 'core/*.zig', 'test/portable/*.c') }}\" >> \"$GITHUB_OUTPUT\"",
        },

        {
          name: "restore zig build outputs",
          id: "zig-cache-restore",
          if: "github.event_name != 'schedule'",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-key.outputs.vendor }}full-${{ steps.zig-cache-key.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.zig-cache-key.outputs.vendor }}full-${{ steps.zig-cache-key.outputs.core }}-\n${{ steps.zig-cache-key.outputs.vendor }}full-\n${{ steps.zig-cache-key.outputs.vendor }}\n",
          },
        },

        {
          name: "restore zig build outputs of another vendor part",
          if: "github.ref != 'refs/heads/main' && steps.zig-cache-restore.outputs.cache-matched-key == ''",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-key.outputs.vendor }}full-${{ steps.zig-cache-key.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "zig-build-${{ matrix.name }}-\n",
          },
        },

        # What of the leg's container no file inside it tells, which every
        # sandboxed verdict's key holds (COSMIC_HOST_ID,
        # build/declared_key.tl's `host_identity`) and its cache is named
        # by: the image, how it is started -- the host's sysctl, the
        # seccomp profile and every docker option, all of them
        # leg-container.sh's and seccomp-profile.sh's, which are hashed --
        # and the engine's version. Not ci.yml itself, whose every edit
        # would move it. Its verdict cache is named by what else of the
        # host every key holds and differs between runners of one leg
        # (`verdicts`, .github/scripts/host-features.sh): the processor
        # features a core chooses code by (build/declared_key.tl's
        # `dispatched`, and none of the rest of /proc/cpuinfo's flags,
        # which split hosted runners on what nothing reads) and the
        # kernel's release and version, which the container's /proc
        # tells `host_identity` from the runner's kernel. Named by the
        # container alone, a run restored the newest
        # cache of any runner of the leg, and none of its verdicts stood
        # where that runner's host differed: main's run 36320764857
        # stood 0 on linux-x86_64, where its other Linux legs and two
        # branch pushes stood 1506 on the same cache. Its runners had the
        # same image and kernel release; the processor's features, which
        # no log showed, are the likeliest difference.
        {
          name: "name the leg's container",
          id: "host-id",
          if: "matrix.image",
          "working-directory": ".",
          shell: "sh",
          run: "id=\"${{ matrix.image }} ${{ hashFiles('.github/seccomp/**', '.github/scripts/leg-container.sh', '.github/scripts/seccomp-profile.sh') }} docker-$(docker version --format '{{.Server.Version}}')\"; echo \"COSMIC_HOST_ID=$id\" >> \"$GITHUB_ENV\"; prefix=\"verdicts-${{ matrix.name }}-$(printf %s \"$id\" | sha256sum | cut -c1-16)-\"; echo \"prefix=$prefix\" >> \"$GITHUB_OUTPUT\"; echo \"verdicts=$prefix$(sh .github/scripts/host-features.sh)-\" >> \"$GITHUB_OUTPUT\"",
        },

        # The test verdicts this leg reached before, in the same container
        # (COSMIC_VERDICT_CACHE, .github/scripts/cosmic-driver.sh, and the
        # portable suite's file beside it, orchestration.tl's
        # `portable_verdicts`): the newest this ref can restore under its
        # name -- its own, else main's, which is all the merge queue's
        # refs, whose runs save none, ever restore -- from a host of the
        # same features (host-features.sh). A Linux leg's push, main's or
        # a branch's, and its merge queue run stand on them
        # (COSMIC_CI_EVENT).
        {
          name: "restore test verdicts",
          id: "verdicts-restore",
          if: "matrix.image",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.host-id.outputs.verdicts }}\n",
          },
        },

        # Which run's verdicts were restored, next to the suite's own
        # lines (.github/scripts/restored-cache.sh): the suite's "shared
        # verdicts: none of ... stood" line names only this run's digests.
        {
          name: "name the restored test verdicts",
          if: "matrix.image",
          "working-directory": ".",
          shell: "sh",
          env: {KEY: "${{ steps.verdicts-restore.outputs.cache-matched-key }}"},
          run: "sh .github/scripts/restored-cache.sh 'test verdicts' \"$KEY\"",
        },

        # The compiles and parses this leg's last run used
        # (COSMIC_BUILD_CACHE, .github/scripts/cosmic-driver.sh;
        # build/shared_compiles.tl), so a boot of a tree the last run built
        # parses and compiles only what moved: the build says how many it
        # took ("taken from another checkout"). Every leg's, the macOS
        # leg's too; a full run's portable suite, a build of a fresh copy
        # of the tree by the product assembled from it, takes the boot's
        # too, where it compiles under the same identity. A compile is
        # keyed by what it was compiled from and by what compiled it, and
        # a parse by its source and the analyzer that parsed it, which a
        # boot takes only where the rows that analyzer found name it again
        # over this tree (build/importer.tl's `shared_analyzer`), so a
        # restored row that no longer answers is a miss, never a wrong
        # compile or parse, and the cache needs naming by nothing but the
        # leg: the newest this ref can restore, its own or else main's, as
        # the verdicts above are. The builds
        # hold the file to this user's and its directory to 0700, or do
        # without it; actions/cache, on the host, restores it as the
        # host's user, whose uid a Linux leg's `runner` has, with the
        # modes it was saved with less the umask. A run keeps only what
        # it used ("keep only this run's compiles and parses", below), so what is
        # saved is one tree's worth, a few MB.
        {
          name: "restore compiles and parses",
          id: "compiles-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "compiles-${{ matrix.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "compiles-${{ matrix.name }}-\n",
          },
        },

        # Which run's compiles and parses were restored, and from when on
        # a row, or a test verdict, counts as this run's: the builds and
        # the suites stamp what they use by the same clock, the
        # container's being the host's.
        {
          name: "name the restored compiles and parses",
          id: "compiles-restored",
          "working-directory": ".",
          shell: "sh",
          env: {KEY: "${{ steps.compiles-restore.outputs.cache-matched-key }}"},
          run: "sh .github/scripts/restored-cache.sh compiles \"$KEY\"; echo \"since=$(date +%s)\" >> \"$GITHUB_OUTPUT\"",
        },

        # Its cache restore runs on the host, and its bootstrap in the
        # leg's container as `runner` (matrix.shell), which a composite
        # action's steps do not take from defaults.run. No `owner`: the
        # host's user, who restores, has `runner`'s uid.
        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          uses: "./.github/actions/cosmic-driver",
          with: {
            "zig-cache": true,
            shell: "${{ matrix.shell }}",
          },
        },

        # cosmic_ci's own tests ("check the pinned CI driver", below)
        # answer the same while nothing they read changes: ci/ (the
        # driver, its tests, their testdata and the pin, which names the
        # release that runs them), bin/ (the bootstrap and the scripts
        # they run through it), the scripts and the action that install
        # the driver and place the tree, this workflow, which sets their
        # environment, and the leg's host: its image as the runner names
        # it (ImageOS, ImageVersion) and, on a Linux leg, its container
        # (COSMIC_HOST_ID's hash, in the verdicts' prefix). A marker saved
        # under a key of those after a passing check lets a branch push's
        # run skip the check on an exact hit; main's scheduled run and a
        # manual one run it whatever was saved. The key names the event,
        # which reaches the tests through the job's environment
        # (COSMIC_CI_EVENT among it), so the merge queue, whose markers no
        # other ref reads, never stands on a push's. Named before the tree
        # moves, since hashFiles reads the checkout. It takes the
        # container's `prefix`, not the verdict cache's name: the check
        # shares no verdicts (COSMIC_VERDICT_CACHE=0).
        {
          name: "name the CI driver check",
          id: "driver-check-key",
          "working-directory": ".",
          shell: "sh",
          run: "echo \"key=driver-checked-v1-${{ github.event_name }}-${{ matrix.name }}-${ImageOS:-}-${ImageVersion:-}-${{ steps.host-id.outputs.prefix }}${{ hashFiles('ci/**', 'bin/**', '.github/scripts/**', '.github/actions/cosmic-driver/**', '.github/workflows/ci.yml') }}\" >> \"$GITHUB_OUTPUT\"",
        },

        {
          name: "find a passing CI driver check",
          id: "driver-check-restore",
          if: "github.event_name == 'push'",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/driver-checked",
            key: "${{ steps.driver-check-key.outputs.key }}",
            "lookup-only": true,
          },
        },

        # After the driver's bootstrap, whose cache key hashes a file in
        # the checkout: from here on the checkout is at a path of this
        # commit's and this leg's own (COSMIC_WORKER), which the log names,
        # and $GITHUB_WORKSPACE links to it.
        # TODO: move it on the macOS leg alone (and drop the put-back and
        # re-move around the zig cache save on the Linux legs) once
        # ci/cosmic-driver.pin names a release whose `cosmic test`
        # sandboxes its workers by default: the tree's own suites here
        # already see it at /tree wherever it is (COSMIC_TEST_SANDBOX=1),
        # but "check the pinned CI driver" runs cosmic_ci's tests on that
        # release, unsandboxed, and the macOS leg has no sandbox at all.
        # Then too, the cosmic_ci tests that start the system's own
        # programs (bootstrap_test, fixture_test and runner_test start
        # /bin/sh) declare `system = true` in their `Test.needs`: a
        # sandboxed worker is given none of /usr, /bin, /lib or /etc
        # otherwise, which the pinned release does not know to refuse.
        {
          name: "move the tree to a path of this commit's own",
          "working-directory": ".",
          run: "sh .github/scripts/place-tree.sh",
        },

        {
          name: "check the pinned CI driver",
          id: "driver-check",
          if: "steps.driver-check-restore.outputs.cache-hit != 'true'",
          # Without --all, a run would assume a test no key holds from the
          # shared verdicts: this one reads none, and writes none.
          env: {COSMIC_VERDICT_CACHE: "0"},
          run: "cosmic-driver test cosmic_ci",
        },

        {
          name: "build release Cosmic and run its native suite",
          id: "release-suite",
          run: "cosmic-driver cosmic_ci/driver.tl platform build",
        },

        {
          name: "verify the delayed native database boundary",
          run: "cosmic-driver cosmic_ci/driver.tl platform local-boundary",
        },

        # Whether this leg can confine a test to its declared inputs:
        # build/sandbox_probe.tl starts a trivial child under each part
        # of spawn's sandbox and writes what held, and each refusal's
        # errno, to the run's summary, and the leg fails where a part a
        # confined test needs did not hold (COSMIC_CI_REQUIRE_SANDBOX,
        # cosmic_ci/orchestration.tl's phase_sandbox): its container lost
        # what "start the leg's container" gave it.
        {
          name: "probe the sandbox a confined test runs in",
          if: "runner.os == 'Linux'",
          run: "cosmic-driver cosmic_ci/driver.tl platform sandbox",
        },

        {
          name: "check the tree's format",
          if: "env.COSMIC_CI_SCOPE == 'light'",
          run: "cosmic-driver cosmic_ci/driver.tl platform format",
        },

        {
          name: "build local portable and checked artifacts",
          id: "assemble",
          if: "env.COSMIC_CI_SCOPE == 'full'",
          run: "cosmic-driver cosmic_ci/driver.tl platform assemble",
        },

        # The last step above to invoke `bin/zig build` for the candidate (the
        # fixture steps, `sanitized`, and `portable-hook-cores`, inside the
        # driver's `assemble` phase), so the caches are saved here, as they
        # stand, even on failure; what the phases below compile is not.
        # zig's own content addressing makes restored entries safe to
        # validate and reuse.
        #
        # actions/cache archives with `tar -C $GITHUB_WORKSPACE` and the
        # path relative to it (../../_temp/zig-build): tar follows the
        # link place-tree.sh left there, to a tree one to three
        # directories deep, where that path names nothing unless the tree
        # is one deep (tar's "Cannot stat", and no entry saved). So the
        # tree is put back where it was checked out for the save, as the
        # last step does, and moved to its own path again after, where
        # the steps below run. The restores above ran before it moved.
        {
          name: "put the tree back for the zig cache save",
          if: "always()",
          "working-directory": ".",
          shell: "sh",
          run: "[ ! -f .github/scripts/place-tree.sh ] || sh .github/scripts/place-tree.sh --restore",
        },

        # Only where the run had nothing for this vendor part, or nothing
        # `full` for it where assemble passed (see "name the zig build
        # cache"); never from the merge queue.
        {
          name: "upload zig build outputs",
          if: "always() && steps.driver.outcome == 'success' && github.event_name != 'merge_group' && !startsWith(steps.zig-cache-restore.outputs.cache-matched-key, format('{0}{1}', steps.zig-cache-key.outputs.vendor, steps.assemble.outcome == 'success' && 'full-' || ''))",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-key.outputs.vendor }}${{ steps.assemble.outcome == 'success' && 'full' || 'light' }}-${{ steps.zig-cache-key.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
          },
        },

        # Saved here, where the tree is back at the path actions/cache
        # archives from (see above), and only after a check that ran and
        # passed, whatever came after it.
        {
          name: "mark the CI driver check passed",
          if: "always() && steps.driver-check.outcome == 'success'",
          "working-directory": ".",
          shell: "sh",
          run: "mkdir -p \"$RUNNER_TEMP/driver-checked\" && echo \"${{ steps.driver-check-key.outputs.key }}\" > \"$RUNNER_TEMP/driver-checked/key\"",
        },

        {
          name: "save the CI driver check's marker",
          if: "always() && steps.driver-check.outcome == 'success' && github.event_name == 'push'",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/driver-checked",
            key: "${{ steps.driver-check-key.outputs.key }}",
          },
        },

        {
          name: "move the tree to its own path again",
          "working-directory": ".",
          run: "sh .github/scripts/place-tree.sh",
        },

        {
          name: "run the product suite from fresh tracked source",
          id: "portable-suite",
          if: "env.COSMIC_CI_SCOPE == 'full'",
          run: "cosmic-driver cosmic_ci/driver.tl platform portable",
        },

        {
          name: "verify the delayed portable database boundary",
          if: "always() && steps.portable-suite.outcome != 'skipped'",
          run: "cosmic-driver cosmic_ci/driver.tl platform portable-boundary \"${{ steps.portable-suite.outcome }}\"",
        },

        {
          name: "run runtime, launcher, rebuild, and identity regressions",
          if: "env.COSMIC_CI_SCOPE == 'full'",
          run: "cosmic-driver cosmic_ci/driver.tl platform fixtures",
        },

        {
          name: "attest the exact executed product bytes",
          if: "env.COSMIC_CI_SCOPE == 'full'",
          run: "cosmic-driver cosmic_ci/driver.tl platform attest \"${{ strategy.job-total }}\"",
        },

        # The compiles and parses the next run restores are the ones this
        # run used or made, since "name the restored compiles and parses":
        # the cache bounds itself only at 256 MB, and every change to the
        # build's own modules moves every key, so a file saved back whole
        # would grow by a tree's worth of rows with most commits to main. Here,
        # before the container goes, after the last build that shares
        # them (the fixtures share none: cosmic_ci/orchestration.tl's
        # `fixture`); saved below, only where the native build passed. A
        # trim that cannot read the file says why and fails nothing, as
        # the builds fail nothing over it.
        {
          name: "keep only this run's compiles and parses",
          if: "always() && steps.driver.outcome == 'success'",
          run: "cosmic-driver cosmic_ci/driver.tl compiles-trim \"${{ steps.compiles-restored.outputs.since }}\"",
        },

        # The verdicts the next run of the leg restores are the ones this
        # run relied on or reached, since "name the restored compiles"
        # (cosmic_ci/verdicts.tl): the suites stamp each row they stood on
        # or wrote. A file holds up to 8192 rows, some 3 KB each, most of
        # them under keys no later run reaches, since every change to
        # build/ moves every key: saved whole, a leg's verdicts.db and
        # portable.db came to 41-43 MB compressed each main push, 0.13 GB
        # for the three Linux legs, into the 10 GB the repository's cache
        # holds for the zig caches too. Trimmed, a leg saves what its
        # run's suites reached: the native suite's in verdicts.db and the
        # portable suite's in portable.db, some 3900 rows and about 8.5 MB
        # compressed on linux-aarch64 and alpine-x86_64, and on
        # linux-x86_64, the one leg that runs the checked suite
        # (COSMIC_CI_CHECKED_SUITE), its rows too in verdicts.db, some
        # 5800 rows and about 13 MB. The cost, the choice compiles-trim
        # made: main's saved file holds only its newest commit's keys, so a
        # branch based on an older main, whose keys a change to build/ has
        # since moved, runs every test again, where a whole file's two to
        # four runs of rows might have served it. Only where every step
        # before it passed: a run that stopped short, or failed, saves
        # what it restored with what it reached, as before, which the
        # rows' own bound holds. Here, before the container goes, after
        # the last suite that shares them (the fixtures share none).
        {
          name: "keep only this run's test verdicts",
          if: "success() && matrix.image",
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-trim \"${{ steps.compiles-restored.outputs.since }}\"",
        },

        {
          name: "summarize worker operations",
          if: "always() && steps.driver.outcome == 'success'",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },

        {
          name: "preserve CI driver database",
          if: "always()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "ci-driver-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/operations.db",
            "if-no-files-found": "ignore",
          },
        },

        {
          name: "upload the attested product",
          if: "env.COSMIC_CI_SCOPE == 'full'",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "portable-product-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/platform/product",
            "if-no-files-found": "error",
          },
        },

        {
          name: "preserve platform failure diagnostics",
          if: "failure()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "platform-diagnostics-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/platform/local-diagnostics\n${{ runner.temp }}/cosmic-ci/platform/portable-diagnostics\n${{ runner.temp }}/cosmic-ci/platform/fixture-test-diagnostics\n",
            "if-no-files-found": "ignore",
          },
        },

        # What the leg's container said and how it stood, where the job
        # failed: a step it ran that stopped, or the container itself.
        {
          name: "describe the leg's container",
          if: "failure() && matrix.image",
          "working-directory": "/",
          shell: "sh",
          run: "docker inspect cosmic-leg || :; docker logs cosmic-leg || :",
        },

        # Whatever came before, so nothing a step left running there (a
        # cancelled one's processes) writes to the tree the next step
        # moves back.
        {
          name: "remove the leg's container",
          if: "always() && matrix.image",
          "working-directory": "/",
          shell: "sh",
          run: "docker rm -f cosmic-leg || :",
        },

        # Whatever failed before it, and before the saves, so the check
        # before them, which fetches from origin, and the checkout's post
        # step meet the tree where it was checked out: there its git finds
        # the credentials actions/checkout left, and at another path the
        # post step's refuses the repository and leaves them behind
        # (.github/scripts/place-tree.sh). It runs on the host, as the
        # host's user, who moved it on macOS and whose uid the Linux
        # legs' container's `runner`, who moved it there, shares; so it
        # runs even where that container never started. A checkout that
        # never happened has nothing to move back.
        {
          name: "move the tree back to where it was checked out",
          if: "always()",
          "working-directory": ".",
          shell: "sh",
          run: "[ ! -f .github/scripts/place-tree.sh ] || sh .github/scripts/place-tree.sh --restore",
        },

        # What every suite of the leg reached, the portable suite's in a
        # file of its own, saved after the last of them, whatever failed
        # (a failing verdict takes a passing one out), under a key of this
        # run's own, which names its commit, for the next run of this leg
        # in the same container -- on this ref, or, from main, on any --
        # to restore, trimmed to what this run reached where it passed
        # ("keep only this run's test verdicts", above): from main after
        # every run but a push whose commit a newer commit's save has
        # overtaken (below), and elsewhere only where nothing was
        # restored, so a branch's pushes do not fill the repository's
        # cache; never from the merge queue, whose refs no later run
        # restores. After the tree is back where it was checked out, for
        # the reason the zig cache save above is.
        # TODO: merge what a run owes the cache into the newest saved one
        # as it saves, or save main's runs one at a time: two main runs at
        # once each save from what they restored, and the later save can
        # bring back a pass the other's failure took out, or, where the
        # one that failed finds a newer commit's save before its own and
        # saves nothing, never see it taken out. The merge queue stands
        # on what main saved, so such a pass lets a change land without
        # the test running on the Linux legs (the macOS leg still runs
        # every test); the scheduled run, which stands on nothing, bounds
        # how long one stands. Saving one at a time would also close the
        # window the lookup below leaves: an older commit's run A leaves
        # its rows the newest where A's lookup comes before a descendant
        # B's save and A's own save lands after it -- a window of A's
        # lookup, check, tar and upload, not a moment -- until main's next
        # run saves.
        #
        # A push to main saves unless the newest entry a restore would
        # take now was saved from a descendant of its commit. A restore
        # takes the newest entry saved under the prefix, not the newest
        # commit's, and main's runs, a concurrency group per commit,
        # overlap and finish out of order: 3c6df8333's alpine-x86_64 leg
        # saved at 18:37:20, after b6508ab77's at 18:36:56, so the next
        # two main runs (c0da68b11, e4cdd4292) restored 3c6df8333's
        # verdicts, keyed before #2249 changed the key, and stood on none
        # of 1892, where linux-x86_64, whose saves came in commit order,
        # stood on 1184. So a lookup just before the save (no download)
        # reads which entry is the newest, and its key the commit that
        # saved it (.github/scripts/save-unless-descendant.sh): where a
        # later commit's run saved first, this one does not, so a push
        # moves the newest entry's commit only forward along main, but
        # for the window the TODO above names. Saving
        # only while a commit was still main's head kept that order too,
        # but threw away the work of every run a merge overtook: run
        # 36358036690 (e34b5eb31) reached 1941 verdicts under keys a
        # harness change had just moved, its four legs saved none of them
        # as the next commit landed, and main's next run ran them all
        # again. Where the newest entry's commit cannot be read (a key
        # saved before keys named one, a fetch that failed) the run
        # saves, as every main run once did: a lost save costs the next
        # run the verdicts this one reached, an older one's those of
        # every test a newer commit moved -- all of them, where it moved
        # the key. The scheduled run and a manual one save whatever
        # landed since, with no lookup: a scheduled run runs every test,
        # and its save is what bounds how long a pass stands. So one that
        # finishes after a descendant push saved leaves its older
        # commit's entry the newest, as under the head-only rule, until
        # main's next push saves.
        {
          name: "find the newest saved test verdicts",
          id: "verdicts-newest",
          if: "always() && matrix.image && steps.driver.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.host-id.outputs.verdicts }}\n",
            "lookup-only": true,
          },
        },

        {
          name: "find whether a newer commit saved test verdicts",
          id: "verdicts-saves",
          if: "always() && matrix.image && steps.driver.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'",
          "working-directory": ".",
          shell: "sh",
          env: {KEY: "${{ steps.verdicts-newest.outputs.cache-matched-key }}"},
          run: "sh .github/scripts/save-unless-descendant.sh \"$KEY\"",
        },

        {
          name: "save test verdicts",
          if: "always() && matrix.image && steps.driver.outcome == 'success' && github.event_name != 'merge_group' && (github.ref == 'refs/heads/main' && steps.verdicts-saves.outputs.save != 'false' || github.ref != 'refs/heads/main' && steps.verdicts-restore.outputs.cache-matched-key == '')",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
          },
        },

        # What the next run of the leg restores, trimmed above to this
        # run's, saved when and where the verdicts are, for their reasons,
        # under a key that names its commit: from main unless a newer
        # commit's run saved first, found by a lookup of its own just
        # before, so an older run's rows never come to be the newest;
        # elsewhere only where nothing was restored; never from the merge
        # queue. Every leg's, the macOS leg's too. Only where the native
        # build and suite passed: a run that stopped short would leave the
        # next only what it reached (see "keep only this run's compiles
        # and parses").
        {
          name: "find the newest saved compiles and parses",
          id: "compiles-newest",
          if: "always() && steps.driver.outcome == 'success' && steps.release-suite.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "compiles-${{ matrix.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "compiles-${{ matrix.name }}-\n",
            "lookup-only": true,
          },
        },

        {
          name: "find whether a newer commit saved compiles and parses",
          id: "compiles-saves",
          if: "always() && steps.driver.outcome == 'success' && steps.release-suite.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'",
          "working-directory": ".",
          shell: "sh",
          env: {KEY: "${{ steps.compiles-newest.outputs.cache-matched-key }}"},
          run: "sh .github/scripts/save-unless-descendant.sh \"$KEY\"",
        },

        {
          name: "save compiles and parses",
          if: "always() && steps.driver.outcome == 'success' && steps.release-suite.outcome == 'success' && github.event_name != 'merge_group' && (github.ref == 'refs/heads/main' && steps.compiles-saves.outputs.save != 'false' || github.ref != 'refs/heads/main' && steps.compiles-restore.outputs.cache-matched-key == '')",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "compiles-${{ matrix.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
          },
        },
      ],
    },

    # The one check a ruleset requires, whatever a run's scope: it fails
    # when any leg failed or was cancelled, and on a full run
    # (COSMIC_CI_SCOPE) it is also the provenance join. Every successful
    # platform/environment execution must attest and upload identical
    # Cosmic bytes; local product tests retain manifest, range,
    # application, and raw-core verification, so the join only proves the
    # cross-platform byte identity. The join is this job's steps rather
    # than a job of its own, which a branch push would show as skipped;
    # prerelease.yml publishes from main's completed runs.
    ci: {
      needs: "platform",
      if: "always()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      env: {
        COSMIC_WORKER: "provenance",
        # Only a full run's legs attest and upload a product.
        FULL: "${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}",
      },
      steps: [
        {
          name: "every leg passed",
          env: {RESULT: "${{ needs.platform.result }}"},
          run: "echo \"platform: $RESULT\"; [ \"$RESULT\" = success ]",
        },
        {
          if: "env.FULL == 'true'",
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },
        {
          name: "bootstrap the pinned provenance driver",
          id: "driver",
          if: "env.FULL == 'true'",
          uses: "./.github/actions/cosmic-driver",
        },
        {
          if: "env.FULL == 'true'",
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            pattern: "portable-product-*",
            path: "${{ runner.temp }}/cosmic-ci/products",
          },
        },
        {
          name: "compare the Cosmic bytes executed on every native host",
          if: "env.FULL == 'true'",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl provenance",
        },
        {
          name: "summarize provenance operations",
          if: "always() && steps.driver.outcome == 'success'",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },
        {
          name: "preserve provenance operations",
          if: "always() && env.FULL == 'true'",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "provenance-operations",
            path: "${{ runner.temp }}/cosmic-ci/operations.db",
            "if-no-files-found": "ignore",
          },
        },
      ],
    },
  },
}
