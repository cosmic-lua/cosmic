name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `bin/zig build cores` cross-compiles every target from any host, so
  # this is not "one job per platform" testing its own build -- it is
  # the same work, run three times on three unrelated hosts, each
  # independently producing a complete build of the whole tree (every
  # image, the database, all three cross-compiled binaries, tested and
  # packaged). The work is identical by construction, so a matrix says
  # that once instead of three copies of the same steps -- and nothing
  # here needs another leg to finish first: three full builds at once,
  # not one canonical build with the other two waiting on it.
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-24.04
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - name: macos-aarch64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The pinned compiler is the one thing a fresh clone fetches, and
      # the pin is the cache key: a bump starts cold. runner.arch keeps
      # the two Linux legs from colliding on one key for two different
      # zig tarballs.
      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}

      - name: build every core, then the database and the binaries
        run: bin/zig build cores boot

      - name: prepare the unchanged portable runtime and integrity probe
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/work-db-diagnostics"
          mkdir -p "$diagnostics"
          cp test/portable/work_db_integrity.tl.in \
            "$RUNNER_TEMP/work_db_integrity.tl"
          cat > "$RUNNER_TEMP/snapshot-work-db" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label=${1:?usage: snapshot-work-db LABEL}
          snapshot="$RUNNER_TEMP/work-db-diagnostics/$label"
          mkdir -p "$snapshot"
          cp "$GITHUB_WORKSPACE/o/build.db" "$snapshot/build.db"
          if [ -e "$GITHUB_WORKSPACE/o/build.db-journal" ]; then
            cp "$GITHUB_WORKSPACE/o/build.db-journal" \
              "$snapshot/build.db-journal"
          fi
          wc -c "$snapshot/build.db" > "$snapshot/build.db.bytes"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$snapshot" && sha256sum build.db > build.db.sha256)
            if [ -e "$snapshot/build.db-journal" ]; then
              (cd "$snapshot" && sha256sum build.db-journal > \
                build.db-journal.sha256)
            fi
          else
            (cd "$snapshot" && shasum -a 256 build.db > build.db.sha256)
            if [ -e "$snapshot/build.db-journal" ]; then
              (cd "$snapshot" && shasum -a 256 build.db-journal > \
                build.db-journal.sha256)
            fi
          fi
          if [ -e "$snapshot/build.db-journal" ]; then
            wc -c "$snapshot/build.db-journal" > \
              "$snapshot/build.db-journal.bytes"
          fi
          set +e
          (
            cd "$RUNNER_TEMP"
            "$GITHUB_WORKSPACE/o/bin/cosmic" work_db_integrity.tl \
              "$snapshot/build.db"
          ) >"$snapshot/integrity.out" 2>"$snapshot/integrity.err"
          status=$?
          set -e
          cat "$snapshot/integrity.out"
          cat "$snapshot/integrity.err" >&2
          exit "$status"
          SH
          chmod 755 "$RUNNER_TEMP/snapshot-work-db"
          o/bin/cosmic test/portable/write_runtime_fixture.tl \
            o/targets.tsv o/core o/cosmic.portable.db \
            "$RUNNER_TEMP/cosmic-portable"
          chmod 755 "$RUNNER_TEMP/cosmic-portable"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$RUNNER_TEMP/cosmic-portable" > \
              "$diagnostics/portable-artifact.before.sha256"
          else
            shasum -a 256 "$RUNNER_TEMP/cosmic-portable" > \
              "$diagnostics/portable-artifact.before.sha256"
          fi
          wc -c "$RUNNER_TEMP/cosmic-portable" > \
            "$diagnostics/portable-artifact.before.bytes"
          ls -l "$RUNNER_TEMP/cosmic-portable" > \
            "$diagnostics/portable-artifact.before.listing"

      - name: run every native test and snapshot the working database
        id: native-test
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/work-db-diagnostics"
          snapshot="$diagnostics/native-immediate"
          mkdir -p "$snapshot"
          if command -v timeout >/dev/null 2>&1; then
            bound=(timeout 30)
          elif command -v gtimeout >/dev/null 2>&1; then
            bound=(gtimeout 30)
          else
            bound=()
            echo "::notice::timeout is unavailable; the native suite runs once under the existing 20-minute job bound"
          fi
          set +e
          "${bound[@]}" o/bin/cosmic test > \
            "$diagnostics/native-test.out" 2>"$diagnostics/native-test.err"
          status=$?
          set -e
          cat "$diagnostics/native-test.out"
          cat "$diagnostics/native-test.err" >&2
          "$RUNNER_TEMP/snapshot-work-db" native-immediate
          [ "$status" -eq 0 ]
          grep -E 'test: PASS \([^;]+; [1-9][0-9]* ran, 0 stood\)' \
            "$diagnostics/native-test.out" >/dev/null

      - name: verify the native snapshot survives the workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/work-db-diagnostics"
          immediate="$diagnostics/native-immediate"
          boundary="$diagnostics/native-boundary"
          "$RUNNER_TEMP/snapshot-work-db" native-boundary
          cmp "$immediate/build.db.sha256" "$boundary/build.db.sha256"
          if [ -e "$immediate/build.db-journal" ] || \
             [ -e "$boundary/build.db-journal" ]; then
            [ -e "$immediate/build.db-journal" ]
            [ -e "$boundary/build.db-journal" ]
            cmp "$immediate/build.db-journal" "$boundary/build.db-journal"
          fi

      - name: run every test through unchanged portable Cosmic
        id: portable-test
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/work-db-diagnostics"
          snapshot="$diagnostics/portable-immediate"
          cache="$RUNNER_TEMP/portable-full-suite-cache"
          mkdir -p "$snapshot"
          if command -v timeout >/dev/null 2>&1; then
            bound=(timeout 30)
          elif command -v gtimeout >/dev/null 2>&1; then
            bound=(gtimeout 30)
          else
            bound=()
            echo "::notice::timeout is unavailable; the portable suite runs once under the existing 20-minute job bound"
          fi
          set +e
          COSMIC_PORTABLE_CACHE="$cache" \
            "${bound[@]}" "$RUNNER_TEMP/cosmic-portable" test > \
              "$diagnostics/portable-test.out" \
              2>"$diagnostics/portable-test.err"
          status=$?
          set -e
          cat "$diagnostics/portable-test.out"
          cat "$diagnostics/portable-test.err" >&2
          if [ -d "$cache" ]; then
            find "$cache" -maxdepth 1 -type f -exec ls -l {} \; | sort > \
              "$diagnostics/portable-cache-files.txt"
          else
            printf 'cache directory was not created\n' > \
              "$diagnostics/portable-cache-files.txt"
          fi
          "$RUNNER_TEMP/snapshot-work-db" portable-immediate
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$diagnostics/portable-artifact.before.sha256"
          else
            shasum -a 256 -c "$diagnostics/portable-artifact.before.sha256"
          fi
          [ "$status" -eq 0 ]
          grep -E 'test: PASS \([^;]+; [1-9][0-9]* ran, 0 stood\)' \
            "$diagnostics/portable-test.out" >/dev/null

      - name: snapshot the final workflow boundary
        id: final-work-db
        if: always()
        shell: bash
        env:
          PORTABLE_OUTCOME: ${{ steps.portable-test.outcome }}
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/work-db-diagnostics"
          immediate="$diagnostics/portable-immediate"
          boundary="$diagnostics/portable-boundary"
          [ -f o/build.db ]
          "$RUNNER_TEMP/snapshot-work-db" portable-boundary
          if [ "$PORTABLE_OUTCOME" = success ]; then
            cmp "$immediate/build.db.sha256" "$boundary/build.db.sha256"
            if [ -e "$immediate/build.db-journal" ] || \
               [ -e "$boundary/build.db-journal" ]; then
              [ -e "$immediate/build.db-journal" ]
              [ -e "$boundary/build.db-journal" ]
              cmp "$immediate/build.db-journal" "$boundary/build.db-journal"
            fi
          fi

      - name: preserve working-database failure evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: work-db-diagnostics-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/work-db-diagnostics
            ${{ runner.temp }}/cosmic-portable
          if-no-files-found: ignore

      - name: the tree renders exactly as `cosmic fix` would write it
        run: o/bin/cosmic fix --check .

      # The only place the signature `build/attach.tl` wrote is judged
      # by the system that has to accept it. A no-op everywhere but
      # macOS -- see bin/verify-codesign -- so this is the same step on
      # every leg of the matrix, checking each binary against itself.
      - name: the macOS binary's signature, if this host can judge it
        run: bin/verify-codesign o/bin/cosmic-aarch64-macos

      - name: what the build produced
        run: |
          ls -l o/bin o/cosmic.db
          file o/bin/cosmic-*

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binaries-${{ matrix.name }}
          path: |
            o/bin/cosmic-x86_64-linux-musl
            o/bin/cosmic-aarch64-linux-musl
            o/bin/cosmic-aarch64-macos
            o/cosmic.db
          if-no-files-found: error

  # A fourth core, built with undefined-behavior checking on, running the
  # whole build and test suite. It is not a shipped artifact; it is the
  # run that would report what the release build would only do quietly.
  sanitized:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}
      - name: build the tree with the checked core
        run: bin/zig build sanitized
      - name: run every test with the checked core
        run: |
          cmp -n "$(wc -c < o/sanitized/cosmic-core)" \
            o/sanitized/cosmic-core o/sanitized/bin/cosmic
          # Measured at ~29.7s locally even after the coverage/formatter
          # performance stack; a shared CI runner has less headroom than
          # that, so this keeps real margin rather than matching the
          # ordinary suite's tighter limit.
          timeout 90 o/sanitized/bin/cosmic test

  # The provenance gate: three unrelated hosts -- different kernels,
  # different system libraries, different checkout paths by
  # construction -- cross-compiling the same commit must produce the
  # same three shipped binaries, byte for byte. build/boot.tl makes
  # this true by construction: `host`/`host_image` in the database
  # `build/attach.tl` embeds name whichever target the attaching
  # host's own build matched (`build/reboot.tl` reads them back to
  # find a stale tool's own image), so each of the three binaries is
  # retagged with ITS OWN target's name and image hash before it is
  # attached, never the building machine's -- attaching o/cosmic.db
  # verbatim to all three would make two of them misname themselves
  # AND make the same target cross-compiled on two different hosts
  # differ by nothing but that. o/cosmic.db itself is excluded from
  # this comparison on purpose: it is this build's own project
  # database, not a shipped target, and correctly names this specific
  # host. Nothing here rebuilds anything; it only diffs what the
  # matrix above already made, so this costs a download, not a build.
  provenance:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binaries-*
          path: dl
      - name: every host produces the same three binaries
        shell: bash
        run: |
          set -euo pipefail
          # Each artifact lands zipped in its own subdirectory; extracted
          # there, in place, so three artifacts that all hold a file
          # named bin/cosmic-x86_64-linux-musl never collide.
          for z in $(find dl -type f -name '*.zip'); do
            python3 -m zipfile -e "$z" "$(dirname "$z")"
          done
          hosts=(linux-x86_64 linux-aarch64 macos-aarch64)
          first=${hosts[0]}
          for host in "${hosts[@]:1}"; do
            for target in x86_64-linux-musl aarch64-linux-musl aarch64-macos; do
              cmp "dl/binaries-$first/bin/cosmic-$target" \
                  "dl/binaries-$host/bin/cosmic-$target"
            done
          done
          echo "provenance: PASS (linux-x86_64, linux-aarch64 and macos-aarch64 produce byte-identical binaries for every target)"
