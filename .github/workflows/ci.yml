name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every leg independently builds the complete product, executes the same
  # Cosmic bytes in its platform environment, and uploads them for the join.
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
            alpine: false
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
            alpine: false
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-macos
            alpine: false
          - name: alpine-x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
            alpine: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: cache the pinned CI driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/ci-driver
          key: ci-driver-${{ hashFiles('test/ci/cosmic-driver.pin') }}

      - name: bootstrap and check the pinned CI driver
        shell: bash
        run: |
          sh test/ci/bootstrap-driver.sh test/ci/cosmic-driver.pin \
            "$HOME/.cache/cosmic/ci-driver" \
            "$RUNNER_TEMP/cosmic-driver-project" \
            "$RUNNER_TEMP/cosmic-driver"
          {
            echo "COSMIC_DRIVER=$RUNNER_TEMP/cosmic-driver"
            echo "COSMIC_DRIVER_PROJECT=$RUNNER_TEMP/cosmic-driver-project"
            echo "COSMIC_OPERATIONS_DB=$RUNNER_TEMP/platform/operations.db"
          } >> "$GITHUB_ENV"
          sh test/ci/driver/selfcheck.sh "$RUNNER_TEMP/cosmic-driver" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cosmic-driver-selfcheck"

      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}

      # `bin/zig` keeps its compile cache under o/ (see its own comment)
      # so a fresh checkout starts cold: every leg recompiles vendor/ and
      # core/ from nothing even when neither changed. This restores that
      # cache from outside the checkout -- the driver build phase requires
      # a checkout with no o/ yet, so COSMIC_ZIG_CACHE_SEED below only
      # names where it landed; the driver seeds it into o/ itself, once
      # its own guard has passed -- and saves it back once every native
      # build this job runs has had a chance to update it. The key
      # includes `matrix.name`, one entry per leg, even though
      # linux-x86_64 and alpine-x86_64 build the same cross-compiled
      # `cores` output: sharing a key between two legs that run in
      # parallel means only one of them can ever win the save (the other
      # fails with "another job may be creating this cache" and its own
      # compile is discarded every time), leaving it permanently stuck
      # restoring a cache some OTHER host produced, which zig reuses far
      # less effectively than one it built itself. A key per leg costs a
      # bit of duplicate cache storage in exchange for every leg reliably
      # saving and reusing its own.
      - name: cache zig build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig-build
          key: zig-build-${{ matrix.name }}-${{ hashFiles('bin/zig.pin', 'build.zig', 'build.zig.zon', 'core/**', 'test/portable/*.c', 'vendor/**', 'patch/**') }}
          restore-keys: |
            zig-build-${{ matrix.name }}-

      - name: build release Cosmic and run its native suite
        id: release-suite
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export COSMIC_ZIG_CACHE_SEED=~/.cache/cosmic/zig-build
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform build \
            "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: verify the delayed native database boundary
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform local-boundary
          "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID"
          "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: build local portable and checked artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform assemble
          "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID"
          "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      # The last step above to invoke `bin/zig build` (the fixture steps,
      # `sanitized`, and `portable-hook-cores`, inside the driver's `assemble`
      # phase); nothing after this point builds native code. Runs even on
      # failure so the complete local cache is staged before diagnostics.
      # actions/cache publishes it only when the job succeeds; zig's own
      # content addressing makes restored entries safe to validate and reuse.
      - name: save zig build outputs for next run
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export COSMIC_ZIG_CACHE_SEED="$HOME/.cache/cosmic/zig-build"
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform cache-save \
            "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: run the product suite from fresh tracked source
        id: portable-suite
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform portable
          "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID"
          "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: verify the delayed portable database boundary
        if: always() && steps.portable-suite.outcome != 'skipped'
        env:
          TARGET: ${{ matrix.target }}
          PORTABLE_OUTCOME: ${{ steps.portable-suite.outcome }}
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform portable-boundary
          "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID"
          "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"
          "${{ steps.portable-suite.outcome }}"

      - name: run runtime, launcher, rebuild, and identity regressions
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform fixtures
          "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID"
          "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: run offline unprivileged BusyBox checks
        if: matrix.alpine
        env:
          TARGET: ${{ matrix.target }}
          COSMIC_CI_RUNNER: ${{ runner.temp }}/cosmic-driver
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform alpine
          "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID"
          "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: attest the exact executed product bytes
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_PLATFORMS: ${{ strategy.job-total }}
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" platform attest
          "$COSMIC_OPERATIONS_DB" "${{ matrix.name }}" "$GITHUB_RUN_ID"
          "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"
          "$EXPECTED_PLATFORMS"

      - name: summarize worker operations
        if: always()
        run: |
          if [ ! -f "$COSMIC_OPERATIONS_DB" ]; then
            echo '## Cosmic CI operations' >> "$GITHUB_STEP_SUMMARY"
            echo 'Operation database unavailable (bootstrap failed).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" report \
            "$COSMIC_OPERATIONS_DB" "$RUNNER_TEMP/platform/operations.md"
          cat "$RUNNER_TEMP/platform/operations.md" >> "$GITHUB_STEP_SUMMARY"

      - name: summarize CI driver checks
        if: always()
        shell: bash
        run: |
          db="$RUNNER_TEMP/cosmic-driver-selfcheck/worker state/operations.db"
          if [ ! -f "$db" ]; then
            echo '## Cosmic CI operations' >> "$GITHUB_STEP_SUMMARY"
            echo 'Driver database unavailable (bootstrap or self-check failed before its first operation).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$RUNNER_TEMP/cosmic-driver" \
            "$RUNNER_TEMP/cosmic-driver-project/driver.tl" report \
            "$db" \
            "$RUNNER_TEMP/cosmic-driver-selfcheck/driver-report.md"
          cat "$RUNNER_TEMP/cosmic-driver-selfcheck/driver-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: preserve CI driver database
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ci-driver-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/cosmic-driver-selfcheck/worker state/operations.db
            ${{ runner.temp }}/cosmic-driver-selfcheck/driver-report.md
            ${{ runner.temp }}/platform/operations.db
            ${{ runner.temp }}/platform/operations.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: portable-product-${{ matrix.name }}
          path: ${{ runner.temp }}/platform/product
          if-no-files-found: error

      - name: preserve platform failure diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: platform-diagnostics-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/platform/local-diagnostics
            ${{ runner.temp }}/platform/portable-diagnostics
            ${{ runner.temp }}/platform/alpine-diagnostics
            ${{ runner.temp }}/platform/fixture-test-diagnostics
            ${{ runner.temp }}/platform/self-rebuild-diagnostics
            ${{ runner.temp }}/platform/runtime-diagnostics
          if-no-files-found: ignore

  # Every successful platform/environment execution must attest and upload
  # identical Cosmic bytes. Local product tests retain manifest, range,
  # application, and raw-core verification, so this join only proves the
  # cross-platform byte identity.
  provenance:
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: cache the pinned CI driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/ci-driver
          key: ci-driver-${{ hashFiles('test/ci/cosmic-driver.pin') }}
      - name: bootstrap the pinned provenance driver
        run: |
          sh test/ci/bootstrap-driver.sh test/ci/cosmic-driver.pin \
            "$HOME/.cache/cosmic/ci-driver" \
            "$RUNNER_TEMP/cosmic-driver-project" "$RUNNER_TEMP/cosmic-driver"
          {
            echo "COSMIC_DRIVER=$RUNNER_TEMP/cosmic-driver"
            echo "COSMIC_DRIVER_PROJECT=$RUNNER_TEMP/cosmic-driver-project"
            echo "COSMIC_OPERATIONS_DB=$RUNNER_TEMP/provenance-operations.db"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: portable-product-*
          path: ${{ runner.temp }}/products
      - name: compare the Cosmic bytes executed on every native host
        run: >-
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" provenance
          "$COSMIC_OPERATIONS_DB" provenance "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          "$GITHUB_WORKSPACE" "$RUNNER_TEMP/products"
      - name: summarize provenance operations
        if: always()
        run: |
          if [ ! -f "$COSMIC_OPERATIONS_DB" ]; then
            echo '## Cosmic CI operations' >> "$GITHUB_STEP_SUMMARY"
            echo 'Provenance operation database unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$COSMIC_DRIVER" "$COSMIC_DRIVER_PROJECT/driver.tl" report \
            "$COSMIC_OPERATIONS_DB" "$RUNNER_TEMP/provenance-operations.md"
          cat "$RUNNER_TEMP/provenance-operations.md" >> "$GITHUB_STEP_SUMMARY"
      - name: preserve provenance operations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: provenance-operations
          path: |
            ${{ runner.temp }}/provenance-operations.db
            ${{ runner.temp }}/provenance-operations.md
          if-no-files-found: ignore

  prerelease:
    needs: provenance
    if: >-
      github.repository == 'cosmic-lua/cosmic' &&
      github.ref == 'refs/heads/next' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    uses: ./.github/workflows/prerelease.yml
