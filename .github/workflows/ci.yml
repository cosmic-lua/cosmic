          with: {
            name: "platform-diagnostics-linux-x86_64-checked-narrowing",
            path: "${{ runner.temp }}/cosmic-ci/platform/local-diagnostics",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "describe the leg's container",
          if: "failure()",
          "working-directory": "/",
          shell: "sh",
          run: "docker inspect cosmic-leg || :; docker logs cosmic-leg || :",
        },
        # Whatever came before, so nothing left running there writes to
        # the tree the next step moves back.
        {
          name: "remove the leg's container",
          if: "always()",
          "working-directory": "/",
          shell: "sh",
          run: "docker rm -f cosmic-leg || :",
        },
        # Before checkout's post step, whose git refuses the repository at
        # another path, and before the saves, whose paths actions/cache
        # names relative to the workspace (driver.tl place-tree).
        {
          name: "move the tree back to where it was checked out",
          if: "always() && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree --restore",
        },
        # Whatever failed (a failing verdict takes a passing one out),
        # where the rows differ from the entry restored. Not the macOS
        # leg's scheduled runs: its keys hold the tree's path, which such a
        # run chooses by the commit (driver.tl place-tree), so its rows
        # would answer no other run.
        {
          name: "save test verdicts",
          if: "always() && steps.verdicts-trim.outputs.digest != '' && !(github.event_name == 'schedule' && env.COSMIC_CI_DECLARED_KEYS == '1') && steps.verdicts-restore.outputs.cache-matched-key != format('{0}{1}', steps.host-id.outputs.verdicts, steps.verdicts-trim.outputs.digest)",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}${{ steps.verdicts-trim.outputs.digest }}",
          },
        },
      ],
    },

    # The one check a ruleset requires: it fails when a leg, the checked
    # suite or the checked narrowing run failed or was cancelled (the two
    # read as passed in the merge queue and on a pull request, which skip
    # them), and on main's runs it is the provenance join, proving the legs
    # attested identical bytes: a push's three, the scheduled and a manual
    # run's four.
    ci: {
      needs: ["platform", "checked", "narrowing"],
      if: "always()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      env: {COSMIC_WORKER: "provenance"},
      steps: [
        {
          name: "every job passed",
          env: {
            RESULT: "${{ needs.platform.result }}",
            CHECKED: "${{ (github.event_name == 'merge_group' || github.event_name == 'pull_request') && 'success' || needs.checked.result }}",
            NARROWING: "${{ (github.event_name == 'merge_group' || github.event_name == 'pull_request') && 'success' || needs.narrowing.result }}",
          },
          run: "echo \"legs: $RESULT; checked suite: $CHECKED; checked narrowing: $NARROWING\"; [ \"$RESULT\" = success ] && [ \"$CHECKED\" = success ] && [ \"$NARROWING\" = success ]",
        },
        {
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },
        {
          name: "bootstrap the pinned provenance driver",
          id: "driver",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          uses: "./.github/actions/cosmic-driver",
        },
        {
          name: "download the products to compare",
          id: "products-download",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {pattern: "portable-product-*", path: "${{ runner.temp }}/cosmic-ci/products"},
        },
        {
          name: "download the products to compare: wait before the second try",
          if: "steps.products-download.outcome == 'failure'",
          shell: "sh",
          run: "rm -rf \"${{ runner.temp }}/cosmic-ci/products\"; sleep 30",
        },
        {
          name: "download the products to compare: second try",
          if: "steps.products-download.outcome == 'failure'",
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {pattern: "portable-product-*", path: "${{ runner.temp }}/cosmic-ci/products"},
        },
        {
          name: "compare the Cosmic bytes executed on every native host",
          if: "github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          "working-directory": "ci",
          env: {COSMIC_CI_PRODUCTS: "${{ github.event_name == 'push' && '3' || '4' }}"},
          run: "cosmic-driver cosmic_ci/driver.tl provenance",
        },
        {
          name: "summarize provenance operations",
          if: "always() && steps.driver.outcome == 'success'",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },
        {
          name: "preserve provenance operations",
          if: "always() && github.event_name != 'merge_group' && github.event_name != 'pull_request'",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "provenance-operations",
            path: "${{ runner.temp }}/cosmic-ci/operations.db",
            "if-no-files-found": "ignore",
          },
        },
      ],
    },
  },
}
