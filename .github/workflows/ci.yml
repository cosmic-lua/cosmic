name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every leg independently builds the complete product, executes the same
  # Cosmic bytes in its platform environment, and uploads them for the join.
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
            alpine: false
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
            alpine: false
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-macos
            alpine: false
          - name: alpine-x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-musl
            alpine: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}

      # `bin/zig` keeps its compile cache under o/ (see its own comment)
      # so a fresh checkout starts cold: every leg recompiles vendor/ and
      # core/ from nothing even when neither changed. This restores that
      # cache from outside the checkout -- `platform.sh build` requires
      # a checkout with no o/ yet, so COSMIC_ZIG_CACHE_SEED below only
      # names where it landed; platform.sh seeds it into o/ itself, once
      # its own guard has passed -- and saves it back once every native
      # build this job runs has had a chance to update it. The key omits
      # `matrix.name`/`matrix.target`: `cores` cross-compiles every target
      # from any host, so the linux-x86_64 and alpine-x86_64 legs (same
      # runner.os/arch) share one cache entry.
      - name: cache zig build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/cosmic/zig-build
          key: zig-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin', 'build.zig', 'build.zig.zon', 'core/**', 'vendor/**', 'patch/**') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ runner.arch }}-

      - name: build release Cosmic and run its native suite
        id: release-suite
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export COSMIC_ZIG_CACHE_SEED=~/.cache/cosmic/zig-build
          test/ci/platform.sh build "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: verify the delayed native database boundary
        env:
          TARGET: ${{ matrix.target }}
        run: test/ci/platform.sh boundary "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform" local

      - name: build local portable and checked artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: test/ci/platform.sh test "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      # The last step above to invoke `bin/zig build` (`sanitized` and
      # `portable-hook-cores`, inside platform.sh's `test` phase); nothing
      # after this point builds native code. Runs even on failure so a
      # partial compile still seeds the next run -- zig's own cache is
      # content-addressed, so a stale or partial entry here can only cost
      # a cache miss later, never produce a wrong build.
      - name: save zig build outputs for next run
        if: always()
        run: |
          mkdir -p ~/.cache/cosmic/zig-build
          rm -rf ~/.cache/cosmic/zig-build/zig-cache ~/.cache/cosmic/zig-build/zig-global
          [ ! -d o/zig-cache ] || cp -a o/zig-cache ~/.cache/cosmic/zig-build/zig-cache
          [ ! -d o/zig-global ] || cp -a o/zig-global ~/.cache/cosmic/zig-build/zig-global

      - name: run the product suite from fresh tracked source
        id: portable-suite
        env:
          TARGET: ${{ matrix.target }}
        run: test/ci/platform.sh portable "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: verify the delayed portable database boundary
        if: always() && steps.portable-suite.outcome != 'skipped'
        env:
          TARGET: ${{ matrix.target }}
          PORTABLE_OUTCOME: ${{ steps.portable-suite.outcome }}
        run: test/ci/platform.sh boundary "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform" portable

      - name: run runtime, launcher, rebuild, and identity regressions
        env:
          TARGET: ${{ matrix.target }}
        run: test/ci/platform.sh fixtures "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: run offline unprivileged BusyBox checks
        if: matrix.alpine
        env:
          TARGET: ${{ matrix.target }}
        run: test/ci/platform.sh alpine "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform"

      - name: attest the exact executed product bytes
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_PLATFORMS: ${{ strategy.job-total }}
        run: test/ci/platform.sh boundary "$GITHUB_WORKSPACE" "$TARGET" "$RUNNER_TEMP/platform" attest

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: portable-product-${{ matrix.name }}
          path: ${{ runner.temp }}/platform/product
          if-no-files-found: error

      - name: preserve platform failure diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: platform-diagnostics-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/platform/local-diagnostics
            ${{ runner.temp }}/platform/portable-diagnostics
            ${{ runner.temp }}/platform/alpine-diagnostics
            ${{ runner.temp }}/platform/self-rebuild-diagnostics
            ${{ runner.temp }}/platform/runtime-diagnostics
          if-no-files-found: ignore

  # Every successful platform/environment execution must attest and upload
  # identical Cosmic bytes. Local product tests retain manifest, range,
  # application, and raw-core verification, so this join only proves the
  # cross-platform byte identity.
  provenance:
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: portable-product-*
          path: ${{ runner.temp }}/products
      - name: compare the Cosmic bytes executed on every native host
        run: test/ci/provenance.sh "$RUNNER_TEMP/products"
