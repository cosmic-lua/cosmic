# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
# ci/README.md's "the workflow" says what runs where, and why the caches,
# the container and the concurrency are as they are.
{
  name: "ci",

  "on": {
    # Only main's pushes: a branch's push runs nothing, the merge queue
    # testing every change before it lands. A manual run of a branch runs
    # what main's daily run does, macOS only when it asks (`macos`).
    push: {branches: ["main"]},
    # A pull request runs a light check (linux-x86_64's leg, below, with the
    # launcher fixtures where it changes what they check, the pinned CI
    # driver's check where it changes ci/ or .github/, and macOS's suite
    # once it is not a draft), which reports the `ci` check the merge queue
    # requires of it. Marking it ready (`ready_for_review`) runs it again.
    pull_request: {types: ["opened", "synchronize", "reopened", "ready_for_review"]},
    # main takes changes only through the merge queue, which waits on
    # the `ci` check for the queued merge commit.
    merge_group: {},
    # A dispatch stands on the verdicts main's pushes left, as the daily
    # scheduled run does; with `every_test` it runs every test, as
    # Sunday's does (COSMIC_CI_EVENT below). With `fixed_point` it also
    # runs the fixed-point regression, as Sunday's does
    # (COSMIC_CI_FIXED_POINT below).
    workflow_dispatch: {
      inputs: {
        fixed_point: {
          description: "Run the fixed-point regression on every leg",
          type: "boolean",
          required: false,
          default: false,
        },
        every_test: {
          description: "Run every test, standing on no earlier verdict",
          type: "boolean",
          required: false,
          default: false,
        },
        macos: {
          description: "Also run the macOS leg (always on main)",
          type: "boolean",
          required: false,
          default: false,
        },
      },
    },
    # Every day, the run that tests macOS and publishes a prerelease
    # (prerelease.yml): every leg and job, on the verdicts main's pushes
    # left. On Sundays (the second line), also every test run whatever
    # stood (COSMIC_CI_EVENT), and zig's caches built cold: to catch
    # what no key is responsible for (the clock, a flake).
    # TODO: tell the maintainers of a red scheduled run: GitHub notifies
    # only whoever last edited this cron line. A step that opens (or
    # comments on) an issue when a scheduled run fails would, once one is
    # wanted over the checks' page.
    schedule: [{cron: "41 3 * * 1-6"}, {cron: "41 3 * * 0"}],
  },

  permissions: {contents: "read"},

  env: {
    # Whether this run's jobs save the caches every run restores: a push
    # to main and the scheduled run, no other. The driver does not read it.
    COSMIC_CI_SAVES: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}",
  },

  # A newer manual run supersedes a branch's. Main's pushes run one at a
  # time and to the end, so their saves land in commit order and each
  # completed run can publish a prerelease (the relay, relay.yml, saves
  # apart, and a push that main moved past leaves each leg's saves to it:
  # "ask whether main moved past this commit"); the scheduled run
  # and a manual one take groups of their own, so no push cancels them or
  # is cancelled by them.
  concurrency: {
    group: "${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name || 'run' }}-${{ github.ref }}",
    "cancel-in-progress": "${{ github.ref != 'refs/heads/main' }}",
  },

  jobs: {
    # No merge-queue run saves a cache, so one its ref holds was written
    # by code the queue ran, and a job's restore would take it before
    # main's, extracting it over the checkout. Every job that restores a
    # cache waits on this one, which restores none and fails where the
    # ref holds a cache (cosmic_ci/queue_verdicts.tl's `ref_caches`); the
    # `ci` gate checks again once they have run.
    "queue-ref": {
      if: "github.event_name == 'merge_group'",
      name: "merge-queue ref",
      defaults: {run: {"working-directory": "ci", shell: "sh"}},
      "runs-on": "ubuntu-24.04",
      permissions: {contents: "read", actions: "read"},
      "timeout-minutes": 10,
      steps: [
        {uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"}, # v6
        # The pinned driver, fetched and checked against its pin; the
        # cosmic-driver action would restore a cache first.
        {name: "fetch the pinned CI driver", run: "sh ../.github/scripts/cosmic-driver.sh"},
        {
          name: "refuse a cache the merge-queue ref saved",
          env: {GH_TOKEN: "${{ github.token }}"},
          run: "cosmic-driver cosmic_ci/driver.tl queue-ref-caches",
        },
      ],
    },
    # A platform leg: the native suite on its host, and, on main's runs,
    # the complete product, its regressions and its portable suite, the
    # bytes it ran uploaded for the join. The merge queue runs what main's
    # push runs on Linux, so a commit that breaks a push breaks its queue
    # entry first: the same three legs and the checked jobs, and the `driver`
    # job's check of the pinned CI driver. Each queue leg is two jobs at
    # once, so an entry takes about as long as the longer half: its
    # native suite (part `suite`), and assemble, the regressions, the
    # portable suite and the product (part `product`); the tree's format
    # check is a job of its own beside linux-x86_64's. The queue also runs
    # macOS's native suite (part `suite`, no product): macOS failures
    # blocked prereleases, and the daily run was the first to meet them. A pull request runs
    # a light gate: linux-x86_64's boot, native suite and format check of
    # what it changed (and the launcher fixtures, where it reaches them), the
    # `driver` job, and, once it is not a draft, macOS's suite, each suite
    # on main's verdicts.
    # A draft leaves the few macOS runners to the queue (ci/README.md says
    # why). A push to main runs
    # all four legs whole, macOS among them, so each commit that lands is
    # tested in full on every platform within about 25 min of its merge;
    # its macOS job also saves macOS's caches for the queue. The daily
    # scheduled run runs all four whole too, as does a manual run of main
    # or one that asks for it (`macos`). Other manual runs, a branch's checks
    # before the queue, leave macOS to the queue, which runs it on every
    # entry: their macOS jobs took the few macOS runners from the queue's
    # (45561589392 waited 35 min).
    # A batch's pull request (a branch of this repository named
    # claude/batch-*, which build/batch.tl stacks from members whose own
    # newest `ci` jobs passed, macOS's suite among them) runs no leg and
    # no driver check, and its gate passes: the merge queue tests the
    # batch, on every leg, before it lands. The skip goes by the branch's
    # name: what vouches for the members is build/batch.tl's check. The
    # run it skips takes 22 min (p50) of each batch's way to main.
    platform: {
      needs: ["queue-ref"],
      if: "!cancelled() && (github.event_name != 'merge_group' || needs.queue-ref.result == 'success') && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'claude/batch-'))",
      name: "${{ matrix.name }}",
      defaults: {run: {"working-directory": "ci", shell: "${{ matrix.image && 'leg-shell {0}' || 'sh' }}"}},
      strategy: {
        # Every leg runs to its end and shows every failure.
        "fail-fast": false,
        # The legs, listed whole for each kind of run: an `include` entry
        # naming a leg no dimension holds would start it anyway. Each
        # `image` is the container its Linux leg runs in (ci/images/,
        # ci-images.yml), pinned by digest, its `run` steps run as an
        # unprivileged `runner` through `leg-shell`
        # (.github/scripts/leg-container.sh); macOS has none. `leg` is the
        # host a job is (its caches, its verdicts, COSMIC_WORKER), `name`
        # the job's own; `part` is what of the leg it runs: `all`, or in the
        # queue `suite` (the native suite, its boundary, the darwin suite,
        # the sandbox probe and the credential proofs), `product` (assemble,
        # the regressions, the portable suite, the attestation and the
        # product) or `format` (linux-x86_64's format check alone).
        # alpine-x86_64's product, the queue's longest job (20 min on
        # 45475769968: the portable suite 10.5, the regressions 5.5), is
        # two jobs, each assembling: `portable` (the portable suite, the
        # attestation and the product) and `regressions`. Each Linux leg's
        # self-rebuild regression is a job of its own too, `rebuild`
        # (assemble and that fixture alone, COSMIC_CI_SELF_REBUILD).
        matrix: {
          include: "${{ fromJSON(github.event_name == 'pull_request' && (github.event.pull_request.draft && '[{\"name\": \"linux-x86_64\", \"leg\": \"linux-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}]' || '[{\"name\": \"linux-x86_64\", \"leg\": \"linux-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"macos-aarch64\", \"leg\": \"macos-aarch64\", \"part\": \"suite\", \"runner\": \"macos-15\", \"target\": \"aarch64-macos\", \"image\": \"\"}]') || github.event_name == 'merge_group' && '[{\"name\": \"linux-x86_64\", \"leg\": \"linux-x86_64\", \"part\": \"suite\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-x86_64-product\", \"leg\": \"linux-x86_64\", \"part\": \"product\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-x86_64-rebuild\", \"leg\": \"linux-x86_64\", \"part\": \"rebuild\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-x86_64-format\", \"leg\": \"linux-x86_64\", \"part\": \"format\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64\", \"leg\": \"linux-aarch64\", \"part\": \"suite\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64-product\", \"leg\": \"linux-aarch64\", \"part\": \"product\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64-rebuild\", \"leg\": \"linux-aarch64\", \"part\": \"rebuild\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"alpine-x86_64\", \"leg\": \"alpine-x86_64\", \"part\": \"suite\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}, {\"name\": \"alpine-x86_64-portable\", \"leg\": \"alpine-x86_64\", \"part\": \"portable\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}, {\"name\": \"alpine-x86_64-rebuild\", \"leg\": \"alpine-x86_64\", \"part\": \"rebuild\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}, {\"name\": \"alpine-x86_64-regressions\", \"leg\": \"alpine-x86_64\", \"part\": \"regressions\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}, {\"name\": \"macos-aarch64\", \"leg\": \"macos-aarch64\", \"part\": \"suite\", \"runner\": \"macos-15\", \"target\": \"aarch64-macos\", \"image\": \"\"}]' || github.event_name == 'push' && '[{\"name\": \"linux-x86_64\", \"leg\": \"linux-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64\", \"leg\": \"linux-aarch64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"alpine-x86_64\", \"leg\": \"alpine-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}, {\"name\": \"macos-aarch64\", \"leg\": \"macos-aarch64\", \"part\": \"all\", \"runner\": \"macos-15\", \"target\": \"aarch64-macos\", \"image\": \"\"}]' || (github.event_name == 'schedule' || github.ref == 'refs/heads/main' || inputs.macos) && '[{\"name\": \"linux-x86_64\", \"leg\": \"linux-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64\", \"leg\": \"linux-aarch64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"macos-aarch64\", \"leg\": \"macos-aarch64\", \"part\": \"all\", \"runner\": \"macos-15\", \"target\": \"aarch64-macos\", \"image\": \"\"}, {\"name\": \"alpine-x86_64\", \"leg\": \"alpine-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}]' || '[{\"name\": \"linux-x86_64\", \"leg\": \"linux-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"linux-aarch64\", \"leg\": \"linux-aarch64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04-arm\", \"target\": \"aarch64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\"}, {\"name\": \"alpine-x86_64\", \"leg\": \"alpine-x86_64\", \"part\": \"all\", \"runner\": \"ubuntu-24.04\", \"target\": \"x86_64-linux-musl\", \"image\": \"ghcr.io/cosmic-lua/cosmic-ci-alpine@sha256:bfb230da47e113566e34d8b6a2fa1a7f60ac8b40be4e6a3212f08fcb743e9f72\"}]') }}",
        },
      },
      "runs-on": "${{ matrix.runner }}",
      # packages: to pull the Linux legs' images from GHCR. actions: for
      # main's push to find and download the merge queue's verdicts of
      # its commit ("find the merge queue's run of this commit").
      permissions: {contents: "read", packages: "read", actions: "read"},
      "timeout-minutes": 60,
      env: {
        COSMIC_WORKER: "${{ matrix.leg }}",
        TARGET: "${{ matrix.target }}",
        # The checked suite and the format check run in jobs and steps
        # of their own (`checked`, "check the tree's format" below).
        COSMIC_CI_CHECKED_SUITE: "skip",
        COSMIC_CI_FORMAT: "skip",
        # The slowest fixture, the same on every platform (some 275 s on
        # the x86-64 legs): the weekly run (Sunday's) and a dispatch that
        # asks for it (`fixed_point`) alone (phase_fixtures).
        COSMIC_CI_FIXED_POINT: "${{ (github.event.schedule == '41 3 * * 0' || inputs.fixed_point) && 'run' || 'skip' }}",
        # The self-driven fixture's boot of the tree by the product, which
        # proves it can be the next pin: main's push and the daily run, not
        # the queue (some 2 min of each product job).
        COSMIC_CI_SELF_BOOT: "${{ github.event_name == 'merge_group' && 'skip' || 'run' }}",
        # In the queue each Linux leg's self-rebuild regression is a job of
        # its own (part `rebuild`, 153 s of the regressions' 6 min on
        # 45552392984), beside the leg's product or regressions job, which
        # skips it.
        COSMIC_CI_SELF_REBUILD: "${{ matrix.part == 'rebuild' && 'only' || (matrix.part == 'product' || matrix.part == 'regressions') && 'skip' || 'run' }}",
        # The small fixtures run beside the self-driven one, within one
        # worker budget of the leg's processors (phase_fixtures,
        # `fixture_lanes`): the two Linux legs whose fixture step the
        # one-test self-driven case idles.
        COSMIC_CI_FIXTURE_BUDGET: "${{ (matrix.leg == 'linux-aarch64' || matrix.leg == 'alpine-x86_64') && 'run' || 'skip' }}",
        # A Linux leg fails where a confined test's sandbox does not hold
        # (phase_sandbox) and runs its suites sandboxed; macOS cannot.
        COSMIC_CI_REQUIRE_SANDBOX: "${{ matrix.image && '1' || '0' }}",
        # macOS keys verdicts by what each test declares all the same: a
        # Linux leg's sandbox holds the same declaration, so one that lies
        # fails there first.
        COSMIC_CI_DECLARED_KEYS: "${{ matrix.image && '0' || '1' }}",
        # Pushes, pull requests, the merge queue, the daily scheduled run
        # and a manual run stand on verdicts; the weekly run (Sunday's) and a manual
        # run with `every_test` run every test (orchestration.tl's
        # `stands`).
        COSMIC_CI_EVENT: "${{ (github.event_name == 'schedule' && github.event.schedule != '41 3 * * 0' || github.event_name == 'workflow_dispatch' && !inputs.every_test) && 'push' || github.event_name }}",
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
          # The queue's or a pull request's merge and its parents, for the format check's base.
          with: {"fetch-depth": "${{ (github.event_name == 'merge_group' || github.event_name == 'pull_request') && 2 || 1 }}"},
        },
        # A Linux leg's container, started by a step (not `container:`) so
        # the host can be set up for spawn's sandbox first
        # (.github/scripts/leg-container.sh, ci/README.md's "the Linux
        # legs' container").
        # TODO: run the container under an AppArmor profile of
        # docker-default's with mount allowed in place of
        # apparmor=unconfined, if the runner lets a step load one
        # (apparmor_parser, as root, before the container starts) and
        # the probe finds every part holds under it.
        {
          name: "start the leg's container",
          if: "matrix.image",
          "working-directory": ".",
          shell: "sh",
          env: {IMAGE: "${{ matrix.image }}", TOKEN: "${{ secrets.GITHUB_TOKEN }}", ACTOR: "${{ github.actor }}"},
          run: "sh .github/scripts/leg-container.sh start \"$IMAGE\"",
        },
        # As root in the container: `runner` takes the workspace's owner's
        # uid, so it owns what the host's actions write. The ubuntu image
        # has useradd (-o: its own `ubuntu` user may hold the uid), the
        # alpine image busybox's adduser.
        {
          name: "create the unprivileged builder",
          if: "matrix.image",
          "working-directory": "/",
          shell: "leg-shell --root {0}",
          run: "uid=\"$(stat -c %u \"$GITHUB_WORKSPACE\")\"; if command -v useradd >/dev/null; then useradd -m -o -u \"$uid\" runner; else adduser -D -u \"$uid\" runner; fi",
        },
        {
          name: "restore the pinned zig",
          id: "zig-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            key: "zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin', 'patch/zig-lib/**') }}",
          },
        },
        {
          name: "name the zig build cache, and the run's start",
          id: "names",
          uses: "./.github/actions/cache-names",
          with: {leg: "${{ matrix.leg }}"},
        },
        # TODO: find what a run adds to the cache when its inputs match
        # the entry it restored, and compiles again on every such run:
        # linux-x86_64's grew 323 -> 347 -> 369 -> 388 MB over runs
        # 36317996933 to 36325134876, all with one input hash, where a
        # checkout at a new path, built from the same entry (even through
        # a tar round trip), writes nothing. What zig builds for the
        # runner's detected CPU is the likeliest: its maker (11 MB, in
        # the global cache) and the configurer compiled from build.zig
        # (22 MB, in the project cache, beside its configuration under
        # `c/`). A second boot of an unchanged tree on one machine writes
        # only dependencies.zig, and the maker and configurer are built
        # for the detected CPU with no flag, variable or library file to
        # name another (zig 0.17 compiles them inside its binary), so
        # that stays unverified here and unfixed until a zig that builds
        # them for a baseline CPU is pinned. Once bin/zig.pin names a zig that builds them for
        # the baseline CPU, or the writes name another cause, replace
        # this TODO.
        # The newest of this leg's entries main saved for this vendor part:
        # of this core part, else any. The weekly run restores nothing and
        # builds cold, which bounds what an entry carries; the daily ones
        # restore as a push does.
        {
          name: "restore zig build outputs",
          id: "zig-cache-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-\n${{ steps.names.outputs.vendor }}boot-${{ steps.names.outputs.core }}-\n${{ steps.names.outputs.vendor }}full-\n${{ steps.names.outputs.vendor }}\n",
            "lookup-only": "${{ github.event.schedule == '41 3 * * 0' }}",
          },
        },
        # Off main, the leg's newest entry of any vendor part; a second
        # step, since a ref's own entries are searched before main's.
        {
          name: "restore zig build outputs of another vendor part",
          if: "github.ref != 'refs/heads/main' && steps.zig-cache-restore.outputs.cache-matched-key == ''",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-restore.outputs.cache-primary-key }}",
            "restore-keys": "zig-build-${{ matrix.leg }}-\n",
          },
        },
        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          uses: "./.github/actions/cosmic-driver",
          with: {"zig-cache": true, shell: "${{ matrix.image && 'leg-shell {0}' || 'sh' }}"},
        },
        # What of the host every declared-key verdict's key holds
        # (COSMIC_HOST_ID), and the verdict cache's name.
        {
          name: "name the leg's host",
          id: "host-id",
          shell: "sh",
          env: {STARTED: "${{ hashFiles('.github/seccomp/**', '.github/scripts/leg-container.sh', '.github/scripts/seccomp-profile.sh') }}"},
          run: "cosmic-driver cosmic_ci/driver.tl leg-host-id \"${{ matrix.leg }}\" \"${{ matrix.image }}\" \"${{ matrix.runner }}\" \"$STARTED\"",
        },
        # Main's newest verdicts and compiles for this host; only main
        # saves. A restore decides how many tests stand, never whether a
        # verdict is right.
        {
          name: "restore test verdicts",
          id: "verdicts-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}",
            "restore-keys": "${{ steps.host-id.outputs.verdicts }}\n",
          },
        },
        # Main's push of the commit the merge queue just passed takes the
        # verdicts that run reached, so its suites run only the tests
        # whose keys differ (cosmic_ci/queue_verdicts.tl): without them it
        # stood on main's last cache, one commit or more behind, and ran
        # its whole native suite again. Each leg takes its own leg's.
        # A key holds everything its verdict was reached under, so these
        # decide how many tests stand, never whether one is right; none of
        # the three fails the leg.
        {
          name: "find the merge queue's run of this commit",
          id: "queue-run",
          if: "github.event_name == 'push' && github.ref == 'refs/heads/main'",
          shell: "sh",
          "continue-on-error": true,
          env: {SHA: "${{ github.sha }}", ARTIFACT: "queue-verdicts-${{ matrix.leg }}", GH_TOKEN: "${{ github.token }}"},
          run: "cosmic-driver cosmic_ci/driver.tl queue-run",
        },
        {
          name: "download the merge queue's verdicts",
          id: "queue-download",
          if: "steps.queue-run.outputs.run != ''",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            name: "queue-verdicts-${{ matrix.leg }}",
            path: "${{ runner.temp }}/queue-verdicts",
            "run-id": "${{ steps.queue-run.outputs.run }}",
            "github-token": "${{ github.token }}",
          },
        },
        {
          name: "take in the merge queue's verdicts",
          if: "steps.queue-download.outcome == 'success'",
          "continue-on-error": true,
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-merge \"${{ runner.temp }}/queue-verdicts\"",
        },
        # A merge-queue run takes in what the last failed try of its pull
        # request, built on main with the same change, reached (cosmic_ci/queue_verdicts.tl's
        # `find_tried`): the queue keeps no cache, so this is all a try
        # the deadline stopped keeps. None of the three fails the job.
        {
          name: "find this pull request's last failed try in the merge queue",
          id: "tried-run",
          if: "github.event_name == 'merge_group'",
          shell: "sh",
          "continue-on-error": true,
          env: {HEAD_REF: "${{ github.event.merge_group.head_ref }}", BASE_SHA: "${{ github.event.merge_group.base_sha }}", SHA: "${{ github.sha }}", ARTIFACT: "queue-tried-verdicts-${{ matrix.name }}", PASSED_ARTIFACT: "${{ matrix.part == 'suite' && format('queue-verdicts-{0}', matrix.leg) || '' }}", RUN_ID: "${{ github.run_id }}", GH_TOKEN: "${{ github.token }}"},
          run: "cosmic-driver cosmic_ci/driver.tl queue-tried-run",
        },
        {
          name: "download the last failed try's verdicts",
          id: "tried-download",
          # By the id the lookup checked: a run attempted again holds a
          # newer artifact of the same name.
          if: "steps.tried-run.outputs.artifact != ''",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            "artifact-ids": "${{ steps.tried-run.outputs.artifact }}",
            "merge-multiple": true,
            path: "${{ runner.temp }}/tried-verdicts",
            "run-id": "${{ steps.tried-run.outputs.run }}",
            "github-token": "${{ github.token }}",
          },
        },
        {
          name: "take in the last failed try's verdicts",
          if: "steps.tried-download.outcome == 'success'",
          "continue-on-error": true,
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-merge \"${{ runner.temp }}/tried-verdicts\"",
        },
        {
          name: "restore compiles and parses",
          id: "compiles-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "compiles-${{ matrix.leg }}-",
            "restore-keys": "compiles-${{ matrix.leg }}-\n",
          },
        },
        # Main's push of the commit the merge queue just passed boots on
        # the compiles and parses that run's boot and suite made of this
        # very tree. The relay (relay.yml) saves them for the next runs,
        # a minute after the merge: this run waits on main's run before it
        # and would save them minutes later. A row stands only under its
        # key, so these decide how much is compiled again, never what a
        # compile says; neither step fails the leg.
        {
          name: "download the merge queue's compiles and parses",
          id: "queue-compiles",
          if: "steps.queue-run.outputs.run != ''",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            name: "queue-compiles-${{ matrix.leg }}",
            path: "${{ runner.temp }}/queue-compiles",
            "run-id": "${{ steps.queue-run.outputs.run }}",
            "github-token": "${{ github.token }}",
          },
        },
        # In place of the entry restored, whose write-ahead files the
        # downloaded file would not match.
        {
          name: "take in the merge queue's compiles and parses",
          id: "queue-compiles-taken",
          if: "steps.queue-compiles.outcome == 'success'",
          "continue-on-error": true,
          shell: "sh",
          run: "test -s \"$RUNNER_TEMP/queue-compiles/cache.db\" && rm -rf \"$RUNNER_TEMP/build-cache\" && mv \"$RUNNER_TEMP/queue-compiles\" \"$RUNNER_TEMP/build-cache\"",
        },
        # What the tree checks found in each file (build/check_memo.tl's
        # shared rows, in the cache directory and apart from the compiles),
        # for the format check: main's newest, which the relay (relay.yml)
        # took from the queue's check of the commit (cosmic_ci/checks_seal.tl).
        {
          name: "restore the tree checks' memo",
          if: "matrix.leg == 'linux-x86_64' && (matrix.part == 'all' || matrix.part == 'format') && github.event_name != 'push' && github.event.schedule != '41 3 * * 1-6'",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/build/checks.db",
            key: "checks-${{ matrix.leg }}-",
            "restore-keys": "checks-${{ matrix.leg }}-\n",
          },
        },
        # The tree's format check (`fix --check .`), the same on every
        # host: linux-x86_64's, on a pull request, in the merge queue, on
        # the weekly and on a manual run. Never on main's push or the
        # daily run: main moves only through the queue, whose check of the
        # very commit passed. It holds the markers of the tree to the
        # merge base of the commit with main (build/ceilings_base.tl): a
        # marker only falls. Never to the queue's own base
        # (merge_group.base_sha), the entry ahead, whose markers the
        # commit already holds. The base step finds it with git alone,
        # never the API, whose comparison GitHub refuses under load: a
        # pull request for main reads the merge commit's first parent
        # from its checkout, and the other runs fetch the commit's
        # history down to main. Where it finds none it fails the job
        # there, as the check would minutes later, rather than let a
        # raise through; run it again. Both fetches run before the tree
        # moves: actions/checkout keeps its credentials in an
        # `includeIf.gitdir` of the checkout's own path, which a git run
        # in the moved tree does not match, so it would fetch with none.
        # The macOS leg in the queue finds the base too, for the paths
        # that tell whether it checks the pinned driver ("check the
        # pinned CI driver"). Where it finds none it fails as
        # linux-x86_64-format's does, which fails the entry anyway.
        {
          name: "find the base the markers are held to",
          id: "ceilings-base",
          if: "(matrix.leg == 'linux-x86_64' && (matrix.part == 'all' || matrix.part == 'format') && github.event_name != 'push' && github.event.schedule != '41 3 * * 1-6') || (matrix.leg == 'macos-aarch64' && github.event_name == 'merge_group')",
          shell: "sh",
          env: {SHA: "${{ github.sha }}", EVENT: "${{ github.event_name }}", REF: "${{ github.ref }}", BASE_REF: "${{ github.event.merge_group.base_ref }}", PR_BASE_REF: "${{ github.base_ref }}"},
          run: "cosmic-driver cosmic_ci/driver.tl ceilings-base",
        },
        {
          name: "name the base the ceilings are held to",
          if: "matrix.leg == 'linux-x86_64' && steps.ceilings-base.outputs.sha != ''",
          shell: "sh",
          env: {BASE: "${{ steps.ceilings-base.outputs.sha }}"},
          run: "echo \"COSMIC_CEILINGS_BASE=$BASE\" >> \"$GITHUB_ENV\"",
        },
        # On a pull request and in the queue, what the commit changed
        # since that base, whose tree the queue held to the check: the
        # check lays out only these and makes every check spanning files
        # over the whole tree (driver.tl changed-paths, `fix --check
        # --changed`). Where it names none, it covers everything.
        {
          name: "name the paths the commit changed",
          id: "changed",
          if: "((matrix.leg == 'linux-x86_64' && (matrix.part == 'all' || matrix.part == 'format') && (github.event_name == 'merge_group' || github.event_name == 'pull_request')) || (matrix.leg == 'macos-aarch64' && github.event_name == 'merge_group')) && steps.ceilings-base.outputs.sha != ''",
          shell: "sh",
          "continue-on-error": true,
          env: {BASE: "${{ steps.ceilings-base.outputs.sha }}", OUT: "${{ runner.temp }}/changed-paths"},
          run: "cosmic-driver cosmic_ci/driver.tl changed-paths",
        },
        # To a path of this commit's and leg's own, so a test that turns
        # on the tree's path fails some run (driver.tl place-tree). After
        # every hashFiles, which reads the checkout.
        # TODO: move it on the macOS leg alone once no Linux step runs a
        # test unsandboxed: the tree's own suites and "check the pinned CI
        # driver" see it at /tree wherever it is (COSMIC_TEST_SANDBOX=1),
        # but the unsandboxed fixtures (orchestration.tl's
        # `Orchestration.fixture`) see it at its path; the macOS leg has
        # no sandbox at all.
        {
          name: "move the tree to a path of its own",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree",
        },
        # eval/ is a project of its own, built and tested on the pinned
        # driver in place (eval/README.md), as cosmic's own build leaves it
        # out: its format check and its tests. COSMIC_TREE holds the driver
        # to eval/, not the checkout around it.
        {
          name: "check eval/ on the pinned driver",
          if: "matrix.leg == 'linux-x86_64' && (matrix.part == 'all' || matrix.part == 'format') && github.event_name != 'push'",
          env: {COSMIC_TREE: "."},
          run: "cd ../eval && cosmic-driver fix --check . && cosmic-driver test",
        },
        {
          name: "build release Cosmic",
          id: "boot",
          run: "cosmic-driver cosmic_ci/driver.tl platform boot",
        },
        {
          name: "run release Cosmic's native suite",
          id: "release-suite",
          if: "(matrix.part == 'all' || matrix.part == 'suite')",
          run: "cosmic-driver cosmic_ci/driver.tl platform local-suite",
        },
        {
          name: "verify the delayed native database boundary",
          if: "(matrix.part == 'all' || matrix.part == 'suite')",
          run: "cosmic-driver cosmic_ci/driver.tl platform local-boundary",
        },
        {
          name: "check the tree's format",
          id: "format",
          if: "matrix.leg == 'linux-x86_64' && (matrix.part == 'all' || matrix.part == 'format') && github.event_name != 'push' && github.event.schedule != '41 3 * * 1-6'",
          env: {COSMIC_CI_FORMAT: "run", COSMIC_CI_FORMAT_CHANGED: "${{ steps.changed.outputs.paths }}"},
          run: "cosmic-driver cosmic_ci/driver.tl platform format",
        },
        # Project dispatch writes the working database: after the native
        # suite's delayed boundary.
        {
          name: "build the credential transition probe",
          if: "runner.os == 'Linux' && github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'suite')",
          "working-directory": ".",
          run: ".github/scripts/credentials-build.sh",
        },
        {
          name: "prove the ordinary credential transition",
          if: "runner.os == 'Linux' && github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'suite')",
          "working-directory": ".",
          shell: "leg-shell --root {0}",
          run: "sh .github/scripts/credentials-proof.sh",
        },
        {
          name: "prove local runner privilege and ownership boundaries",
          if: "runner.os == 'Linux' && github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'suite')",
          "working-directory": ".",
          shell: "leg-shell --root {0}",
          run: "sh .github/scripts/run-local-proof.sh",
        },
        # The macOS leg's darwin-branch tests, which stand on no verdict
        # (ci/darwin-tests.txt).
        {
          name: "run the darwin suite",
          if: "(matrix.part == 'all' || matrix.part == 'suite')",
          run: "cosmic-driver cosmic_ci/driver.tl platform darwin-suite",
        },
        # After the leg's own suites, whichever way they ended, so a break here (macOS's host programs, for one)
        # hides no verdict of theirs. Every test, sandboxed on Linux (each module declares the host
        # programs and files it reads), and unsandboxed on macOS, which
        # has no sandbox. Every leg of the daily, weekly and a manual run;
        # on a pull request, the
        # `driver` job's, and in the queue, that job's and the macOS
        # leg's, where the change touches ci/ or .github/ or its paths are
        # not known (changed_paths.tl's `driver=skip`); never on main's push, whose
        # commit the queue checked. cosmic_ci's tests start the host's
        # programs, which macOS keeps elsewhere (/sbin/sha256sum): before
        # the macOS leg ran them in the queue, such a break showed only in
        # the next daily or manual run.
        {
          name: "check the pinned CI driver",
          if: "!cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'merge_group' && matrix.leg == 'macos-aarch64' && steps.changed.outputs.driver != 'skip'))",
          env: {COSMIC_VERDICT_CACHE: "0", COSMIC_TEST_SANDBOX: "${{ runner.os == 'Linux' && '1' || '0' }}", COSMIC_SANDBOX: "${{ runner.os == 'Linux' && 'must' || '' }}"},
          run: "cosmic-driver test cosmic_ci",
        },
        # Fails where a part of spawn's sandbox a confined test needs did
        # not hold (COSMIC_CI_REQUIRE_SANDBOX, phase_sandbox).
        {
          name: "probe the sandbox a confined test runs in",
          if: "runner.os == 'Linux' && github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'suite')",
          run: "cosmic-driver cosmic_ci/driver.tl platform sandbox",
        },
        # A pull request builds them and runs the regressions only where a
        # path it changed reaches what they check, or where the paths
        # changed are not known (driver.tl changed-paths).
        {
          name: "build local portable and checked artifacts",
          id: "assemble",
          if: "(github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'product' || matrix.part == 'portable' || matrix.part == 'regressions' || matrix.part == 'rebuild')) || (github.event_name == 'pull_request' && steps.changed.outputs.fixtures != 'skip')",
          run: "cosmic-driver cosmic_ci/driver.tl platform assemble",
        },
        # What a save of zig's caches would carry that no build of this tree
        # reads (cosmic_ci/zig_prune.tl): only before main's save.
        {
          name: "prune the zig build outputs no step vouches for",
          if: "always() && (steps.assemble.outcome == 'success' || matrix.part == 'suite' && steps.boot.outcome == 'success') && env.COSMIC_CI_SAVES == 'true' && (github.event.schedule == '41 3 * * 0' || !startsWith(steps.zig-cache-restore.outputs.cache-matched-key, format('{0}full-', steps.names.outputs.vendor))) && (matrix.part != 'suite' || !startsWith(steps.zig-cache-restore.outputs.cache-matched-key, format('{0}boot-', steps.names.outputs.vendor)))",
          run: "cosmic-driver cosmic_ci/driver.tl zig-prune",
        },
        {
          name: "run runtime, launcher, rebuild, and identity regressions",
          if: "(github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'product' || matrix.part == 'regressions' || matrix.part == 'rebuild')) || (github.event_name == 'pull_request' && steps.changed.outputs.fixtures != 'skip')",
          run: "cosmic-driver cosmic_ci/driver.tl platform fixtures",
        },
        {
          name: "run the product suite from fresh tracked source",
          id: "portable-suite",
          if: "github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'product' || matrix.part == 'portable')",
          run: "cosmic-driver cosmic_ci/driver.tl platform portable",
        },
        {
          name: "verify the delayed portable database boundary",
          if: "always() && steps.portable-suite.outcome != 'skipped'",
          run: "cosmic-driver cosmic_ci/driver.tl platform portable-boundary \"${{ steps.portable-suite.outcome }}\"",
        },
        {
          name: "attest the exact executed product bytes",
          if: "github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'product' || matrix.part == 'portable')",
          run: "cosmic-driver cosmic_ci/driver.tl platform attest",
        },
        # Read by the `ci` join, and by prerelease.yml as main's run ends.
        {
          name: "upload the attested product",
          if: "github.event_name != 'pull_request' && (matrix.part == 'all' || matrix.part == 'product' || matrix.part == 'portable')",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "portable-product-${{ matrix.leg }}",
            path: "${{ runner.temp }}/cosmic-ci/platform/product",
            "if-no-files-found": "error",
            "retention-days": 7,
          },
        },
        {
          name: "keep only this run's compiles and parses",
          id: "compiles-trim",
          if: "always() && steps.driver.outcome == 'success' && (env.COSMIC_CI_SAVES == 'true' || github.event_name == 'merge_group')",
          run: "cosmic-driver cosmic_ci/driver.tl compiles-trim \"${{ steps.names.outputs.since }}\" \"${{ runner.temp }}/compiles-restored.db\"",
        },
        # A run that failed keeps what it restored too (`whole`), but in
        # the merge queue, which saves no cache, only what it used. Cut to
        # the rows this run used, named by their digest: for main's save,
        # and in the merge queue for main's push of the commit or the pull
        # request's next try.
        {
          name: "keep only this run's test verdicts",
          id: "verdicts-trim",
          if: "always() && steps.driver.outcome == 'success' && (env.COSMIC_CI_SAVES == 'true' || github.event_name == 'merge_group')",
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-trim ${{ (job.status == 'success' || github.event_name == 'merge_group') && steps.names.outputs.since || 'whole' }}",
        },
        # Read by this pull request's next try in the merge queue ("find
        # this pull request's last failed try"): the rows a failed try
        # used.
        {
          name: "upload what this failed try in the merge queue reached",
          if: "always() && github.event_name == 'merge_group' && job.status == 'failure' && steps.verdicts-trim.outputs.digest != ''",
          "continue-on-error": true,
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "queue-tried-verdicts-${{ matrix.name }}",
            path: "${{ runner.temp }}/verdicts/*.db",
            "if-no-files-found": "ignore",
            "retention-days": 1,
          },
        },
        # The cache the verdicts belong in, named by this host, for the
        # relay (relay.yml), which runs on a host of its own.
        {
          name: "name the cache the merge queue's verdicts belong in",
          id: "verdicts-named",
          if: "github.event_name == 'merge_group' && job.status == 'success' && steps.release-suite.outcome == 'success' && steps.verdicts-trim.outputs.digest != ''",
          "continue-on-error": true,
          env: {VERDICTS: "${{ steps.host-id.outputs.verdicts }}"},
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-name \"${{ runner.temp }}/verdicts\"",
        },
        # Read by the relay (relay.yml) and main's push of this commit
        # ("find the merge queue's run of this commit"), once the queue
        # merges it.
        {
          name: "upload the merge queue's verdicts",
          if: "github.event_name == 'merge_group' && job.status == 'success' && steps.release-suite.outcome == 'success' && steps.verdicts-trim.outputs.digest != ''",
          "continue-on-error": true,
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "queue-verdicts-${{ matrix.leg }}",
            path: "${{ runner.temp }}/verdicts/*.db\n${{ runner.temp }}/verdicts/cache-key",
            "if-no-files-found": "ignore",
            "retention-days": 1,
          },
        },
        # Read by main's push of this commit, as the verdicts are: the
        # compiles and parses this run used (compiles-trim), as main's
        # save would keep them.
        {
          name: "upload the merge queue's compiles and parses",
          if: "github.event_name == 'merge_group' && job.status == 'success' && steps.release-suite.outcome == 'success' && steps.compiles-trim.outputs.digest != ''",
          "continue-on-error": true,
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "queue-compiles-${{ matrix.leg }}",
            path: "${{ runner.temp }}/build-cache",
            "if-no-files-found": "ignore",
            "retention-days": 1,
          },
        },
        # Read by the relay (relay.yml), as the verdicts are: the rows this
        # run used, in one file of no write-ahead log.
        {
          name: "seal the merge queue's tree checks memo",
          id: "checks-seal",
          if: "github.event_name == 'merge_group' && steps.format.outcome == 'success'",
          "continue-on-error": true,
          run: "cosmic-driver cosmic_ci/driver.tl checks-seal \"${{ runner.temp }}/cache/cosmic/build/checks.db\" \"${{ steps.names.outputs.since }}\"",
        },
        {
          name: "upload the merge queue's tree checks memo",
          if: "steps.checks-seal.outcome == 'success'",
          "continue-on-error": true,
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "queue-checks-${{ matrix.leg }}",
            path: "${{ runner.temp }}/cache/cosmic/build/checks.db",
            "if-no-files-found": "ignore",
            "retention-days": 1,
          },
        },
        {
          name: "summarize worker operations",
          if: "always() && steps.driver.outcome == 'success'",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },
        # The run's operations and suite rows, for `driver.tl report`.
        {
          name: "preserve CI driver database",
          if: "always()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "ci-driver-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/operations.db",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "preserve failure diagnostics",
          if: "failure()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "platform-diagnostics-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/platform/local-diagnostics\n${{ runner.temp }}/cosmic-ci/platform/portable-diagnostics\n${{ runner.temp }}/cosmic-ci/platform/checked-diagnostics\n${{ runner.temp }}/cosmic-ci/platform/fixture-test-diagnostics\n",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "describe the leg's container",
          if: "failure() && matrix.image",
          "working-directory": "/",
          shell: "sh",
          run: "docker inspect cosmic-leg || :; docker logs cosmic-leg || :",
        },
        # Whatever came before, so nothing left running there writes to
        # the tree the next step moves back.
        {
          name: "remove the leg's container",
          if: "always() && matrix.image",
          "working-directory": "/",
          shell: "sh",
          run: "docker rm -f cosmic-leg || :",
        },
        # Main's push of a commit main has moved past leaves its verdicts
        # and compiles to the newer commit's relay (relay.yml), saved a
        # minute after that merge: a save of this run's, made later, would
        # be the newest and lack them. Where GitHub does not say, it saves.
        # macOS saves all the same: no relay runs on a macOS runner, so its
        # push is the only main run that saves them.
        {
          name: "ask whether main moved past this commit",
          id: "main-newest",
          if: "always() && steps.queue-run.outcome != 'skipped' && steps.driver.outcome == 'success'",
          shell: "sh",
          "continue-on-error": true,
          env: {SHA: "${{ github.sha }}", GH_TOKEN: "${{ github.token }}"},
          run: "cosmic-driver cosmic_ci/driver.tl main-newest",
        },
        # As late as the tree is in place, so that a failed job's log ends
        # near why it failed: the lines its failed commands said of that
        # (cosmic_ci/failures.tl), and where the job was ended under a
        # command, the end of what that command said. On the runner, since a
        # leg's container is gone by now.
        {
          name: "say again what failed",
          if: "(failure() || cancelled()) && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl failures",
        },
        # Before checkout's post step, whose git refuses the repository at
        # another path, and before the saves, whose paths actions/cache
        # names relative to the workspace (driver.tl place-tree).
        {
          name: "move the tree back to where it was checked out",
          if: "always() && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree --restore",
        },
        # Whatever failed (a failing verdict takes a passing one out),
        # where the rows differ from the entry restored. Not the macOS
        # leg's weekly run: its keys hold the tree's path, which that run
        # chooses by the commit (driver.tl place-tree), so its rows would
        # match no other run.
        {
          name: "save test verdicts",
          if: "always() && env.COSMIC_CI_SAVES == 'true' && (matrix.leg == 'macos-aarch64' || steps.main-newest.outputs.newest != 'false') && steps.verdicts-trim.outputs.digest != '' && !(github.event.schedule == '41 3 * * 0' && env.COSMIC_CI_DECLARED_KEYS == '1') && steps.verdicts-restore.outputs.cache-matched-key != format('{0}{1}', steps.host-id.outputs.verdicts, steps.verdicts-trim.outputs.digest)",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}${{ steps.verdicts-trim.outputs.digest }}",
          },
        },
        # Main's alone, where the native build and suite passed: a run that
        # stopped short would leave the next only what it reached. Where it
        # booted on the queue's, under the name the relay saves them by,
        # which a save the relay made already leaves as it is.
        {
          name: "save compiles and parses",
          if: "always() && env.COSMIC_CI_SAVES == 'true' && (matrix.leg == 'macos-aarch64' || steps.main-newest.outputs.newest != 'false') && steps.release-suite.outcome == 'success' && steps.compiles-trim.outputs.digest != '' && steps.compiles-restore.outputs.cache-matched-key != format('compiles-{0}-{1}', matrix.leg, steps.compiles-trim.outputs.digest)",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "${{ steps.queue-compiles-taken.outcome == 'success' && format('compiles-{0}-queue-{1}', matrix.leg, github.sha) || format('compiles-{0}-{1}', matrix.leg, steps.compiles-trim.outputs.digest) }}",
          },
        },
        # Once per vendor part and leg, not per core change, which the
        # cache cannot hold, where assemble passed and main found no entry
        # of this vendor part; and on the weekly run, which built cold. A
        # suite job builds only its boot, and would save it under
        # `<vendor>boot-`, so it does not stand in for the whole leg's
        # entry. No saving run has a suite job now: main's push runs
        # macOS's whole leg, whose `<vendor>full-` entry the queue's macOS
        # suite restores first.
        {
          name: "save zig build outputs",
          if: "always() && (steps.assemble.outcome == 'success' || matrix.part == 'suite' && steps.boot.outcome == 'success') && env.COSMIC_CI_SAVES == 'true' && (github.event.schedule == '41 3 * * 0' || !startsWith(steps.zig-cache-restore.outputs.cache-matched-key, format('{0}full-', steps.names.outputs.vendor))) && (matrix.part != 'suite' || !startsWith(steps.zig-cache-restore.outputs.cache-matched-key, format('{0}boot-', steps.names.outputs.vendor)))",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ matrix.part == 'suite' && format('{0}boot-{1}-{2}-{3}', steps.names.outputs.vendor, steps.names.outputs.core, github.run_id, github.run_attempt) || steps.zig-cache-restore.outputs.cache-primary-key }}",
          },
        },
        {
          name: "save the pinned zig",
          if: "always() && (steps.assemble.outcome == 'success' || matrix.part == 'suite' && steps.boot.outcome == 'success') && env.COSMIC_CI_SAVES == 'true' && steps.zig-restore.outputs.cache-hit != 'true'",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            key: "${{ steps.zig-restore.outputs.cache-primary-key }}",
          },
        },
      ],
    },

    # The checked core's suite, the whole suite on the sanitized core
    # (orchestration.tl's checked_suite, bounded by
    # `checked_suite_timeout_ns`), and the bounded performance fixture, on
    # linux-x86_64's host, beside the legs. Not on a pull request: the
    # merge queue, main's push, the scheduled and a manual run. Its verdicts are kept under a
    # cache name of its own on that host. The queue runs the suite in three
    # shares at once (`cosmic test --shard`), each its own job, so the
    # longest job of a queue run is not the suite whole (about 28
    # minutes; two shares took 16.4 and 11.8, since tests are dealt by
    # name, not time); a share saves nothing, and the performance fixture
    # (`performance`) runs in the third. A manual run of a branch, its
    # checks before the queue, runs the queue's shares too: whole, the
    # suite took 1738-1749 s of its 1860 s deadline (45559361046,
    # 45558617898) and missed it on slower runners (45557741219).
    # Elsewhere it is one job, whose run checks the C functions too,
    # which a share cannot.
    checked: {
      needs: ["queue-ref"],
      if: "!cancelled() && (github.event_name != 'merge_group' || needs.queue-ref.result == 'success') && github.event_name != 'pull_request'",
      name: "${{ matrix.name }}",
      strategy: {
        "fail-fast": false,
        matrix: {
          include: "${{ fromJSON(github.event_name == 'pull_request' && '[{\"name\": \"linux-x86_64-checked\", \"shard\": \"\", \"performance\": \"run\"}]' || github.event_name == 'merge_group' && '[{\"name\": \"linux-x86_64-checked-1\", \"shard\": \"1/3\", \"performance\": \"skip\"}, {\"name\": \"linux-x86_64-checked-2\", \"shard\": \"2/3\", \"performance\": \"skip\"}, {\"name\": \"linux-x86_64-checked-3\", \"shard\": \"3/3\", \"performance\": \"run\"}]' || github.event_name == 'push' && '[{\"name\": \"linux-x86_64-checked\", \"shard\": \"\", \"performance\": \"run\"}]' || (github.event_name == 'schedule' || github.ref == 'refs/heads/main') && '[{\"name\": \"linux-x86_64-checked\", \"shard\": \"\", \"performance\": \"run\"}]' || '[{\"name\": \"linux-x86_64-checked-1\", \"shard\": \"1/3\", \"performance\": \"skip\"}, {\"name\": \"linux-x86_64-checked-2\", \"shard\": \"2/3\", \"performance\": \"skip\"}, {\"name\": \"linux-x86_64-checked-3\", \"shard\": \"3/3\", \"performance\": \"run\"}]') }}",
        },
      },
      defaults: {run: {"working-directory": "ci", shell: "leg-shell {0}"}},
      "runs-on": "ubuntu-24.04",
      # actions: to find and download the pull request's last failed try in
      # the merge queue.
      permissions: {contents: "read", packages: "read", actions: "read"},
      "timeout-minutes": 60,
      env: {
        COSMIC_WORKER: "linux-x86_64-checked",
        TARGET: "x86_64-linux-musl",
        COSMIC_CI_CHECKED_SUITE: "run",
        COSMIC_CI_CHECKED_SHARD: "${{ matrix.shard }}",
        COSMIC_CI_REQUIRE_SANDBOX: "1",
        COSMIC_CI_DECLARED_KEYS: "0",
        COSMIC_CI_EVENT: "${{ (github.event_name == 'schedule' && github.event.schedule != '41 3 * * 0' || github.event_name == 'workflow_dispatch' && !inputs.every_test) && 'push' || github.event_name }}",
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },
        # A Linux leg's container, started by a step (not `container:`) so
        # the host can be set up for spawn's sandbox first
        # (.github/scripts/leg-container.sh, ci/README.md's "the Linux
        # legs' container").
        {
          name: "start the leg's container",
          "working-directory": ".",
          shell: "sh",
          env: {IMAGE: "ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a", TOKEN: "${{ secrets.GITHUB_TOKEN }}", ACTOR: "${{ github.actor }}"},
          run: "sh .github/scripts/leg-container.sh start \"$IMAGE\"",
        },
        # As root in the container: `runner` takes the workspace's owner's
        # uid, so it owns what the host's actions write. The ubuntu image
        # has useradd (-o: its own `ubuntu` user may hold the uid), the
        # alpine image busybox's adduser.
        {
          name: "create the unprivileged builder",
          "working-directory": "/",
          shell: "leg-shell --root {0}",
          run: "uid=\"$(stat -c %u \"$GITHUB_WORKSPACE\")\"; if command -v useradd >/dev/null; then useradd -m -o -u \"$uid\" runner; else adduser -D -u \"$uid\" runner; fi",
        },
        {
          name: "restore the pinned zig",
          id: "zig-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            key: "zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin', 'patch/zig-lib/**') }}",
          },
        },
        {
          name: "name the zig build cache, and the run's start",
          id: "names",
          uses: "./.github/actions/cache-names",
          with: {leg: "linux-x86_64"},
        },
        # The newest of this leg's entries main saved for this vendor part:
        # of this core part, else any. The weekly run restores nothing and
        # builds cold, which bounds what an entry carries; the daily ones
        # restore as a push does.
        {
          name: "restore zig build outputs",
          id: "zig-cache-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-\n${{ steps.names.outputs.vendor }}full-\n${{ steps.names.outputs.vendor }}\n",
            "lookup-only": "${{ github.event.schedule == '41 3 * * 0' }}",
          },
        },
        # Off main, the leg's newest entry of any vendor part; a second
        # step, since a ref's own entries are searched before main's.
        {
          name: "restore zig build outputs of another vendor part",
          if: "github.ref != 'refs/heads/main' && steps.zig-cache-restore.outputs.cache-matched-key == ''",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-restore.outputs.cache-primary-key }}",
            "restore-keys": "zig-build-linux-x86_64-\n",
          },
        },
        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          uses: "./.github/actions/cosmic-driver",
          with: {"zig-cache": true, shell: "leg-shell {0}"},
        },
        # What of the host every declared-key verdict's key holds
        # (COSMIC_HOST_ID), and the verdict cache's name.
        {
          name: "name the leg's host",
          id: "host-id",
          shell: "sh",
          env: {STARTED: "${{ hashFiles('.github/seccomp/**', '.github/scripts/leg-container.sh', '.github/scripts/seccomp-profile.sh') }}"},
          run: "cosmic-driver cosmic_ci/driver.tl leg-host-id \"linux-x86_64-checked\" \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\" \"ubuntu-24.04\" \"$STARTED\"",
        },
        # Main's newest verdicts and compiles for this host; only main
        # saves. A restore decides how many tests stand, never whether a
        # verdict is right.
        {
          name: "restore test verdicts",
          id: "verdicts-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}",
            "restore-keys": "${{ steps.host-id.outputs.verdicts }}\n",
          },
        },
        # As the platform job's: what this pull request's last failed try
        # in the merge queue reached.
        {
          name: "find this pull request's last failed try in the merge queue",
          id: "tried-run",
          if: "github.event_name == 'merge_group'",
          shell: "sh",
          "continue-on-error": true,
          env: {HEAD_REF: "${{ github.event.merge_group.head_ref }}", BASE_SHA: "${{ github.event.merge_group.base_sha }}", SHA: "${{ github.sha }}", ARTIFACT: "queue-tried-verdicts-${{ matrix.name }}", RUN_ID: "${{ github.run_id }}", GH_TOKEN: "${{ github.token }}"},
          run: "cosmic-driver cosmic_ci/driver.tl queue-tried-run",
        },
        {
          name: "download the last failed try's verdicts",
          id: "tried-download",
          if: "steps.tried-run.outputs.artifact != ''",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            "artifact-ids": "${{ steps.tried-run.outputs.artifact }}",
            "merge-multiple": true,
            path: "${{ runner.temp }}/tried-verdicts",
            "run-id": "${{ steps.tried-run.outputs.run }}",
            "github-token": "${{ github.token }}",
          },
        },
        {
          name: "take in the last failed try's verdicts",
          if: "steps.tried-download.outcome == 'success'",
          "continue-on-error": true,
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-merge \"${{ runner.temp }}/tried-verdicts\"",
        },
        {
          name: "restore compiles and parses",
          id: "compiles-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "compiles-linux-x86_64-",
            "restore-keys": "compiles-linux-x86_64-\n",
          },
        },
        # To a path of this commit's and leg's own, so a test that turns
        # on the tree's path fails some run (driver.tl place-tree). After
        # every hashFiles, which reads the checkout.
        {
          name: "move the tree to a path of its own",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree",
        },
        {
          name: "build release Cosmic",
          id: "boot",
          run: "cosmic-driver cosmic_ci/driver.tl platform boot",
        },
        {
          name: "build the checked core and the format decoder",
          run: "cosmic-driver cosmic_ci/driver.tl platform checked-build",
        },
        {
          name: "run the checked core's suite",
          id: "checked-suite",
          run: "cosmic-driver cosmic_ci/driver.tl platform checked",
        },
        # A share's tests enter only some of the core's C functions: the
        # ones they did not are a file for the `ci` gate's join, which
        # fails for a function no share entered, as a whole run does.
        {
          name: "upload the C functions this share's tests did not enter",
          if: "matrix.shard != ''",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "checked-unentered-${{ matrix.name }}",
            path: "${{ runner.temp }}/checked-unentered/",
            "if-no-files-found": "error",
            # A job run again writes its share's list again.
            overwrite: true,
            "retention-days": 1,
          },
        },
        {
          name: "check performance fixture histories on the checked core",
          if: "matrix.performance == 'run'",
          run: "cosmic-driver cosmic_ci/driver.tl platform performance-checked",
        },
        # A run that failed keeps what it restored too (`whole`), but in
        # the merge queue, which saves no cache, only what it used. Cut to
        # the rows this run used, named by their digest.
        {
          name: "keep only this run's test verdicts",
          id: "verdicts-trim",
          if: "always() && steps.driver.outcome == 'success' && (env.COSMIC_CI_SAVES == 'true' || github.event_name == 'merge_group')",
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-trim ${{ (job.status == 'success' || github.event_name == 'merge_group') && steps.names.outputs.since || 'whole' }}",
        },
        # Read by this pull request's next try in the merge queue where
        # the run fails, whether this job passed or failed: no other step
        # relays these rows.
        {
          name: "upload what this try in the merge queue reached",
          if: "always() && github.event_name == 'merge_group' && steps.verdicts-trim.outputs.digest != ''",
          "continue-on-error": true,
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "queue-tried-verdicts-${{ matrix.name }}",
            path: "${{ runner.temp }}/verdicts/*.db",
            "if-no-files-found": "ignore",
            "retention-days": 1,
          },
        },
        {
          name: "summarize worker operations",
          if: "always() && steps.driver.outcome == 'success'",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },
        # The run's operations and suite rows, for `driver.tl report`.
        {
          name: "preserve CI driver database",
          if: "always()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "ci-driver-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/operations.db",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "preserve failure diagnostics",
          if: "failure()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "platform-diagnostics-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/platform/checked-diagnostics",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "describe the leg's container",
          if: "failure()",
          "working-directory": "/",
          shell: "sh",
          run: "docker inspect cosmic-leg || :; docker logs cosmic-leg || :",
        },
        # Whatever came before, so nothing left running there writes to
        # the tree the next step moves back.
        {
          name: "remove the leg's container",
          if: "always()",
          "working-directory": "/",
          shell: "sh",
          run: "docker rm -f cosmic-leg || :",
        },
        # As late as the tree is in place, so that a failed job's log ends
        # near why it failed: the lines its failed commands said of that
        # (cosmic_ci/failures.tl), and where the job was ended under a
        # command, the end of what that command said. On the runner, since a
        # leg's container is gone by now.
        {
          name: "say again what failed",
          if: "(failure() || cancelled()) && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl failures",
        },
        # Before checkout's post step, whose git refuses the repository at
        # another path, and before the saves, whose paths actions/cache
        # names relative to the workspace (driver.tl place-tree).
        {
          name: "move the tree back to where it was checked out",
          if: "always() && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree --restore",
        },
        # Whatever failed (a failing verdict takes a passing one out),
        # where the rows differ from the entry restored. Not the macOS
        # leg's scheduled runs: its keys hold the tree's path, which such a
        # run chooses by the commit (driver.tl place-tree), so its rows
        # would match no other run.
        {
          name: "save test verdicts",
          if: "always() && env.COSMIC_CI_SAVES == 'true' && steps.verdicts-trim.outputs.digest != '' && !(github.event_name == 'schedule' && env.COSMIC_CI_DECLARED_KEYS == '1') && steps.verdicts-restore.outputs.cache-matched-key != format('{0}{1}', steps.host-id.outputs.verdicts, steps.verdicts-trim.outputs.digest)",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}${{ steps.verdicts-trim.outputs.digest }}",
          },
        },
      ],
    },

    # The whole suite on a checked run (`--check-types`, orchestration.tl's
    # phase_checked_narrowing, bounded by `checked_narrowing_timeout_ns`),
    # on the release tool, on linux-x86_64's host, beside the legs. Not on
    # a pull request. Its verdicts stand apart (`narrowing.db`), under a
    # cache name of its own. As the checked suite's, the merge queue's run
    # and a manual run of a branch's are three shares at once, each its
    # own job, which saves nothing: whole, standing on no verdict, it took
    # 1276 and 1289 s of its 1260 s deadline (#4241, #4245).
    narrowing: {
      needs: ["queue-ref"],
      if: "!cancelled() && (github.event_name != 'merge_group' || needs.queue-ref.result == 'success') && github.event_name != 'pull_request'",
      name: "${{ matrix.name }}",
      strategy: {
        "fail-fast": false,
        matrix: {
          include: "${{ fromJSON(github.event_name == 'pull_request' && '[{\"name\": \"linux-x86_64-checked-narrowing\", \"shard\": \"\"}]' || github.event_name == 'merge_group' && '[{\"name\": \"linux-x86_64-checked-narrowing-1\", \"shard\": \"1/3\"}, {\"name\": \"linux-x86_64-checked-narrowing-2\", \"shard\": \"2/3\"}, {\"name\": \"linux-x86_64-checked-narrowing-3\", \"shard\": \"3/3\"}]' || github.event_name == 'push' && '[{\"name\": \"linux-x86_64-checked-narrowing\", \"shard\": \"\"}]' || (github.event_name == 'schedule' || github.ref == 'refs/heads/main') && '[{\"name\": \"linux-x86_64-checked-narrowing\", \"shard\": \"\"}]' || '[{\"name\": \"linux-x86_64-checked-narrowing-1\", \"shard\": \"1/3\"}, {\"name\": \"linux-x86_64-checked-narrowing-2\", \"shard\": \"2/3\"}, {\"name\": \"linux-x86_64-checked-narrowing-3\", \"shard\": \"3/3\"}]') }}",
        },
      },
      defaults: {run: {"working-directory": "ci", shell: "leg-shell {0}"}},
      "runs-on": "ubuntu-24.04",
      # actions: to find and download the pull request's last failed try in
      # the merge queue.
      permissions: {contents: "read", packages: "read", actions: "read"},
      "timeout-minutes": 60,
      env: {
        COSMIC_WORKER: "linux-x86_64-checked-narrowing",
        COSMIC_CI_NARROWING_SHARD: "${{ matrix.shard }}",
        TARGET: "x86_64-linux-musl",
        COSMIC_CI_REQUIRE_SANDBOX: "1",
        COSMIC_CI_DECLARED_KEYS: "0",
        COSMIC_CI_EVENT: "${{ (github.event_name == 'schedule' && github.event.schedule != '41 3 * * 0' || github.event_name == 'workflow_dispatch' && !inputs.every_test) && 'push' || github.event_name }}",
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },
        # A Linux leg's container, started by a step (not `container:`) so
        # the host can be set up for spawn's sandbox first
        # (.github/scripts/leg-container.sh, ci/README.md's "the Linux
        # legs' container").
        {
          name: "start the leg's container",
          "working-directory": ".",
          shell: "sh",
          env: {IMAGE: "ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a", TOKEN: "${{ secrets.GITHUB_TOKEN }}", ACTOR: "${{ github.actor }}"},
          run: "sh .github/scripts/leg-container.sh start \"$IMAGE\"",
        },
        # As root in the container: `runner` takes the workspace's owner's
        # uid, so it owns what the host's actions write. The ubuntu image
        # has useradd (-o: its own `ubuntu` user may hold the uid), the
        # alpine image busybox's adduser.
        {
          name: "create the unprivileged builder",
          "working-directory": "/",
          shell: "leg-shell --root {0}",
          run: "uid=\"$(stat -c %u \"$GITHUB_WORKSPACE\")\"; if command -v useradd >/dev/null; then useradd -m -o -u \"$uid\" runner; else adduser -D -u \"$uid\" runner; fi",
        },
        {
          name: "restore the pinned zig",
          id: "zig-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            key: "zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin', 'patch/zig-lib/**') }}",
          },
        },
        {
          name: "name the zig build cache, and the run's start",
          id: "names",
          uses: "./.github/actions/cache-names",
          with: {leg: "linux-x86_64"},
        },
        # The newest of this leg's entries main saved for this vendor part:
        # of this core part, else any. The weekly run restores nothing and
        # builds cold, which bounds what an entry carries; the daily ones
        # restore as a push does.
        {
          name: "restore zig build outputs",
          id: "zig-cache-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-\n${{ steps.names.outputs.vendor }}full-\n${{ steps.names.outputs.vendor }}\n",
            "lookup-only": "${{ github.event.schedule == '41 3 * * 0' }}",
          },
        },
        # Off main, the leg's newest entry of any vendor part; a second
        # step, since a ref's own entries are searched before main's.
        {
          name: "restore zig build outputs of another vendor part",
          if: "github.ref != 'refs/heads/main' && steps.zig-cache-restore.outputs.cache-matched-key == ''",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-restore.outputs.cache-primary-key }}",
            "restore-keys": "zig-build-linux-x86_64-\n",
          },
        },
        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          uses: "./.github/actions/cosmic-driver",
          with: {"zig-cache": true, shell: "leg-shell {0}"},
        },
        # What of the host every declared-key verdict's key holds
        # (COSMIC_HOST_ID), and the verdict cache's name.
        {
          name: "name the leg's host",
          id: "host-id",
          shell: "sh",
          env: {STARTED: "${{ hashFiles('.github/seccomp/**', '.github/scripts/leg-container.sh', '.github/scripts/seccomp-profile.sh') }}"},
          run: "cosmic-driver cosmic_ci/driver.tl leg-host-id \"linux-x86_64-checked-narrowing\" \"ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a\" \"ubuntu-24.04\" \"$STARTED\"",
        },
        # Main's newest verdicts and compiles for this host; only main
        # saves. A restore decides how many tests stand, never whether a
        # verdict is right.
        {
          name: "restore test verdicts",
          id: "verdicts-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}",
            "restore-keys": "${{ steps.host-id.outputs.verdicts }}\n",
          },
        },
        # As the platform job's: what this pull request's last failed try
        # in the merge queue reached.
        {
          name: "find this pull request's last failed try in the merge queue",
          id: "tried-run",
          if: "github.event_name == 'merge_group'",
          shell: "sh",
          "continue-on-error": true,
          env: {HEAD_REF: "${{ github.event.merge_group.head_ref }}", BASE_SHA: "${{ github.event.merge_group.base_sha }}", SHA: "${{ github.sha }}", ARTIFACT: "queue-tried-verdicts-${{ matrix.name }}", RUN_ID: "${{ github.run_id }}", GH_TOKEN: "${{ github.token }}"},
          run: "cosmic-driver cosmic_ci/driver.tl queue-tried-run",
        },
        {
          name: "download the last failed try's verdicts",
          id: "tried-download",
          if: "steps.tried-run.outputs.artifact != ''",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {
            "artifact-ids": "${{ steps.tried-run.outputs.artifact }}",
            "merge-multiple": true,
            path: "${{ runner.temp }}/tried-verdicts",
            "run-id": "${{ steps.tried-run.outputs.run }}",
            "github-token": "${{ github.token }}",
          },
        },
        {
          name: "take in the last failed try's verdicts",
          if: "steps.tried-download.outcome == 'success'",
          "continue-on-error": true,
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-merge \"${{ runner.temp }}/tried-verdicts\"",
        },
        {
          name: "restore compiles and parses",
          id: "compiles-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/build-cache",
            key: "compiles-linux-x86_64-",
            "restore-keys": "compiles-linux-x86_64-\n",
          },
        },
        # To a path of this commit's and leg's own, so a test that turns
        # on the tree's path fails some run (driver.tl place-tree). After
        # every hashFiles, which reads the checkout.
        {
          name: "move the tree to a path of its own",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree",
        },
        {
          name: "build release Cosmic",
          id: "boot",
          run: "cosmic-driver cosmic_ci/driver.tl platform boot",
        },
        {
          name: "run the whole suite on a checked run",
          id: "checked-narrowing",
          run: "cosmic-driver cosmic_ci/driver.tl platform checked-narrowing",
        },
        # A run that failed keeps what it restored too (`whole`), but in
        # the merge queue, which saves no cache, only what it used. Cut to
        # the rows this run used, named by their digest.
        {
          name: "keep only this run's test verdicts",
          id: "verdicts-trim",
          if: "always() && steps.driver.outcome == 'success' && (env.COSMIC_CI_SAVES == 'true' || github.event_name == 'merge_group')",
          run: "cosmic-driver cosmic_ci/driver.tl verdicts-trim ${{ (job.status == 'success' || github.event_name == 'merge_group') && steps.names.outputs.since || 'whole' }}",
        },
        # Read by this pull request's next try in the merge queue where
        # the run fails, whether this job passed or failed: no other step
        # relays these rows.
        {
          name: "upload what this try in the merge queue reached",
          if: "always() && github.event_name == 'merge_group' && steps.verdicts-trim.outputs.digest != ''",
          "continue-on-error": true,
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "queue-tried-verdicts-${{ matrix.name }}",
            path: "${{ runner.temp }}/verdicts/*.db",
            "if-no-files-found": "ignore",
            "retention-days": 1,
          },
        },
        {
          name: "summarize worker operations",
          if: "always() && steps.driver.outcome == 'success'",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },
        # The run's operations and suite rows, for `driver.tl report`.
        {
          name: "preserve CI driver database",
          if: "always()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "ci-driver-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/operations.db",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "preserve failure diagnostics",
          if: "failure()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "platform-diagnostics-${{ matrix.name }}",
            path: "${{ runner.temp }}/cosmic-ci/platform/local-diagnostics",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "describe the leg's container",
          if: "failure()",
          "working-directory": "/",
          shell: "sh",
          run: "docker inspect cosmic-leg || :; docker logs cosmic-leg || :",
        },
        # Whatever came before, so nothing left running there writes to
        # the tree the next step moves back.
        {
          name: "remove the leg's container",
          if: "always()",
          "working-directory": "/",
          shell: "sh",
          run: "docker rm -f cosmic-leg || :",
        },
        # As late as the tree is in place, so that a failed job's log ends
        # near why it failed: the lines its failed commands said of that
        # (cosmic_ci/failures.tl), and where the job was ended under a
        # command, the end of what that command said. On the runner, since a
        # leg's container is gone by now.
        {
          name: "say again what failed",
          if: "(failure() || cancelled()) && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl failures",
        },
        # Before checkout's post step, whose git refuses the repository at
        # another path, and before the saves, whose paths actions/cache
        # names relative to the workspace (driver.tl place-tree).
        {
          name: "move the tree back to where it was checked out",
          if: "always() && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree --restore",
        },
        # Whatever failed (a failing verdict takes a passing one out),
        # where the rows differ from the entry restored. Not the macOS
        # leg's scheduled runs: its keys hold the tree's path, which such a
        # run chooses by the commit (driver.tl place-tree), so its rows
        # would match no other run.
        {
          name: "save test verdicts",
          if: "always() && env.COSMIC_CI_SAVES == 'true' && steps.verdicts-trim.outputs.digest != '' && !(github.event_name == 'schedule' && env.COSMIC_CI_DECLARED_KEYS == '1') && steps.verdicts-restore.outputs.cache-matched-key != format('{0}{1}', steps.host-id.outputs.verdicts, steps.verdicts-trim.outputs.digest)",
          uses: "actions/cache/save@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/verdicts",
            key: "${{ steps.host-id.outputs.verdicts }}${{ steps.verdicts-trim.outputs.digest }}",
          },
        },
      ],
    },

    # The check of the pinned CI driver of a pull request and the queue,
    # beside the legs and booting nothing: cosmic_ci's tests, where what
    # the commit changed since main reaches what they read (ci/ and, of
    # the tree around it, .github/workflows/ci.yml alone, their
    # Test.policy grants), or where the paths changed are not known. A
    # pull request runs it so that a ci/ change which breaks those tests
    # fails there, not in a queue entry. The other runs check it on each
    # leg ("check the pinned CI driver" above). A batch's pull request
    # skips it, as it skips the legs (`platform` above).
    driver: {
      needs: ["queue-ref"],
      if: "!cancelled() && (github.event_name != 'merge_group' || needs.queue-ref.result == 'success') && (github.event_name == 'merge_group' || github.event_name == 'pull_request') && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'claude/batch-'))",
      name: "linux-x86_64-driver",
      defaults: {run: {"working-directory": "ci", shell: "leg-shell {0}"}},
      "runs-on": "ubuntu-24.04",
      permissions: {contents: "read", packages: "read"},
      "timeout-minutes": 20,
      env: {COSMIC_WORKER: "linux-x86_64", TARGET: "x86_64-linux-musl"},
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
          # As the format job's checkout, for the base the change is held to.
          with: {"fetch-depth": 2},
        },
        # The leg's container and its unprivileged builder, as the
        # platform job's linux-x86_64 leg has them.
        {
          name: "start the leg's container",
          "working-directory": ".",
          shell: "sh",
          env: {IMAGE: "ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a", TOKEN: "${{ secrets.GITHUB_TOKEN }}", ACTOR: "${{ github.actor }}"},
          run: "sh .github/scripts/leg-container.sh start \"$IMAGE\"",
        },
        {
          name: "create the unprivileged builder",
          "working-directory": "/",
          shell: "leg-shell --root {0}",
          run: "uid=\"$(stat -c %u \"$GITHUB_WORKSPACE\")\"; if command -v useradd >/dev/null; then useradd -m -o -u \"$uid\" runner; else adduser -D -u \"$uid\" runner; fi",
        },
        # One cosmic cache for every step after this: the launcher's cores
        # and the driver lie under $XDG_CACHE_HOME, and the unprivileged
        # builder cannot write the default ~/.cache. The platform job has
        # it from the driver action's `zig-cache`, whose caches this job
        # does not restore. $RUNNER_TEMP lies at its host path in the
        # leg's container.
        {
          name: "name the cosmic cache every later step shares",
          "working-directory": "/",
          shell: "sh",
          run: "echo \"XDG_CACHE_HOME=$RUNNER_TEMP/cache\" >> \"$GITHUB_ENV\"",
        },
        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          uses: "./.github/actions/cosmic-driver",
          with: {shell: "leg-shell {0}"},
        },
        {
          name: "find the base the markers are held to",
          id: "ceilings-base",
          shell: "sh",
          env: {SHA: "${{ github.sha }}", EVENT: "${{ github.event_name }}", REF: "${{ github.ref }}", BASE_REF: "${{ github.event.merge_group.base_ref }}", PR_BASE_REF: "${{ github.base_ref }}"},
          run: "cosmic-driver cosmic_ci/driver.tl ceilings-base",
          # With no base the paths changed are not known, and the check runs.
          "continue-on-error": true,
        },
        {
          name: "name the paths the commit changed",
          id: "changed",
          if: "steps.ceilings-base.outputs.sha != ''",
          shell: "sh",
          "continue-on-error": true,
          env: {BASE: "${{ steps.ceilings-base.outputs.sha }}", OUT: "${{ runner.temp }}/changed-paths"},
          run: "cosmic-driver cosmic_ci/driver.tl changed-paths",
        },
        # At a path of the commit's own, as the legs run it, so a test
        # that turns on the tree's path fails here too (driver.tl
        # place-tree).
        {
          name: "move the tree to a path of its own",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree",
        },
        # Every test, sandboxed, as the platform job's step runs them on
        # Linux: a module that reads the host without declaring it fails
        # here, as it does in a plain `cosmic test` in ci/.
        {
          name: "check the pinned CI driver",
          if: "steps.changed.outputs.driver != 'skip'",
          env: {COSMIC_VERDICT_CACHE: "0", COSMIC_TEST_SANDBOX: "1", COSMIC_SANDBOX: "must"},
          run: "cosmic-driver test cosmic_ci",
        },
        # Before checkout's post step, whose git refuses the repository at
        # another path.
        {
          name: "move the tree back to where it was checked out",
          if: "always() && steps.driver.outcome == 'success'",
          shell: "sh",
          run: "cosmic-driver cosmic_ci/driver.tl place-tree --restore",
        },
      ],
    },

    # The one check a ruleset requires: it fails when a leg, the checked
    # suite, the checked narrowing run, the pinned driver check or the
    # queue's check of its ref's caches did not pass, or when the queue
    # ref holds a cache once they have run. The checked jobs read as
    # passed on a pull request, which skips them; the driver job's result
    # is read in the queue and on a pull request, where it runs. On every
    # run but a pull request's it is
    # the provenance join too, proving the legs attested identical bytes:
    # the queue's and a branch's manual run's three, a push's, the
    # scheduled run's and a manual run of main's or with `macos` four.
    # A pull request's cancelled run (most often one a newer push replaced,
    # through the concurrency group above) skips the gate, so its check
    # reads as passed, not failed: the merge queue's run, whose gate fails
    # on a cancelled job, is what lets a change reach main. Every other
    # run's gate fails on a cancelled job, since a skipped required check
    # passes. A batch's pull request, whose legs and driver check are
    # skipped (`platform` above), reads its legs and driver check as passed.
    ci: {
      needs: ["queue-ref", "platform", "checked", "narrowing", "driver"],
      if: "always() && !(cancelled() && github.event_name == 'pull_request')",
      "runs-on": "ubuntu-24.04",
      # actions: to list the merge-queue ref's caches again.
      permissions: {contents: "read", actions: "read"},
      "timeout-minutes": 5,
      env: {COSMIC_WORKER: "provenance"},
      steps: [
        {
          if: "github.event_name != 'pull_request'",
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },
        # In the merge queue, fetched and checked against its pin with no
        # cache restored, so the check below runs on what no restore wrote.
        {
          name: "fetch the pinned provenance driver",
          id: "driver-fetch",
          if: "github.event_name == 'merge_group'",
          "working-directory": "ci",
          shell: "sh",
          run: "sh ../.github/scripts/cosmic-driver.sh",
        },
        # The ref's caches again, now every job has restored what it
        # restores, whether or not it passed: a cache written to the ref
        # while the run ran (by a runtime token an earlier run of the ref
        # leaked) fails the run here, so it does not merge.
        {
          name: "refuse a cache the merge-queue ref saved, after every job",
          if: "github.event_name == 'merge_group'",
          "working-directory": "ci",
          shell: "sh",
          env: {GH_TOKEN: "${{ github.token }}"},
          run: "cosmic-driver cosmic_ci/driver.tl queue-ref-caches",
        },
        {
          name: "every job passed",
          env: {
            RESULT: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'claude/batch-')) && 'success' || needs.platform.result }}",
            CHECKED: "${{ github.event_name == 'pull_request' && 'success' || needs.checked.result }}",
            NARROWING: "${{ github.event_name == 'pull_request' && 'success' || needs.narrowing.result }}",
            DRIVER: "${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'claude/batch-')) && 'success' || (github.event_name == 'merge_group' || github.event_name == 'pull_request') && needs.driver.result || 'success' }}",
            QUEUE_REF: "${{ github.event_name == 'merge_group' && needs.queue-ref.result || 'success' }}",
          },
          run: "echo \"merge-queue ref: $QUEUE_REF; legs: $RESULT; checked suite: $CHECKED; checked narrowing: $NARROWING; pinned driver: $DRIVER\"; [ \"$QUEUE_REF\" = success ] && [ \"$RESULT\" = success ] && [ \"$CHECKED\" = success ] && [ \"$NARROWING\" = success ] && [ \"$DRIVER\" = success ]",
        },
        {
          name: "bootstrap the pinned provenance driver",
          id: "driver",
          if: "github.event_name != 'pull_request' && github.event_name != 'merge_group'",
          uses: "./.github/actions/cosmic-driver",
        },
        # The checked suite's shares (the queue's and a branch's manual
        # run's, ci.yml's `checked`) each wrote the C functions their
        # tests did not enter: one in every list is one no test of the
        # whole suite entered, which fails here as it fails main's push,
        # which runs the suite whole (cosmic_ci/unentered.tl).
        {
          name: "download the C functions each checked share did not enter",
          id: "unentered-download",
          if: "needs.checked.result == 'success' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {pattern: "checked-unentered-*", "merge-multiple": true, path: "${{ runner.temp }}/checked-unentered"},
        },
        {
          name: "download the C functions each checked share did not enter: wait before the second try",
          if: "steps.unentered-download.outcome == 'failure'",
          shell: "sh",
          run: "rm -rf \"${{ runner.temp }}/checked-unentered\"; sleep 30",
        },
        {
          name: "download the C functions each checked share did not enter: second try",
          id: "unentered-retry",
          if: "steps.unentered-download.outcome == 'failure'",
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {pattern: "checked-unentered-*", "merge-multiple": true, path: "${{ runner.temp }}/checked-unentered"},
        },
        {
          name: "fail for a C function no checked share entered",
          if: "steps.unentered-download.outcome == 'success' || steps.unentered-retry.outcome == 'success'",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl unentered-join \"${{ runner.temp }}/checked-unentered\"",
        },
        {
          name: "download the products to compare",
          id: "products-download",
          if: "github.event_name != 'pull_request'",
          "continue-on-error": true,
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {pattern: "portable-product-*", path: "${{ runner.temp }}/cosmic-ci/products"},
        },
        {
          name: "download the products to compare: wait before the second try",
          if: "steps.products-download.outcome == 'failure'",
          shell: "sh",
          run: "rm -rf \"${{ runner.temp }}/cosmic-ci/products\"; sleep 30",
        },
        {
          name: "download the products to compare: second try",
          if: "steps.products-download.outcome == 'failure'",
          uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", # v8
          with: {pattern: "portable-product-*", path: "${{ runner.temp }}/cosmic-ci/products"},
        },
        {
          name: "compare the Cosmic bytes executed on every native host",
          if: "github.event_name != 'pull_request'",
          "working-directory": "ci",
          env: {COSMIC_CI_PRODUCTS: "${{ (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.macos)) && '4' || '3' }}"},
          run: "cosmic-driver cosmic_ci/driver.tl provenance",
        },
        {
          name: "summarize provenance operations",
          if: "always() && (steps.driver.outcome == 'success' || steps.driver-fetch.outcome == 'success')",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },
        {
          name: "preserve provenance operations",
          if: "always() && github.event_name != 'pull_request'",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "provenance-operations",
            path: "${{ runner.temp }}/cosmic-ci/operations.db",
            "if-no-files-found": "ignore",
          },
        },
      ],
    },
  },
}
