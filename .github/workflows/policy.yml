# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "policy",

  # Step (b) of the sandbox plan's migration (#2621): the
  # suite with every sandboxed worker started under a cosmic.sandbox
  # policy (COSMIC_TEST_POLICY=1, build/test_policy.tl), on linux-x86_64's
  # image and host, so the tests that fail under the policy path are
  # listed, and fixed, before it becomes the default (step (c)).
  # Not a gate: no ruleset requires this check, ci.yml's `ci` job does not
  # wait on it, and its job passes whatever the suite did
  # (`continue-on-error`); a failure is read in the run's summary and the
  # diagnostics it keeps. Its verdicts are kept apart from the default
  # sandbox's by a runtime of their own, so it never stands on a pass the
  # default path earned.
  # TODO: gate the merge on this job, and drop its `continue-on-error`,
  # once the suite passes under the policy path, which is when step (c) of
  # the sandbox plan makes it the default and this workflow is deleted
  # with the flag.
  "on": {
    # Main's pushes, the day's run and a manual one: not every branch's,
    # which would cost a runner for a check nobody waits on.
    push: {branches: ["main"]},
    workflow_dispatch: {},
    # Every day, the whole suite whatever stood.
    schedule: [{cron: "23 4 * * *"}],
  },

  permissions: {contents: "read"},

  # A newer push supersedes a branch's run; main's run to the end.
  concurrency: {
    group: "${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || 'run' }}-${{ github.ref }}",
    "cancel-in-progress": "${{ github.ref != 'refs/heads/main' }}",
  },

  jobs: {
    policy: {
      if: "github.repository == 'cosmic-lua/cosmic'",
      name: "linux-x86_64-policy",
      defaults: {run: {"working-directory": "ci", shell: "leg-shell {0}"}},
      "runs-on": "ubuntu-24.04",
      permissions: {contents: "read", packages: "read"},
      "timeout-minutes": 60,
      # Non-gating: red steps below show in the run's summary, not as a
      # failed check.
      "continue-on-error": true,
      env: {
        COSMIC_WORKER: "linux-x86_64-policy",
        TARGET: "x86_64-linux-musl",
        # As ci.yml's Linux legs: a worker is sandboxed or the run fails,
        # and a scheduled or manual run runs every test.
        COSMIC_CI_REQUIRE_SANDBOX: "1",
        COSMIC_CI_DECLARED_KEYS: "0",
        COSMIC_CI_EVENT: "${{ github.event_name }}",
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },

        # As ci.yml's Linux legs: the leg's container, started with what
        # spawn's sandbox needs (leg-container.sh), and an unprivileged
        # builder of the host runner's uid.
        {
          name: "start the leg's container",
          "working-directory": ".",
          shell: "sh",
          env: {IMAGE: "ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a", TOKEN: "${{ secrets.GITHUB_TOKEN }}", ACTOR: "${{ github.actor }}"},
          run: "sh .github/scripts/leg-container.sh start \"$IMAGE\"",
        },
        {
          name: "create the unprivileged builder",
          "working-directory": "/",
          shell: "leg-shell --root {0}",
          run: "useradd -m -o -u \"$(stat -c %u \"$GITHUB_WORKSPACE\")\" runner",
        },

        # What linux-x86_64's leg restores and saves, restored alone: this
        # job saves nothing.
        {
          name: "restore the pinned zig",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            key: "zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin', 'patch/zig-lib/**') }}",
          },
        },
        {
          name: "name the zig build cache, and the run's start",
          id: "names",
          uses: "./.github/actions/cache-names",
          with: {leg: "linux-x86_64"},
        },
        {
          name: "restore zig build outputs",
          id: "zig-cache-restore",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "${{ steps.names.outputs.vendor }}full-${{ steps.names.outputs.core }}-\n${{ steps.names.outputs.vendor }}full-\n${{ steps.names.outputs.vendor }}\n",
          },
        },
        {
          name: "restore zig build outputs of another vendor part",
          if: "github.ref != 'refs/heads/main' && steps.zig-cache-restore.outputs.cache-matched-key == ''",
          uses: "actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25", # v5.1.0
          with: {
            path: "${{ runner.temp }}/zig-build",
            key: "${{ steps.zig-cache-restore.outputs.cache-primary-key }}",
            "restore-keys": "zig-build-linux-x86_64-\n",
          },
        },

        # To a path of this commit's and this job's own, as a leg's tree
        # moves (ci.yml). After every hashFiles, which reads the checkout.
        {
          name: "move the tree to a path of its own",
          "working-directory": ".",
          run: "sh .github/scripts/place-tree.sh",
        },
        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          uses: "./.github/actions/cosmic-driver",
          with: {"zig-cache": true, shell: "leg-shell {0}"},
        },
        {
          name: "build release Cosmic",
          id: "boot",
          run: "cosmic-driver cosmic_ci/driver.tl platform boot",
        },

        # The suite under the policy path: every test, since no verdict of
        # the default path stands for it. Its failures are the point, so
        # the step passes whatever they are and the summary says them.
        {
          name: "run the suite with every worker under a policy",
          id: "suite",
          "continue-on-error": true,
          run: "cosmic-driver cosmic_ci/driver.tl platform policy-suite",
        },
        {
          name: "summarize worker operations",
          if: "always() && steps.driver.outcome == 'success'",
          run: "cosmic-driver cosmic_ci/driver.tl summarize",
        },
        {
          name: "preserve what the suite printed",
          if: "always()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "policy-suite-linux-x86_64",
            path: "${{ runner.temp }}/cosmic-ci/platform/local-diagnostics/policy-test.*",
            "if-no-files-found": "ignore",
            "retention-days": 7,
          },
        },
        {
          name: "describe the leg's container",
          if: "failure()",
          "working-directory": "/",
          shell: "sh",
          run: "docker inspect cosmic-leg || :; docker logs cosmic-leg || :",
        },
        {
          name: "remove the leg's container",
          if: "always()",
          "working-directory": "/",
          shell: "sh",
          run: "docker rm -f cosmic-leg || :",
        },
        # Before checkout's post step, whose git refuses the repository at
        # another path (place-tree.sh).
        {
          name: "move the tree back to where it was checked out",
          if: "always()",
          "working-directory": ".",
          shell: "sh",
          run: "[ ! -f .github/scripts/place-tree.sh ] || sh .github/scripts/place-tree.sh --restore",
        },
      ],
    },
  },
}
