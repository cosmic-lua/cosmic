name: portable experiment
on:
  push:
    branches: [explore/portable-launch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}
      - run: bin/zig build boot -Dportable-probe=true
      - run: timeout 30 o/bin/cosmic test
      - name: validate portable format writer and decoder
        run: test/portable/format.sh o/portable/format
      - name: build the cross-host launcher contract fixture
        run: test/portable/launcher_build.sh o/portable/launcher
      - name: build the real retained-artifact runtime fixture
        run: test/portable/runtime_build.sh o/portable/runtime
      - run: experiments/portable/pack.sh
      - name: build loader probes for each target
        run: |
          for target in x86_64-linux-musl aarch64-linux-musl aarch64-macos; do
            bin/zig cc -target "$target" -O2 experiments/portable/payload.c -o "o/portable/payload-$target"
            bin/zig cc -target "$target" -O2 -Wall -Wextra -Werror experiments/portable/probe.c -o "o/portable/probe-$target"
          done
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: portable-experiment
          path: |
            o/portable/cosmic
            o/portable/payload-*
            o/portable/probe-*
            o/portable/format/*
            o/portable/launcher/*
            o/portable/runtime/*
  execute:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-musl
          - runner: macos-15
            target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portable-experiment
          path: portable
      - name: inspect kernel loading behavior
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x portable/*
          mkdir portable/probe-work
          portable/probe-$TARGET "$PWD/portable/payload-$TARGET" "$PWD/portable/probe-work"
      - name: reject malformed portable format fields
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x portable/format/format-test-$TARGET
          portable/format/format-test-$TARGET portable/format/program
      - name: verify the manifest's exact macOS core slice
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          portable/format/format-test-$TARGET --inspect portable/format/program > portable/format/inspection
          target_id=$(awk -F '\t' -v target="$TARGET" '$4 == target { print $1 }' portable/format/targets.tsv)
          set -- $(awk -v target="$target_id" '$1 == "entry" && $2 == target { print }' portable/format/inspection)
          blocks=$(( ($5 + 16383) / 16384 ))
          dd if=portable/format/program bs=16384 skip=$(( $4 / 16384 )) count="$blocks" 2>/dev/null | head -c "$5" > portable/format/macos-core
          test "$(wc -c < portable/format/macos-core | tr -d ' ')" = "$5"
          codesign --verify --strict --verbose=2 portable/format/macos-core
      - name: execute identical portable bytes on this host
        run: |
          experiments/portable/check.sh "$PWD/portable/cosmic"
          test/portable/characterize.sh "$PWD/portable/cosmic"
      - name: validate the production launcher contract on this host
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x portable/launcher/launcher.test
          chmod +x portable/launcher/payloads/socket-$TARGET
          test/portable/launcher_test.sh \
            "$PWD/portable/launcher/launcher.test" \
            "$PWD/portable/launcher/payloads/socket-$TARGET"
      - name: validate retained artifact bytes with the real runtime
        run: test/portable/runtime_test.sh "$PWD/portable/runtime"
  identity-x86:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portable-experiment
          path: portable
      - name: start one work database with release, basis, and sanitized contexts
        run: |
          chmod +x portable/runtime/runtime.*
          COSMIC_PORTABLE_IDENTITY_STATE_OUT="$PWD/identity-state" \
            test/portable/identity_test.sh "$PWD/portable/runtime"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: portable-identity-x86
          path: identity-state
          include-hidden-files: true
  identity-linux-arm:
    needs: [build, identity-x86]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portable-experiment
          path: portable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portable-identity-x86
          path: identity-in
      - name: reuse the transported work database under the real arm Linux core
        run: |
          chmod +x portable/runtime/runtime.*
          COSMIC_PORTABLE_IDENTITY_STATE_OUT="$PWD/identity-state" \
            test/portable/identity_test.sh "$PWD/portable/runtime" \
              "$PWD/identity-in"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: portable-identity-linux-arm
          path: identity-state
          include-hidden-files: true
  identity-macos-arm:
    needs: [build, identity-linux-arm]
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portable-experiment
          path: portable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portable-identity-linux-arm
          path: identity-in
      - name: reuse the transported work database under the real macOS core
        run: |
          chmod +x portable/runtime/runtime.*
          test/portable/identity_test.sh "$PWD/portable/runtime" \
            "$PWD/identity-in"
