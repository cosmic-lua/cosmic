# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "weekly review",

  # Once a week, Opus reviews the week's changes and one area of the tree
  # (ci/agents/weekly-review.md says how) and opens up to 3 fixes as draft
  # pull requests. It acts as the whilpbot App, which cannot bypass main's
  # ruleset, so it can push branches and open pull requests but not land
  # them.
  #
  # The agent is pi (ci/cosmic_ci/review.tl), not the Claude Code
  # action: subscriber API credits pay for the Claude API and the Agent
  # SDK but not for Claude Code, and the action's calls count as Claude
  # Code. pi calls the API directly.
  #
  # There is no Claude API key: pi trades the job's GitHub OIDC token for
  # a Claude token by workload identity federation. The Console rule
  # matches this repository's main, by the owner and repository ids GitHub
  # puts in the subject, and this workflow (`job_workflow_ref`); its id,
  # the organization's and the service account's are repository
  # variables. The agent can read the current token file and the whilpbot
  # token, and could mint GitHub OIDC tokens (review.tl says why), and pi
  # has no budget flag: the cosmic workspace's spend limit is the cap,
  # with this job's timeout.
  "on": {
    # Sunday 04:00 UTC: Saturday evening in Los Angeles.
    schedule: [
      {cron: "0 4 * * 0"},
    ],
    workflow_dispatch: {},
  },

  permissions: {contents: "read"},

  concurrency: {group: "weekly-review", "cancel-in-progress": false},

  jobs: {
    review: {
      if: "github.repository == 'cosmic-lua/cosmic' && github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      # id-token: the GitHub OIDC token that pi trades for a Claude token.
      permissions: {contents: "read", "id-token": "write"},
      "timeout-minutes": 150,
      steps: [
        {
          name: "mint the whilpbot token",
          id: "app",
          uses: "actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859", # v3
          with: {
            "app-id": "${{ secrets.APP_ID }}",
            "private-key": "${{ secrets.APP_KEY }}",
            repositories: "cosmic",
          },
        },

        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
          with: {"fetch-depth": 0, "persist-credentials": false},
        },

        {
          name: "boot the tree's cosmic",
          run: "bin/cosmic --version",
        },

        {
          # pi needs Node 22.19 or later.
          uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1", # v7.1.0
          with: {"node-version": "22"},
        },

        {uses: "./.github/actions/cosmic-driver"},

        {
          name: "run the weekly review",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl review",
          env: {
            ANTHROPIC_FEDERATION_RULE_ID: "${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}",
            ANTHROPIC_ORGANIZATION_ID: "${{ vars.ANTHROPIC_ORGANIZATION_ID }}",
            ANTHROPIC_SERVICE_ACCOUNT_ID: "${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}",
            GH_TOKEN: "${{ steps.app.outputs.token }}",
          },
        },
      ],
    },
  },
}
