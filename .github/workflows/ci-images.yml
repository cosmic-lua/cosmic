# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "ci-images",

  # Builds the images ci.yml's Linux legs run in (ci/images/*/Dockerfile),
  # so a CI run installs nothing from a package mirror. A branch push only
  # builds them, to show the Dockerfiles still work; a push to main, or a
  # manual run on main, also publishes them to GHCR as
  # ghcr.io/<repo>-ci-<image>:<commit> and writes each index's digest to the
  # run's summary. ci.yml names an image by that digest, so publishing a new
  # one changes nothing until an edit to ci.yml moves the digest. The jobs
  # run on the CI driver (ci/cosmic_ci/images.tl), so a change to it merged
  # to main publishes both images again under that commit's tag.
  # TODO: rebuild on a schedule, so a security update in either base is a
  # published image waiting for its digest to move, not a build to start.
  # TODO: prune old tags from GHCR, keeping every digest ci.yml has ever
  # named, once there is a retention rule that can tell which those are.
  "on": {
    push: {
      "branches-ignore": [
        "gh-readonly-queue/**",
      ],
      paths: [
        "ci/images/**",
        ".github/workflows/ci-images.yml",
        # What the jobs run: the driver, the one CI pins, and what fetches it.
        "ci/cosmic_ci/**",
        "ci/cosmic-driver.pin",
        "bin/cosmic-bootstrap",
        ".github/scripts/cosmic-driver.sh",
      ],
    },
    workflow_dispatch: {},
  },

  permissions: {contents: "read"},

  env: {
    # The snapshot of the Ubuntu archive the ubuntu image installs from; see
    # ci/images/ubuntu/Dockerfile. Moving it is a deliberate edit.
    UBUNTU_SNAPSHOT: "20260924T120000Z",
    PUBLISH: "${{ github.repository == 'cosmic-lua/cosmic' && github.ref == 'refs/heads/main' }}",
  },

  jobs: {
    build: {
      name: "build ${{ matrix.image }} ${{ matrix.arch }}",
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 20,
      permissions: {
        contents: "read",
        packages: "write",
      },
      strategy: {
        "fail-fast": false,
        matrix: {
          include: [
            {image: "ubuntu", arch: "amd64", runner: "ubuntu-24.04"},
            {image: "ubuntu", arch: "arm64", runner: "ubuntu-24.04-arm"},
            {image: "alpine", arch: "amd64", runner: "ubuntu-24.04"},
          ],
        },
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },

        {
          name: "cache the pinned CI driver",
          uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830", # v4.3.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/bootstrap",
            key: "cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}",
          },
        },

        {
          name: "bootstrap the pinned CI driver",
          "working-directory": "ci",
          run: "sh ../.github/scripts/cosmic-driver.sh",
        },

        {
          name: "log in to GHCR",
          if: "env.PUBLISH == 'true'",
          env: {TOKEN: "${{ secrets.GITHUB_TOKEN }}"},
          run: "printf '%s\\n' \"$TOKEN\" | docker login ghcr.io -u \"$GITHUB_ACTOR\" --password-stdin",
        },

        {
          name: "build, and on main push, the image for this architecture",
          env: {
            IMAGE: "${{ matrix.image }}",
            ARCH: "${{ matrix.arch }}",
          },
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl image-build",
        },
      ],
    },

    publish: {
      name: "publish ${{ matrix.image }}",
      needs: "build",
      if: "github.repository == 'cosmic-lua/cosmic' && github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      permissions: {
        contents: "read",
        packages: "write",
      },
      strategy: {
        matrix: {
          include: [
            {image: "ubuntu", arches: "amd64 arm64"},
            {image: "alpine", arches: "amd64"},
          ],
        },
      },
      steps: [
        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },

        {
          name: "cache the pinned CI driver",
          uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830", # v4.3.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/bootstrap",
            key: "cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}",
          },
        },

        {
          name: "bootstrap the pinned CI driver",
          "working-directory": "ci",
          run: "sh ../.github/scripts/cosmic-driver.sh",
        },

        {
          name: "join the architectures under one tag and report its digest",
          env: {
            IMAGE: "${{ matrix.image }}",
            ARCHES: "${{ matrix.arches }}",
            TOKEN: "${{ secrets.GITHUB_TOKEN }}",
          },
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl image-publish",
        },
      ],
    },
  },
}
