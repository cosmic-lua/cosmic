name: repro-744

# Minimal reproduction of #744: a fresh, high-concurrency burst of
# Landlock-sandboxed children where one intermittently loses its global
# `r:shared` unveil grant and is denied a read it was granted. Runs the
# pinned landlock-make over repro/Makefile (no teal/cosmic/bootstrap).
#
# Each job: prove Landlock enforces (canary), run a low-concurrency control
# (must stay clean), then a heavily oversubscribed burst. A denied granted
# read fails the burst step — that red IS the reproduction.

on:
  workflow_dispatch:
  push:
    branches: [claude/cosmic-744-repro]

permissions:
  contents: read

env:
  MAKE_URL: https://github.com/whilp/cosmopolitan/releases/download/2026.07.20-c5b6ed206/make
  MAKE_SHA: 1f0e254c075534da5518ffa1f6e040ea38bae9e0ea14bd5f7a726aef7420262e

jobs:
  landlock-probe:
    # Ground truth, independent of landlock-make: is Landlock actually
    # available and enforcing on this runner? Create a ruleset granting read
    # under /tmp only, self-restrict, then try to open a file OUTSIDE it.
    runs-on: ubuntu-latest
    steps:
      - name: raw Landlock availability + enforcement
        run: |
          set -uo pipefail
          echo "kernel: $(uname -r)"
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '<unreadable>')"
          cat > /tmp/ll.c <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <string.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/syscall.h>
          #include <sys/prctl.h>
          #include <linux/landlock.h>
          #ifndef __NR_landlock_create_ruleset
          #define __NR_landlock_create_ruleset 444
          #define __NR_landlock_add_rule 445
          #define __NR_landlock_restrict_self 446
          #endif
          #ifndef LANDLOCK_CREATE_RULESET_VERSION
          #define LANDLOCK_CREATE_RULESET_VERSION (1U<<0)
          #endif
          static int try_open(const char*p){int fd=open(p,O_RDONLY);if(fd>=0){close(fd);return 0;}return -errno;}
          int main(){
            long abi=syscall(__NR_landlock_create_ruleset,NULL,0,LANDLOCK_CREATE_RULESET_VERSION);
            printf("landlock ABI = %ld (%s)\n",abi,abi<0?strerror(errno):"available");
            if(abi<1){printf("VERDICT: Landlock UNAVAILABLE on this runner\n");return 0;}
            struct landlock_ruleset_attr ra={.handled_access_fs=LANDLOCK_ACCESS_FS_READ_FILE|LANDLOCK_ACCESS_FS_READ_DIR};
            int rs=syscall(__NR_landlock_create_ruleset,&ra,sizeof(ra),0);
            if(rs<0){printf("create_ruleset: %s\n",strerror(errno));return 0;}
            int dfd=open("/tmp",O_PATH|O_CLOEXEC);
            struct landlock_path_beneath_attr pb={.allowed_access=LANDLOCK_ACCESS_FS_READ_FILE|LANDLOCK_ACCESS_FS_READ_DIR,.parent_fd=dfd};
            if(syscall(__NR_landlock_add_rule,rs,LANDLOCK_RULE_PATH_BENEATH,&pb,0)){printf("add_rule: %s\n",strerror(errno));return 0;}
            close(dfd);
            if(prctl(PR_SET_NO_NEW_PRIVS,1,0,0,0)){printf("no_new_privs: %s\n",strerror(errno));return 0;}
            int rr=syscall(__NR_landlock_restrict_self,rs,0);
            printf("restrict_self = %d (%s)\n",rr,rr?strerror(errno):"ok");
            int granted=try_open("/tmp");
            int outside=try_open("/etc/hostname");
            printf("open /tmp (granted)       -> %d\n",granted);
            printf("open /etc/hostname (deny) -> %d\n",outside);
            if(rr==0 && granted==0 && outside==-EACCES)
              printf("VERDICT: Landlock ENFORCING (granted allowed, ungranted EACCES)\n");
            else
              printf("VERDICT: Landlock present but NOT enforcing as expected\n");
            return 0;
          }
          EOF
          gcc -O2 -o /tmp/ll /tmp/ll.c && /tmp/ll

  plain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: fetch pinned landlock-make
        working-directory: repro
        run: |
          set -euo pipefail
          curl -fsSL -o cosmo-make "$MAKE_URL"
          echo "$MAKE_SHA  cosmo-make" | sha256sum -c -
          chmod +x cosmo-make
      - name: low-concurrency control (must enforce + stay clean)
        working-directory: repro
        run: N=100 J=1 ITERS=3 ./run.sh
      - name: high-concurrency burst (a denied grant here == reproduced)
        working-directory: repro
        run: N=300 J=128 ITERS=40 HAMMER=3000 ./run.sh

  offline-lane:
    # Mirror pr.yml's offline lane: network namespace + drop to the runner
    # user, the exact context where #744 was observed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: fetch pinned landlock-make
        working-directory: repro
        run: |
          set -euo pipefail
          curl -fsSL -o cosmo-make "$MAKE_URL"
          echo "$MAKE_SHA  cosmo-make" | sha256sum -c -
          chmod +x cosmo-make
      - name: burst inside netns as the runner user
        run: |
          set -euo pipefail
          sudo unshare --net sh -c '
            exec sudo -u runner env HOME=/home/runner \
              sh -c "cd $PWD/repro && N=300 J=128 ITERS=40 HAMMER=3000 ./run.sh"'

  # Iteration 3: the faithful test — the REAL teal compiler (assimilated
  # bootstrap) resolving many synthetic modules via a global grant, under a
  # fresh sandboxed burst at the offline lane's own -j nproc. A compile that
  # reports "module not found" for a present, granted module is #744.
  teal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: fetch pinned landlock-make
        working-directory: repro/teal
        run: |
          set -euo pipefail
          curl -fsSL -o cosmo-make "$MAKE_URL"
          echo "$MAKE_SHA  cosmo-make" | sha256sum -c -
          chmod +x cosmo-make
      - name: teal compile burst (real compiler, sandboxed)
        working-directory: repro/teal
        run: N=250 K=100 ITERS=20 ./run.sh

  teal-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: fetch make + bootstrap (online, before the netns)
        working-directory: repro/teal
        run: |
          set -euo pipefail
          curl -fsSL -o cosmo-make "$MAKE_URL"
          echo "$MAKE_SHA  cosmo-make" | sha256sum -c -
          chmod +x cosmo-make
          curl -fsSL -o cosmic \
            https://github.com/whilp/cosmic/releases/download/2026-07-19-5c6bce5/cosmic-lua
          echo "6c2a0afe6c942560ce2a0d796ddf8f8df096ce2c92b8ce142c28da59ecac6dc6  cosmic" | sha256sum -c -
          chmod +x cosmic
          ./cosmic --assimilate
      - name: teal compile burst inside netns as the runner user
        run: |
          set -euo pipefail
          sudo unshare --net sh -c '
            exec sudo -u runner env HOME=/home/runner \
              sh -c "cd $PWD/repro/teal && N=250 K=100 ITERS=20 ./run.sh"'

  # Iteration 4: replicate PR #746's exact resolution — absolute tree-only
  # TL_PATH + root-dotted require("lib.mods.x") (the lib.docs.publish shape),
  # --include-dir lib, r:lib grant — under the sandbox. A "module not found"
  # here convicts #746's resolution rather than #744.
  tlpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: fetch pinned landlock-make
        working-directory: repro/tlpath
        run: |
          set -euo pipefail
          curl -fsSL -o cosmo-make "$MAKE_URL"
          echo "$MAKE_SHA  cosmo-make" | sha256sum -c -
          chmod +x cosmo-make
      - name: tl_path resolution burst (real compiler, sandboxed)
        working-directory: repro/tlpath
        run: N=250 K=100 ITERS=30 ./run.sh

  tlpath-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: fetch make + bootstrap (online, before the netns)
        working-directory: repro/tlpath
        run: |
          set -euo pipefail
          curl -fsSL -o cosmo-make "$MAKE_URL"
          echo "$MAKE_SHA  cosmo-make" | sha256sum -c -
          chmod +x cosmo-make
          curl -fsSL -o cosmic \
            https://github.com/whilp/cosmic/releases/download/2026-07-19-5c6bce5/cosmic-lua
          echo "6c2a0afe6c942560ce2a0d796ddf8f8df096ce2c92b8ce142c28da59ecac6dc6  cosmic" | sha256sum -c -
          chmod +x cosmic
          ./cosmic --assimilate
      - name: tl_path resolution burst inside netns as the runner user
        run: |
          set -euo pipefail
          sudo unshare --net sh -c '
            exec sudo -u runner env HOME=/home/runner \
              sh -c "cd $PWD/repro/tlpath && N=250 K=100 ITERS=30 ./run.sh"'
