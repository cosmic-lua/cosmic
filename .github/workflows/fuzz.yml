name: fuzz

# Every other run fuzzes with FUZZ_SEED's default, so each one checks the
# same inputs and finds nothing the first did not. This one draws a seed
# of its own each night, from the run's id, and fuzzes on the
# checked core, so the properties keep meeting inputs no run has checked.
# A failure names its seed; `FUZZ_SEED=<seed> FUZZ_ITERS=<iteration>`
# reproduces it anywhere, and the failing inputs are kept as an artifact
# to add to testdata/fuzz/ once fixed (build/fuzz/init.tl).
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: FUZZ_SEED (the run's id when empty)
        required: false
      iters:
        description: FUZZ_ITERS
        required: false
        default: '2000'

permissions:
  contents: read

jobs:
  fuzz:
    if: github.repository == 'cosmic-lua/cosmic'
    runs-on: ubuntu-24.04
    # As ci.yml's linux-x86_64 leg: its image, and an unprivileged
    # `runner` user owning the checkout, which every step after the
    # hand-over runs as.
    container:
      image: ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    defaults:
      run:
        shell: setpriv --reuid=runner --regid=runner --init-groups sh -e {0}
    env:
      FUZZ_SEED: ${{ inputs.seed || github.run_id }}
      # TODO: 10000 once a test's report no longer outgrows the runner's
      # capture limit (the TODO on build/test_worker.tl's encode_reads):
      # archive extraction's does past about 5000.
      FUZZ_ITERS: ${{ inputs.iters || '2000' }}
    steps:
      - name: create the unprivileged builder
        working-directory: /
        shell: sh
        run: useradd -m -o -u "$(stat -c %u "$GITHUB_WORKSPACE")" runner

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: cache the pinned CI driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cache/cosmic/bootstrap
          key: cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}

      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}

      - name: hand the checkout and restored caches over to the unprivileged builder
        working-directory: /
        shell: sh
        run: chown -R runner "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      # TODO: this compiles vendor/ and core/ cold each night; restoring
      # ci.yml's zig build cache for the linux-x86_64 leg would save it.
      - name: build and boot the checked core
        run: XDG_CACHE_HOME="$RUNNER_TEMP/cache" bin/zig build sanitized

      - name: fuzz every property on the checked core
        run: |
          {
            echo "FUZZ_SEED=$FUZZ_SEED FUZZ_ITERS=$FUZZ_ITERS"
            echo
            echo "A failure's report names the iteration; FUZZ_SEED=$FUZZ_SEED FUZZ_ITERS=<iteration> reproduces it."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/fuzz"
          # A failing test's directory is left under TMPDIR, holding the
          # shrunk input it kept (build/test.tl's sweep).
          TMPDIR="$RUNNER_TEMP/fuzz" COSMIC_AUTO_BOOT=0 COSMIC_TEST_TIMEOUT=1200 \
            o/sanitized/bin/cosmic test $(find . \( -path ./o -o -path ./vendor -o -path ./ci \) -prune \
              -o -name '*_fuzz_test.tl' -print | sort)

      - name: keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: fuzz-inputs-${{ env.FUZZ_SEED }}
          path: ${{ runner.temp }}/fuzz/*/real/*.input
          if-no-files-found: ignore
