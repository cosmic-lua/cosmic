# Flow-style YAML, held by build/workflows_test.tl to what YAML and
# JSON5 read alike; a longer script lives under .github/scripts/.
{
  name: "fuzz",

  # The only run that fuzzes: CI's, which gate a merge, set FUZZ_ITERS=0
  # and check only each property's corpus (ci/cosmic_ci/orchestration.tl).
  # This one draws a seed of its own each night, from the run's id, and
  # fuzzes on the checked core, so the properties keep meeting inputs no
  # run has checked. A failure's report names the `FUZZ_CASE` that checks
  # its input again anywhere, the failing inputs are kept as an artifact
  # to add to testdata/fuzz/ once fixed (build/fuzz/init.tl), and the
  # run's summary lists what failed. A failed run is seen as a red run,
  # and in the mail GitHub sends whoever last edited the schedule below.
  # TODO: once the repository has issues enabled, a job on a failed or
  # cancelled run could open one (or comment on the one still open), so a
  # failure reaches more than whoever last edited the schedule.
  "on": {
    schedule: [
      {cron: "17 7 * * *"},
    ],
    workflow_dispatch: {
      inputs: {
        seed: {
          description: "FUZZ_SEED (the run's id when empty)",
          required: false,
        },
        iters: {
          description: "FUZZ_ITERS",
          required: false,
          default: "2000",
        },
      },
    },
  },

  permissions: {contents: "read"},

  jobs: {
    fuzz: {
      if: "github.repository == 'cosmic-lua/cosmic'",
      "runs-on": "ubuntu-24.04",
      # As ci.yml's linux-x86_64 leg: its image, and an unprivileged
      # `runner` user owning the checkout, which every step after the
      # hand-over runs as.
      container: {
        image: "ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a",
        credentials: {
          username: "${{ github.actor }}",
          password: "${{ secrets.GITHUB_TOKEN }}",
        },
        options: "--init",
      },
      permissions: {
        contents: "read",
        packages: "read",
      },
      "timeout-minutes": 60,
      defaults: {
        run: {shell: "setpriv --reuid=runner --regid=runner --init-groups sh -e {0}"},
      },
      env: {
        FUZZ_SEED: "${{ inputs.seed || github.run_id }}",
        # TODO: 10000 once a test's report no longer outgrows the runner's
        # capture limit (the TODO on build/test_worker.tl's encode_reads):
        # archive extraction's does past about 5000.
        FUZZ_ITERS: "${{ inputs.iters || '2000' }}",
      },
      steps: [
        {
          name: "create the unprivileged builder",
          "working-directory": "/",
          shell: "sh",
          run: "useradd -m -o -u \"$(stat -c %u \"$GITHUB_WORKSPACE\")\" runner",
        },

        {
          uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd", # v6
        },

        {
          name: "cache the pinned CI driver",
          uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830", # v4.3.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/bootstrap",
            key: "cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}",
          },
        },

        {
          name: "cache the pinned zig",
          uses: "actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830", # v4.3.0
          with: {
            path: "${{ runner.temp }}/cache/cosmic/zig",
            # v2: installs are named by the pin's sha too (build/zig.tl's
            # install_name); bump it when that name's shape changes again.
            key: "zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}",
          },
        },

        {
          name: "hand the checkout and restored caches over to the unprivileged builder",
          "working-directory": "/",
          shell: "sh",
          run: "chown -R runner \"$GITHUB_WORKSPACE\" \"$RUNNER_TEMP\"",
        },

        {
          name: "bootstrap the pinned CI driver",
          id: "driver",
          "working-directory": "ci",
          run: "sh ../.github/scripts/cosmic-driver.sh",
        },

        # TODO: this compiles vendor/ and core/ cold each night; restoring
        # ci.yml's zig build cache for the linux-x86_64 leg would save it.
        {
          name: "build and boot the checked core",
          run: "XDG_CACHE_HOME=\"$RUNNER_TEMP/cache\" bin/zig build sanitized",
        },

        {
          name: "fuzz every property on the checked core",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl fuzz",
        },

        {
          name: "say how far a cancelled run got",
          # The checkout, and the driver it bootstraps, may not have
          # happened.
          if: "cancelled() && steps.driver.outcome == 'success'",
          "working-directory": "ci",
          run: "cosmic-driver cosmic_ci/driver.tl fuzz-cancelled",
        },

        {
          name: "keep the failing inputs",
          if: "failure() || cancelled()",
          uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f", # v7
          with: {
            name: "fuzz-inputs-${{ env.FUZZ_SEED }}",
            path: "${{ runner.temp }}/fuzz/*/real/*.input",
            "if-no-files-found": "ignore",
          },
        },
      ],
    },
  },
}
