name: fuzz

# The only run that fuzzes: CI's, which gate a merge, set FUZZ_ITERS=0
# and check only each property's corpus (ci/cosmic_ci/orchestration.tl).
# This one draws a seed of its own each night, from the run's id, and
# fuzzes on the checked core, so the properties keep meeting inputs no
# run has checked. A failure names its seed; `FUZZ_SEED=<seed>
# FUZZ_ITERS=<iteration>` reproduces it anywhere, the failing inputs are
# kept as an artifact to add to testdata/fuzz/ once fixed
# (build/fuzz/init.tl), and a scheduled run's failure opens an issue, or
# comments on the one still open, so it is seen.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: FUZZ_SEED (the run's id when empty)
        required: false
      iters:
        description: FUZZ_ITERS
        required: false
        default: '2000'
      report:
        description: open or comment on the issue if this run fails, as a scheduled run does
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fuzz:
    if: github.repository == 'cosmic-lua/cosmic'
    runs-on: ubuntu-24.04
    # As ci.yml's linux-x86_64 leg: its image, and an unprivileged
    # `runner` user owning the checkout, which every step after the
    # hand-over runs as.
    container:
      image: ghcr.io/cosmic-lua/cosmic-ci-ubuntu@sha256:947fe8ea3f96e963d1e922113e55324276db1d6a92908d8c79094f29a23c8d4a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
    permissions:
      contents: read
      packages: read
    timeout-minutes: 60
    outputs:
      failures: ${{ steps.fuzz.outputs.failures }}
    defaults:
      run:
        shell: setpriv --reuid=runner --regid=runner --init-groups sh -e {0}
    env:
      FUZZ_SEED: ${{ inputs.seed || github.run_id }}
      # TODO: 10000 once a test's report no longer outgrows the runner's
      # capture limit (the TODO on build/test_worker.tl's encode_reads):
      # archive extraction's does past about 5000.
      FUZZ_ITERS: ${{ inputs.iters || '2000' }}
    steps:
      - name: create the unprivileged builder
        working-directory: /
        shell: sh
        run: useradd -m -o -u "$(stat -c %u "$GITHUB_WORKSPACE")" runner

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: cache the pinned CI driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cache/cosmic/bootstrap
          key: cosmic-bootstrap-${{ hashFiles('ci/cosmic-driver.pin') }}

      - name: cache the pinned zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cache/cosmic/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/zig.pin') }}

      - name: hand the checkout and restored caches over to the unprivileged builder
        working-directory: /
        shell: sh
        run: chown -R runner "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      # TODO: this compiles vendor/ and core/ cold each night; restoring
      # ci.yml's zig build cache for the linux-x86_64 leg would save it.
      - name: build and boot the checked core
        run: XDG_CACHE_HOME="$RUNNER_TEMP/cache" bin/zig build sanitized

      - name: fuzz every property on the checked core
        id: fuzz
        run: |
          {
            echo "FUZZ_SEED=$FUZZ_SEED FUZZ_ITERS=$FUZZ_ITERS"
            echo
            echo "A failure's report names the iteration; FUZZ_SEED=$FUZZ_SEED FUZZ_ITERS=<iteration> reproduces it."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/fuzz"
          # A failing test's directory is left under TMPDIR, holding the
          # shrunk input it kept (build/test.tl's sweep).
          status=0
          TMPDIR="$RUNNER_TEMP/fuzz" COSMIC_AUTO_BOOT=0 COSMIC_TEST_TIMEOUT=1200 \
            o/sanitized/bin/cosmic test $(find . \( -path ./o -o -path ./vendor -o -path ./ci \) -prune \
              -o -name '*_fuzz_test.tl' -print | sort) > "$RUNNER_TEMP/fuzz.out" 2>&1 || status=$?
          cat "$RUNNER_TEMP/fuzz.out"
          # What failed, for the report job's issue: every failing test's
          # line first, then the reports beneath them, bounded.
          delimiter="failures-$(od -An -tx8 -N8 /dev/urandom | tr -d ' ')"
          {
            echo "failures<<$delimiter"
            grep '^test: FAIL' "$RUNNER_TEMP/fuzz.out" | cut -c1-300 | head -30 || true
            echo
            grep -v -e '^build:' -e '^test: ' "$RUNNER_TEMP/fuzz.out" | cut -c1-300 | head -60 || true
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: keep the failing inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: fuzz-inputs-${{ env.FUZZ_SEED }}
          path: ${{ runner.temp }}/fuzz/*/real/*.input
          if-no-files-found: ignore

  # A scheduled run's failure notifies only whoever last edited the
  # schedule, so it opens an issue instead -- or comments on the one still
  # open, so a failure that persists night after night is one thread. A
  # run cancelled at its time limit reports too: a hang is a finding. On
  # a hosted runner, whose `gh` the container image lacks.
  report:
    needs: fuzz
    if: >-
      (failure() || cancelled()) &&
      needs.fuzz.result != 'success' && needs.fuzz.result != 'skipped' &&
      (github.event_name == 'schedule' || inputs.report)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or comment on the nightly fuzz issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILURES: ${{ needs.fuzz.outputs.failures }}
          RESULT: ${{ needs.fuzz.result }}
          SEED: ${{ inputs.seed || github.run_id }}
          ITERS: ${{ inputs.iters || '2000' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          title='fuzz: the nightly run failed'
          body=$(mktemp)
          {
            echo "The nightly fuzz run ended $RESULT: $RUN_URL"
            echo
            echo "\`FUZZ_SEED=$SEED FUZZ_ITERS=$ITERS\`"
            echo
            if [ -n "$FAILURES" ]; then
              echo '~~~~'
              printf '%s\n' "$FAILURES"
              echo '~~~~'
            elif [ "$RESULT" = cancelled ]; then
              echo 'No test output: the run was cancelled, at its time limit or by hand, before' \
                'fuzzing finished; a property that hangs is the likeliest cause. See the run.'
            else
              echo 'No test output: the run failed before fuzzing finished (the build, say); see the run.'
            fi
            echo
            echo "Reproduce with \`FUZZ_SEED=$SEED FUZZ_ITERS=<iteration> o/bin/cosmic test <file>\`;" \
              "the shrunk inputs are the run's \`fuzz-inputs-$SEED\` artifact. Once fixed, keep each" \
              "in \`testdata/fuzz/<property>/\` as its report says, and close this issue."
          } > "$body"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi
