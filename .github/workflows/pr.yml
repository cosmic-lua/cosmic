name: pr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: make ci
        shell: bash -x {0}
        run: bin/make -j ci

      - name: dump failing test output
        if: failure()
        shell: bash
        run: |
          set +e
          for got in $(find o -name '*.test.got' 2>/dev/null); do
            code=$(cat "$got" 2>/dev/null || echo "?")
            if [ "$code" != "0" ]; then
              base=${got%.got}
              echo "===== $got (exit $code) ====="
              echo "--- stdout ($base.out) ---"
              cat "$base.out" 2>/dev/null || true
              echo "--- stderr ($base.err) ---"
              cat "$base.err" 2>/dev/null || true
              echo
            fi
          done

  # No-network gate (#730). By design only three things touch the
  # network — the landlock-make download, the bootstrap download, and
  # the fetch rule — each integrity-checked against a committed sha256,
  # so the pins are the trust root and TLS is transport. This job makes
  # the property falsifiable: fetch with network allowed, then run the
  # ENTIRE gate inside a network namespace whose only interface is
  # loopback (brought up for the localhost socket tests). A stray
  # download anywhere in a recipe, build script, or test fails loudly
  # instead of working silently. The runner restricts unprivileged user
  # namespaces (unshare --map-root-user dies writing uid_map), so the
  # netns comes from real root via passwordless sudo: bring lo up as
  # root — with the pinned bootstrap's own quicksand.netns, not host
  # iproute2 (#732) — then drop back to the runner user so the build
  # runs with the same identity as the main ci job.
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # fetch AND stage online: staging is a local, deterministic
      # function of the sha-pinned archives (the netns red-test proves a
      # missing archive still fails loudly offline), and pre-staging
      # keeps the offline phase's scheduling profile close to the build
      # job's — a step-2 burst that raced staging against the leftover
      # compiles produced a scheduling-sensitive module-resolution
      # failure in publish_test that no grant explains (see the
      # diagnostic step below).
      - name: fetch and stage with network allowed
        shell: bash -x {0}
        run: bin/make -j staged

      - name: make ci with network denied
        shell: bash -x {0}
        run: |
          sudo unshare --net sh -c '
            o/bootstrap/cosmic -e "assert(require(\"cosmic.quicksand.netns\").bring_up(\"lo\"))" \
              && exec sudo -u runner bin/make -j ci'

      # Temporary diagnostic (#729 family 2): the publish_test compile
      # fails module resolution only in this lane and only under the ci
      # sub-make — a solo rerun of the same target in the same netns
      # passed with a complete unveil set. Reproduce IN the failing
      # context (full ci goal, sub-make) with -d and capture that
      # target's actual unveil dump plus the error.
      - name: debug failed compile under sandbox
        if: failure()
        shell: bash
        run: |
          rm -f o/lib/docs/publish_test.lua o/ci-ok-* o/*-summary.txt
          sudo unshare --net sh -c '
            o/bootstrap/cosmic -e "assert(require(\"cosmic.quicksand.netns\").bring_up(\"lo\"))" \
              && exec sudo -u runner bin/make -j -d ci' 2>&1 \
            | grep -aE "publish|module not found" -A 45 \
            | grep -aiE "unveil|pledging|sandboxing|publish|error|denied|Executing" | head -150

  # Reproducibility gate (#733): build the binary twice from the same
  # tree — the second time into a fresh output tree so the whole
  # pipeline (compile, doc index, version stamp, pack) reruns — and
  # cmp. Green proves the artifact is a pure function of the source
  # tree; any future nondeterminism (timestamps, ordering, embedded
  # strings) fails loudly instead of shipping. Same checkout, so the
  # deliberate git-describe input stays constant.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: build twice and compare
        shell: bash -x {0}
        run: |
          bin/make -j build
          cp o/bin/cosmic cosmic-first
          bin/make -j o=o2 build
          cmp cosmic-first o2/bin/cosmic
          echo "reproducible: PASS — double build is byte-identical"

  # Cross-OS smoke lane (#510 step 11). The full gate is Linux-only
  # (landlock-make), but the artifact is a fat APE binary shipped for six
  # OSes — of which releases previously exercised zero beyond Linux. Build
  # once on Linux, then prove on real macOS and Windows runners that the
  # binary starts, serves embedded docs, and passes the portable test
  # files (string, json, fs paths — including the Windows-path suite).
  smoke-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: build cosmic
        shell: bash -x {0}
        run: bin/make -j build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cosmic-smoke
          path: o/bin/cosmic

  smoke:
    needs: smoke-build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cosmic-smoke
          path: dl/

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact >= v7 delivers a zip that download-artifact >= v8
          # does not extract (same trap release.yml documents); unzip via
          # python's zipfile so the step works in git-bash too, and handle
          # the delivered-directly layout as well.
          PY=$(command -v python3 || command -v python)
          for z in $(find dl -type f -name '*.zip'); do
            "$PY" -m zipfile -e "$z" dl/
          done
          src=$(find dl -type f -name cosmic | head -1)
          if [ -z "$src" ]; then
            echo "cosmic binary not found in downloaded artifact:" >&2
            find dl >&2
            exit 1
          fi
          # The .exe suffix is required for Windows to execute the APE
          # (a valid PE); it is inert elsewhere.
          cp "$src" cosmic.exe
          chmod +x cosmic.exe

          tmp="$RUNNER_TEMP/cosmic-smoke"
          mkdir -p "$tmp"
          # cosmic is a native binary: hand it a native (mixed-form)
          # Windows path, not git-bash's /d/... POSIX rendering.
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -m "$tmp"); fi
          export TEST_TMPDIR="$tmp"

          echo "::group::cosmic -e"
          out=$(./cosmic.exe -e 'print("smoke-" .. require("cosmic.sys").host_os())')
          echo "$out"
          case "$out" in *smoke-*) ;; *) echo "unexpected -e output" >&2; exit 1 ;; esac
          echo "::endgroup::"

          echo "::group::cosmic --docs"
          ./cosmic.exe --docs guide.platforms > docs-smoke.txt
          grep -q "Platform Support" docs-smoke.txt
          ./cosmic.exe --docs fs.read > docs-fs.txt
          grep -qi "read" docs-fs.txt
          echo "::endgroup::"

          for t in \
            lib/cosmic/string_test.tl \
            lib/cosmic/json_test.tl \
            lib/cosmic/fs/path_test.tl \
            lib/cosmic/fs/path_normalize_test.tl \
            lib/cosmic/fs/path_windows_test.tl; do
            echo "::group::$t"
            ./cosmic.exe "$t"
            echo "::endgroup::"
          done
          echo "smoke: PASS"

  # Privileged, unsandboxed lane that actually exercises the sandbox
  # primitives (audit §5.1). `make ci` runs under landlock-make, where the
  # sandbox tests skip their enforcement assertions; this lane runs them with
  # no outer sandbox and COSMIC_ENFORCE=1 so a silent skip becomes a failure,
  # and a tripwire fails the lane if nothing enforced at all.
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: make enforce
        shell: bash -x {0}
        run: bin/make -j enforce

      # Build-sandbox canary (#716): proves landlock-make's .SANDBOXED
      # enforcement mechanism blocks an out-of-grant write on a
      # Landlock-capable host. Runs here (not in `make ci`) because it
      # needs the real kernel facility this runner provides.
      - name: make sandbox-canary
        shell: bash -x {0}
        run: bin/make sandbox-canary

      - name: dump enforcement output
        if: always()
        shell: bash
        run: |
          set +e
          for f in $(find o/enforce -name '*.out' -o -name '*.err' 2>/dev/null); do
            echo "===== $f ====="
            cat "$f" 2>/dev/null || true
            echo
          done
