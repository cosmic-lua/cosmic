name: pr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR run answers a question nobody is asking any more.
# Pushes to main are never cancelled AND never queued behind each other:
# the group is keyed by the commit SHA on a push, so every commit on main
# gets its own group and runs concurrently with the others, each getting
# its own verdict as the record. PR runs still share a group per ref and
# supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate, run with no network.
  #
  # Three things may touch the network: the bootstrap download, the
  # cosmos.zip download behind it, and the fetch rule — each verified
  # against a committed sha256, so the pins are the trust root and TLS is
  # only transport. This lane makes that falsifiable: fetch with the
  # network allowed, then run the ENTIRE gate inside a network namespace
  # whose only interface is loopback (up for the localhost socket tests).
  # A download anywhere else — a recipe, a build script, a test — fails
  # loudly instead of working silently.
  #
  # There is no network-allowed copy of this lane. It would run the same
  # `cosmic --make ci` over the same tree and differ only in what it is
  # permitted to do, so a green fenced run implies a green unfenced one.
  #
  # The container is pinned by DIGEST because an OS image is a build
  # input: `ubuntu-latest` rolls monthly, and the coverage floors encode
  # the environment they were measured in. Bump it deliberately, like any
  # pin: change the digest, re-check the floors, commit.
  #
  # buildpack-deps:noble ships git, curl, ca-certificates and coreutils,
  # and archive extraction is in-process, so the gate needs no apt-get
  # and nothing re-introduces an unpinned package fetch. The digest is
  # the multi-arch index; GitHub pulls the linux/amd64 child.
  #
  # Two knobs keep parity with a bare runner:
  #   - `--privileged`, so the container's capability profile matches the
  #     host. `_cli/fence_test.tl` asserts a real Landlock DENIAL, and
  #     the quicksand tests call unshare(CLONE_NEWUSER|NEWNET) + mount;
  #     Docker's default seccomp and AppArmor profiles would strip both,
  #     turning those assertions into no-ops and dropping coverage below
  #     the committed floor. An assertion that cannot bite is one nobody
  #     has checked.
  #   - a non-root builder (below), because the gate is
  #     identity-sensitive: fs/walk_test skips its EACCES path under
  #     geteuid()==0, which moves coverage.
  #
  # Both Linux lanes repeat this container block — GitHub Actions has no
  # anchor for it — and `_build/workflows_test.tl` ratchets every copy
  # identical, so a bump that misses one fails here rather than leaving
  # lanes on different environments.
  #
  # This lane restores `o/` from the nearest previous run's cache, before
  # the gate runs. That is only sound because D18 made the expensive
  # recipe steps content-keyed rather than mtime-keyed: a restored `o/`
  # sits under a fresh checkout, every source's mtime is new, and D18's
  # `<out>.in` records re-verify against the cached bytes instead of
  # trusting them, so matching work is skipped in milliseconds and
  # changed work re-runs as if the cache were empty. See the cache step
  # below for the trust boundary.
  ci:
    runs-on: ubuntu-latest
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Restore `o/` before the chown below, so the non-root builder owns
      # whatever the cache handed back along with the checkout.
      #
      # The key is DELIBERATELY never a hit: `github.sha` is unique per
      # run, so `key` always misses and this run always SAVES its own
      # `o/` at job end under a key the next run can restore. The
      # `restore-keys` prefix then finds the nearest earlier save on this
      # branch (or falls back along GitHub's cache scoping to the base
      # branch's chain), so the chain of runs keeps handing `o/` forward
      # rather than any one run reaching back to a specific ancestor.
      #
      # Trust: a cache entry stands for a PRIOR RUN'S OWN outputs.
      # GitHub scopes cache writes to the branch that made them and a PR
      # run can only read caches from its own branch and its base
      # branch's chain, so restoring one is restoring your own history,
      # not a stranger's. And even that trust is bounded, not assumed:
      # D18's content key re-hashes every declared input's bytes against
      # what `<out>.in` recorded, so a stale, evicted, or hand-corrupted
      # cache entry degrades to an ordinary cold build of whatever
      # doesn't match — never to a wrong result silently accepted.
      #
      # The WORKSPACE PATH is part of the key because one artifact class
      # is path-sensitive: `.cov` hit data records absolute chunk paths,
      # so a cache restored at a different workspace would make every
      # SKIPPED test's coverage read as 0% and fail the ratchet red —
      # loud, but wrong-red. Keying on the path means a moved workspace
      # (a runner image change) starts cold and green instead.
      - name: restore o/ from the previous run
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            o
            !o/gate.log
            !o/perf
          key: o-${{ runner.os }}-${{ github.workspace }}-${{ github.sha }}
          restore-keys: |
            o-${{ runner.os }}-${{ github.workspace }}-

      # The gate runs as a non-root user: see the identity note above.
      # The system-wide safe.directory keeps git usable for that user,
      # since lint discovers files with `git ls-files`. (The version
      # stamp does NOT read git — it comes from a root `.version` file
      # or COSMIC_VERSION; see cmd/cosmic/embed_gen.tl.)
      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # Pins resolve here, where there is a network. Everything after
      # this step — compiles, checks, tests, summaries — runs denied.
      - name: fetch with network allowed
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" bin/cosmic --make fetch

      # The namespace needs root to create, and so does bringing `lo` up
      # inside it — the pinned bootstrap does that itself rather than
      # asking the host for iproute2. Only then does the gate drop to the
      # builder, which is the identity every other lane runs as.
      #
      # timeout: a recipe child dying mid-test can leave forked test
      # parents blocked on accept/wait, wedging make. Convert a hang into
      # a failure so the dump step below fires.
      # One command, because the gate converges on its own: `--make ci`
      # in a project that builds its own toolchain builds first and
      # re-execs into what it built, until the artifact stops changing
      # (_make/converge.tl). Building here rather than in the build lane
      # keeps it fenced.
      - name: the gate, with network denied
        timeout-minutes: 20
        shell: bash
        env:
          NETNS: |
            assert(require("cosmic.quicksand.netns").bring_up("lo"))
        run: |
          # Captured, so a failure can be READ. The gate's verdict line
          # and the coverage ratchet's row list are the last things it
          # prints, and they end up hundreds of lines back once the
          # failure steps and the runner's own cleanup follow them —
          # which cost several CI cycles here, each one a full re-run to
          # ask a question the first run had already answered.
          # pipefail, or tee's clean exit would hide the gate's.
          set -euxo pipefail
          unshare --net -- bash -euxo pipefail -c '
            o/bootstrap/cosmic -e "$NETNS"
            runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
              bin/cosmic --make ci 2>&1 | tee o/gate.log'

      - name: dump failing test output
        if: failure()
        shell: bash
        run: |
          set +e
          for got in $(find o -name '*.test.got' 2>/dev/null); do
            code=$(cat "$got" 2>/dev/null || echo "?")
            if [ "$code" != "0" ]; then
              base=${got%.got}
              echo "===== $got (exit $code) ====="
              echo "--- stdout ($base.out) ---"
              cat "$base.out" 2>/dev/null || true
              echo "--- stderr ($base.err) ---"
              cat "$base.err" 2>/dev/null || true
              echo
            fi
          done

      # LAST, so the gate's own ending is the log's own ending: the
      # stage verdicts, and — when coverage is what failed — the one
      # line naming every row that moved. Re-running the gate to ask
      # again was the previous attempt at this; it answered a question
      # about a second run rather than about the one that failed.
      - name: the gate's own tail
        if: failure()
        shell: bash
        run: |
          set +e
          echo "===== last 20 lines of the gate ====="
          tail -20 o/gate.log
          # Which LINES ran, for every row the ratchet named. A percentage
          # says a file got worse; the missing-line list says which branch
          # stopped running, which is the difference between reading the
          # diff and guessing at it across CI cycles.
          echo "===== coverage detail for the declining rows ====="
          # Source dirs too, not just the data dir: the report only lists
          # a ZERO-hit file when it can scan the directory holding it, so
          # without them the diagnostic goes silent for exactly the file
          # that lost all its coverage. The gate already wrote the list it
          # used to o/project.mk (coverage_dirs); reuse it verbatim.
          dirs=$(sed -n 's/^coverage_dirs := //p' o/project.mk)
          for f in $(grep -oP '(?<=coverage ratchet: declined: ).*' o/gate.log | tail -1); do
            runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
              o/bin/cosmic --coverage-report o/.coverage $dirs 2>/dev/null \
              | grep -F "$f "
          done
          exit 0

  # The first build, and what only it can prove: the fixpoint. The
  # gate lane deliberately lacks a network after fetch; this lane has
  # one, builds the artifact every other job consumes, and asserts the
  # two properties that need exactly one tree: convergence, and that
  # the host can enforce the fence at all. Reproducibility moved to its
  # own job (`repro`, below), which doubles as the real-pins fetch
  # check -- a fresh job IS a cold tree, so nothing has to be cleaned
  # to prove a cold build works. Splitting also unblocks `smoke` ~2min
  # earlier: it needs only this job's artifact, not the repro rebuild.
  build:
    runs-on: ubuntu-latest
    # Pinned container, identical to the gate lane's; see there.
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: build, and the fixpoint
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" bash -ec '
            # `fetch` is the only verb with a network, so it is also the
            # only one that provisions: `build` will not reach for a pin
            # it is missing, it refuses.
            bin/cosmic --make fetch
            bin/cosmic --make build
            # THE FIXPOINT. `--make build` in a project that builds its
            # own toolchain converges by itself -- it re-execs into the
            # binary it just built when the bytes moved -- so the
            # explicit second build on the next line must change
            # nothing. Asserting it costs a copy and a compare over
            # bytes this lane already produces.
            #
            # What it pins: one build is enough. It does NOT prove
            # generation 1 was right before converging (a cold pin
            # reaches the same bytes either way, which is why the
            # obvious hash-gen1-hash-gen2 experiment reports IDENTICAL
            # even on a tree where generators ran stale -- see
            # docs/design/make/resolution.md). It fires if convergence
            # regresses, or if any step stops being idempotent.
            cp o/bin/cosmic cosmic-converged
            o/bin/cosmic --make build
            cmp cosmic-converged o/bin/cosmic
            echo "fixpoint: PASS -- a second build changes nothing"'

      # The fence is ON by default, so every recipe above already ran
      # under it -- and so will every build in the `repro` job. What no
      # fenced build can prove on its own is that the kernel was
      # actually holding a policy: without Landlock, `unveil()` returns
      # success having done nothing, and "the build passed fenced"
      # becomes vacuously true. So the one assertion that remains here
      # is that the host CAN enforce. The full clean-and-rebuild this
      # step used to run re-proved what the builds above had already
      # proven under the same default-on fence, and retired with the
      # measurement that it was the workflow's critical path.
      - name: the fence is live
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            o/bin/cosmic -e 'local s = require("cosmic.sandbox")
              assert(s.available().fs, "this host cannot enforce; the fenced builds above proved nothing")'

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cosmic-smoke
          path: o/bin/cosmic

  # The artifact is a pure function of the source tree. This job is a
  # FRESH checkout in a FRESH container -- a cold tree by construction,
  # so the cold-build claim needs no `clean` to set up -- and it builds
  # at a different absolute path than the `build` job's artifact
  # ($HOME/repro), because an absolute path leaking into the artifact
  # only shows up when the root moves. Byte-compare against the
  # artifact `build` uploaded: any nondeterminism -- a timestamp, an
  # iteration order, an embedded path -- fails here instead of
  # shipping.
  #
  # Its fetch doubles as the real-pins check. Pin RESOLUTION is checked
  # offline on every commit by _make/pins_test.tl; what only a network
  # can answer is whether the resolved urls, digests and unpack
  # products are right, so this cold fetch names the three products the
  # build depends on: the Teal compiler, the make engine, and the
  # runtime a binary is built onto. A pin that resolved and unpacked to
  # something else would otherwise surface as a build failure whose
  # cause is two layers away.
  repro:
    needs: build
    runs-on: ubuntu-latest
    # Pinned container, identical to the gate lane's; see there.
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cosmic-smoke
          path: dl/

      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: rebuild cold at another path, and compare
        shell: bash
        run: |
          # pipefail, because the idempotence fetch below ends in a
          # `tee` and a pipeline's status is its LAST command's. Without
          # it a re-fetch that failed outright reported tee's clean
          # exit, and the grep that follows would find no `fetch https`
          # in the error output and call that idempotence.
          set -euxo pipefail
          # The artifact arrives as upload-artifact packed it; unpack
          # the same way smoke does, handling both delivered layouts.
          for z in $(find dl -type f -name '*.zip'); do
            python3 -m zipfile -e "$z" dl/
          done
          first=$(find dl -type f -name cosmic | head -1)
          test -n "$first"
          cp "$first" /cosmic-first
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" bash -ec '
            # pipefail HERE too: the tee pipeline below runs in THIS
            # shell, and the outer set cannot reach it.
            set -o pipefail
            cp -a . "$HOME/repro"
            cd "$HOME/repro"
            bin/cosmic --make fetch
            test -f o/3p/tl/tl.lua
            test -x o/3p/cosmos/make
            test -x o/3p/cosmos/lua
            bin/cosmic --make build
            o/bin/cosmic --make build
            cmp /cosmic-first o/bin/cosmic
            echo "reproducible: PASS -- double build is byte-identical"
            # And again, to prove a satisfied pin re-fetches nothing:
            # the manifest that decides records one unpack product per
            # line, so a product whose name contains a newline would
            # send every later build into a repair loop.
            o/bin/cosmic --make fetch 2>&1 | tee second.log
            if grep -q "^fetch https" second.log; then
              echo "a satisfied pin fetched again" >&2
              exit 1
            fi'

  # The artifact is a fat APE shipped for six operating systems, and the
  # gate is Linux-only. This runs the built binary on real macOS and
  # Windows runners: it starts, answers from its embedded docs, and
  # passes the portable part of the test suite — named as a selection,
  # which is what `--make test` takes.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cosmic-smoke
          path: dl/

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact delivers a zip that download-artifact does not
          # extract. Unzip through python's zipfile so the step works in
          # git-bash too, and handle the delivered-directly layout.
          PY=$(command -v python3 || command -v python)
          for z in $(find dl -type f -name '*.zip'); do
            "$PY" -m zipfile -e "$z" dl/
          done
          src=$(find dl -type f -name cosmic | head -1)
          if [ -z "$src" ]; then
            echo "cosmic binary not found in downloaded artifact:" >&2
            find dl >&2
            exit 1
          fi
          # Windows executes an APE only with the .exe suffix (it is a
          # valid PE); the suffix is inert everywhere else.
          cp "$src" cosmic.exe
          chmod +x cosmic.exe

          tmp="$RUNNER_TEMP/cosmic-smoke"
          mkdir -p "$tmp"
          # cosmic is a native binary: hand it a native (mixed-form)
          # Windows path, not git-bash's /d/... rendering.
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -m "$tmp"); fi
          export TEST_TMPDIR="$tmp"

          echo "::group::cosmic -e"
          out=$(./cosmic.exe -e 'print("smoke-" .. require("cosmic.sys").host_os())')
          echo "$out"
          case "$out" in *smoke-*) ;; *) echo "unexpected -e output" >&2; exit 1 ;; esac
          echo "::endgroup::"

          echo "::group::cosmic --docs"
          ./cosmic.exe --docs guide.platforms > docs-smoke.txt
          grep -q "Platform Support" docs-smoke.txt
          ./cosmic.exe --docs fs.read > docs-fs.txt
          grep -qi "read" docs-fs.txt
          echo "::endgroup::"

          # A selection of tests, run by the binary itself. These are the
          # ones whose subject is portability — string handling, JSON, and
          # every path rule including the Windows-specific suite — so a
          # platform difference shows up as a named test rather than as a
          # mystery in a downstream project.
          echo "::group::portable tests"
          for t in \
            cosmic/string_test.tl \
            cosmic/json_test.tl \
            cosmic/fs/path_test.tl \
            cosmic/fs/path_normalize_test.tl \
            cosmic/fs/path_windows_test.tl; do
            echo "--- $t"
            ./cosmic.exe "$t"
          done
          echo "::endgroup::"
          echo "smoke: PASS"
