name: pr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR run answers a question nobody is asking any more.
# Pushes to main are never cancelled: each commit on main gets its own
# verdict, and that verdict is the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate, run with no network.
  #
  # Three things may touch the network: the bootstrap download, the
  # cosmos.zip download behind it, and the fetch rule — each verified
  # against a committed sha256, so the pins are the trust root and TLS is
  # only transport. This lane makes that falsifiable: fetch with the
  # network allowed, then run the ENTIRE gate inside a network namespace
  # whose only interface is loopback (up for the localhost socket tests).
  # A download anywhere else — a recipe, a build script, a test — fails
  # loudly instead of working silently.
  #
  # There is no network-allowed copy of this lane. It would run the same
  # `cosmic --make ci` over the same tree and differ only in what it is
  # permitted to do, so a green fenced run implies a green unfenced one.
  #
  # The container is pinned by DIGEST because an OS image is a build
  # input: `ubuntu-latest` rolls monthly, and the coverage floors encode
  # the environment they were measured in. Bump it deliberately, like any
  # pin: change the digest, re-check the floors, commit.
  #
  # buildpack-deps:noble ships git, curl, ca-certificates and coreutils,
  # and archive extraction is in-process, so the gate needs no apt-get
  # and nothing re-introduces an unpinned package fetch. The digest is
  # the multi-arch index; GitHub pulls the linux/amd64 child.
  #
  # Two knobs keep parity with a bare runner:
  #   - `--privileged`, so the container's capability profile matches the
  #     host. `_cli/fence_test.tl` asserts a real Landlock DENIAL, and
  #     the quicksand tests call unshare(CLONE_NEWUSER|NEWNET) + mount;
  #     Docker's default seccomp and AppArmor profiles would strip both,
  #     turning those assertions into no-ops and dropping coverage below
  #     the committed floor. An assertion that cannot bite is one nobody
  #     has checked.
  #   - a non-root builder (below), because the gate is
  #     identity-sensitive: fs/walk_test skips its EACCES path under
  #     geteuid()==0, which moves coverage.
  #
  # Both Linux lanes repeat this container block — GitHub Actions has no
  # anchor for it — and `_build/workflows_test.tl` ratchets every copy
  # identical, so a bump that misses one fails here rather than leaving
  # lanes on different environments.
  ci:
    runs-on: ubuntu-latest
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The gate runs as a non-root user: see the identity note above.
      # The system-wide safe.directory keeps git usable for that user,
      # since lint discovers files with `git ls-files` and the version
      # stamp reads `git describe`.
      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # Pins resolve here, where there is a network. Everything after
      # this step — compiles, checks, tests, summaries — runs denied.
      - name: fetch with network allowed
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" bin/cosmic --make fetch

      # The namespace needs root to create, and so does bringing `lo` up
      # inside it — the pinned bootstrap does that itself rather than
      # asking the host for iproute2. Only then does the gate drop to the
      # builder, which is the identity every other lane runs as.
      #
      # timeout: a recipe child dying mid-test can leave forked test
      # parents blocked on accept/wait, wedging make. Convert a hang into
      # a failure so the dump step below fires.
      # One command, because the gate converges on its own: `--make ci`
      # in a project that builds its own toolchain builds first and
      # re-execs into what it built, until the artifact stops changing
      # (_make/converge.tl). Building here rather than in the build lane
      # keeps it fenced.
      - name: the gate, with network denied
        timeout-minutes: 20
        shell: bash
        env:
          NETNS: |
            assert(require("cosmic.quicksand.netns").bring_up("lo"))
        run: |
          set -eux
          unshare --net -- bash -euxc '
            o/bootstrap/cosmic -e "$NETNS"
            exec runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
              bin/cosmic --make ci'

      # A coverage failure names every row that moved, and those lines
      # scroll off the top of a 166-test run. Re-asking is nearly free —
      # the `.got` files are up to date, so make re-runs the summary
      # rule and nothing else — and it puts the answer at the END of the
      # log, where a failure is actually read from.
      - name: which coverage rows moved
        if: failure()
        shell: bash
        run: |
          set +e
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            o/bin/cosmic --make coverage 2>&1 | grep -E 'coverage ratchet|declined' | tail -40
          exit 0

      - name: dump failing test output
        if: failure()
        shell: bash
        run: |
          set +e
          for got in $(find o -name '*.test.got' 2>/dev/null); do
            code=$(cat "$got" 2>/dev/null || echo "?")
            if [ "$code" != "0" ]; then
              base=${got%.got}
              echo "===== $got (exit $code) ====="
              echo "--- stdout ($base.out) ---"
              cat "$base.out" 2>/dev/null || true
              echo "--- stderr ($base.err) ---"
              cat "$base.err" 2>/dev/null || true
              echo
            fi
          done

  # What needs a built binary and a real network — the two things the
  # gate lane deliberately lacks. Both steps start from the same build,
  # so they share one container rather than one each.
  build:
    runs-on: ubuntu-latest
    # Pinned container, identical to the gate lane's; see there.
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # The artifact is a pure function of the source tree: build twice,
      # the second time into a different output tree so the whole
      # pipeline reruns, and compare. Any nondeterminism — a timestamp,
      # an iteration order, an embedded path — fails here instead of
      # shipping.
      - name: build twice and compare
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" bash -ec '
            # `fetch` is the only verb with a network, so it is also the
            # only one that provisions: `build` will not reach for a pin
            # it is missing, it refuses.
            bin/cosmic --make fetch
            bin/cosmic --make build
            o/bin/cosmic --make build
            cp o/bin/cosmic cosmic-first
            # A different tree PATH, not just a different output dir: an
            # absolute path leaking into the artifact only shows up when
            # the root moves. clean removes o/, pins included, so the
            # copy fetches again.
            cp -a . "$HOME/repro"
            cd "$HOME/repro"
            bin/cosmic --make clean
            bin/cosmic --make fetch
            bin/cosmic --make build
            o/bin/cosmic --make build
            cmp "$OLDPWD/cosmic-first" o/bin/cosmic
            echo "reproducible: PASS — double build is byte-identical"'

      # The fence is ON by default, so every recipe above already ran
      # under it. This asserts the direction the denial tests cannot:
      # that a REAL build still succeeds when the kernel is holding the
      # policy. A fence that denies everything is not enforcement, and a
      # denial test alone cannot tell the two apart -- which is how a
      # floor that failed to construct (`/zip/.types`, a path inside the
      # executable, handed to Landlock) went unnoticed.
      #
      # It also proves the fence is LIVE here rather than a silent
      # no-op: without Landlock `unveil()` returns success having done
      # nothing, so the check that matters is that the host can enforce
      # at all.
      - name: the fence is live, and a real build passes under it
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            o/bin/cosmic -e 'local s = require("cosmic.sandbox")
              assert(s.available().fs, "this host cannot enforce; the lane proves nothing")'
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            o/bin/cosmic --make clean
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            bin/cosmic --make fetch
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            bin/cosmic --make build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cosmic-smoke
          path: o/bin/cosmic

      # Pin RESOLUTION is checked offline on every commit by
      # _make/pins_test.tl. What only a network can answer is whether the
      # resolved urls, digests and unpack products are right, so this
      # fetches the real pins and names the three products the build
      # depends on: the Teal compiler, the make engine, and the runtime a
      # binary is built onto. A pin that resolved and unpacked to
      # something else would otherwise surface as a build failure whose
      # cause is two layers away.
      #
      # Then again, to prove a satisfied pin re-fetches nothing: the
      # manifest that decides records one unpack product per line, so a
      # product whose name contains a newline would send every later
      # build into a repair loop.
      - name: make fetch against the real pins
        shell: bash
        run: |
          # pipefail, because the second fetch below ends in a `tee` and
          # a pipeline's status is its LAST command's. Without it a
          # re-fetch that failed outright reported tee's clean exit, and
          # the grep that follows would find no `fetch https` in the
          # error output and call that idempotence.
          set -euxo pipefail
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            o/bin/cosmic --make fetch
          test -f o/3p/tl/tl.lua
          test -x o/3p/cosmos/make
          test -x o/3p/cosmos/lua
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            o/bin/cosmic --make fetch 2>&1 | tee second.log
          if grep -q '^fetch https' second.log; then
            echo "a satisfied pin fetched again" >&2
            exit 1
          fi

  # The artifact is a fat APE shipped for six operating systems, and the
  # gate is Linux-only. This runs the built binary on real macOS and
  # Windows runners: it starts, answers from its embedded docs, and
  # passes the portable part of the test suite — named as a selection,
  # which is what `--make test` takes.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cosmic-smoke
          path: dl/

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact delivers a zip that download-artifact does not
          # extract. Unzip through python's zipfile so the step works in
          # git-bash too, and handle the delivered-directly layout.
          PY=$(command -v python3 || command -v python)
          for z in $(find dl -type f -name '*.zip'); do
            "$PY" -m zipfile -e "$z" dl/
          done
          src=$(find dl -type f -name cosmic | head -1)
          if [ -z "$src" ]; then
            echo "cosmic binary not found in downloaded artifact:" >&2
            find dl >&2
            exit 1
          fi
          # Windows executes an APE only with the .exe suffix (it is a
          # valid PE); the suffix is inert everywhere else.
          cp "$src" cosmic.exe
          chmod +x cosmic.exe

          tmp="$RUNNER_TEMP/cosmic-smoke"
          mkdir -p "$tmp"
          # cosmic is a native binary: hand it a native (mixed-form)
          # Windows path, not git-bash's /d/... rendering.
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -m "$tmp"); fi
          export TEST_TMPDIR="$tmp"

          echo "::group::cosmic -e"
          out=$(./cosmic.exe -e 'print("smoke-" .. require("cosmic.sys").host_os())')
          echo "$out"
          case "$out" in *smoke-*) ;; *) echo "unexpected -e output" >&2; exit 1 ;; esac
          echo "::endgroup::"

          echo "::group::cosmic --docs"
          ./cosmic.exe --docs guide.platforms > docs-smoke.txt
          grep -q "Platform Support" docs-smoke.txt
          ./cosmic.exe --docs fs.read > docs-fs.txt
          grep -qi "read" docs-fs.txt
          echo "::endgroup::"

          # A selection of tests, run by the binary itself. These are the
          # ones whose subject is portability — string handling, JSON, and
          # every path rule including the Windows-specific suite — so a
          # platform difference shows up as a named test rather than as a
          # mystery in a downstream project.
          echo "::group::portable tests"
          for t in \
            cosmic/string_test.tl \
            cosmic/json_test.tl \
            cosmic/fs/path_test.tl \
            cosmic/fs/path_normalize_test.tl \
            cosmic/fs/path_windows_test.tl; do
            echo "--- $t"
            ./cosmic.exe "$t"
          done
          echo "::endgroup::"
          echo "smoke: PASS"
