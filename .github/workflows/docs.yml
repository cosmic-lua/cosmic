name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - shell: bash -x {0}
        run: bin/make -j doc-publish
