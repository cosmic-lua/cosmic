name: release

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: true
      perf_gate:
        description: 'Fail the release on a perf regression'
        required: false
        type: boolean
        default: true

# The build job runs the whole gate — arbitrary tree code and tests —
# with the checkout token persisted in .git/config, so the default token
# must be read-only. The `release` job below elevates itself to
# `contents: write`, the one permission publishing needs.
permissions:
  contents: read

# One release at a time: a schedule fire and a manual dispatch on the
# same commit race to create the same dated tag, and the loser errors
# out of `gh release create`. Queue, and never cancel a release mid-run.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PRERELEASE: true

jobs:
  # The same digest-pinned container as the gate lanes (see pr.yml): the
  # shipped binaries are built by the machinery the gate checks, and
  # reproducibility holds WITHIN an environment, so the environment is
  # part of what a release pins. The `release` job below stays on the
  # bare runner — it runs no build machinery, only artifact download and
  # `gh release create`, and gh is not in the image.
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # The tag is computed HERE, once, and stamped into the binary as
      # COSMIC_VERSION before it is passed to the release job. Computing
      # it in both places lets a run that straddles midnight UTC ship a
      # binary whose `--version` disagrees with the tag it is published
      # under; and leaving it unset ships "unknown", which is what the
      # first `--make`-built release did.
      - name: name the release
        id: tag
        env:
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -eux
          echo "tag=$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Both release binaries come out of one build: the unit declares
      # `base` and `base-debug`, so `build` embeds one payload twice.
      # Two generations, deliberately: the pinned cosmic builds one from
      # this tree, and THAT one builds what ships. A release should be
      # produced by the code it contains, not by whatever the pin happens
      # to be — and a pin older than a build-system change would
      # otherwise ship an artifact built by rules the tree no longer has.
      - name: build the release binaries
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            COSMIC_VERSION="${{ steps.tag.outputs.tag }}" bash -ec '
            bin/cosmic --make fetch
            bin/cosmic --make build
            o/bin/cosmic --make build'

      - name: the binary says what it is
        shell: bash
        run: |
          set -euxo pipefail
          o/bin/cosmic --version | grep -F "${{ steps.tag.outputs.tag }}"

      # The gate, run BY the artifact being released.
      #
      # "The gate already ran over this commit" was the previous answer,
      # and it is true of the commit and not of the release: a push whose
      # gate went red still sits on main, and the next scheduled run
      # publishes it. A daily job that ships without asking is a job that
      # will eventually ship a known-broken tree.
      #
      # Running it here is also a stronger claim than re-running pr.yml
      # would be, and free given the build above: `--make ci` in a
      # project that builds its own toolchain gates under what it built
      # (_make/converge.tl), so this is the exact binary in the release
      # answering for itself.
      - name: the gate, under the binary being released
        timeout-minutes: 30
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            o/bin/cosmic --make ci

      # A failure here fails the release: scenario check() failures mean
      # the binary this run is about to publish is WRONG, not slow. This
      # is the same _perf harness that measures a local dev tree, run
      # twice — once for the record, once so the compare step below has
      # an A/A self-check to separate a real regression from noise.
      - name: measure the release
        timeout-minutes: 15
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" bash -ec '
            o/bin/cosmic --make run _perf/run.tl --out o/perf/perf.json
            o/bin/cosmic --make run _perf/run.tl --out o/perf/selfcheck.json'

      # The baseline is the previous release's BINARY, downloaded and
      # measured here, in the same job and on the same runner as the
      # candidate's own measurement above. It is never the previous
      # run's stored numbers: five consecutive scheduled releases
      # (2026-08-18..22) failed this gate against a stored perf.json
      # while an interleaved A/B of the two binaries on one machine
      # showed 42 of 43 scenarios identical — the same binary's numbers
      # drift -39%..+162% per scenario between runners, and the A/A
      # self-check below can only see same-run noise, so a cross-run
      # baseline can stay red forever with no code change. A
      # `perf-compare: FAIL` verdict fails this step, which fails this
      # job, so the `release` job (`needs: build`) never runs and a
      # regressing release publishes no assets — the ratchet's point.
      # A `perf-baseline: FAIL` (network or API failure) fails the step
      # too; the next cron fire retries. `perf-compare: SKIP (no
      # baseline)` still succeeds. `perf_gate: false` on a dispatch
      # remains the way to publish past a KNOWN, captured regression or
      # a scenario-set change — `_perf/compare.tl:115-121` counts a
      # scenario present in the baseline and missing from the current
      # run as a failure, so a rename with the gate on would block
      # every later release too (the previous binary measures its own
      # embedded scenario set, exactly as its stored numbers did).
      - name: compare against the previous release
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_GATE: ${{ github.event.inputs.perf_gate == 'false' && 'false' || 'true' }}
        run: |
          set -ux
          rc=0
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" GH_TOKEN="$GH_TOKEN" \
            bash -eo pipefail -c '
            o/bin/cosmic --make run _perf/baseline.tl --repo ${{ github.repository }} \
              --asset cosmic-lua --out o/perf/prev/cosmic-lua | tee o/perf/baseline.txt
            if grep -q "^perf-baseline: SKIP" o/perf/baseline.txt; then
              echo "perf-compare: SKIP (no baseline: first measured release)" > o/perf/compare.txt
            else
              chmod +x o/perf/prev/cosmic-lua
              o/perf/prev/cosmic-lua _perf/run.tl --out o/perf/prev/perf.json
              o/bin/cosmic --make run _perf/gate.tl compare \
                o/perf/prev/perf.json o/perf/perf.json o/perf/selfcheck.json \
                | tee o/perf/compare.txt
            fi' || rc=$?
          if [ "$rc" -ne 0 ]; then
            [ -f o/perf/compare.txt ] && cat o/perf/compare.txt >&2
            tail -n1 o/perf/baseline.txt >&2
            echo "perf gate: this release regressed against the previous one and was not published." >&2
            echo "  re-run the release workflow to re-measure: a real regression reproduces, noise does not." >&2
            echo "  if it reproduces, work it under skills/optimize/SKILL.md; never weaken a scenario or its check()." >&2
            echo "  after a deliberate scenario rename or removal, re-baseline by dispatching this workflow once with perf_gate: false." >&2
            if [ "$PERF_GATE" = "true" ]; then exit "$rc"; fi
            echo "perf gate: DISABLED by workflow input — regression reported, not enforced." >&2
          fi

      # G9's per-release half (docs/goals.md; see _build/size.tl): the
      # same measure-then-compare shape as the perf steps above, over
      # tree size instead of speed. This step runs size.tl in report
      # mode under `set -eux` with no guard, so a failure here (e.g. an
      # encode/make_dirs/write error) fails the release. Only the
      # baseline-fetch + compare chain below is guarded to always
      # succeed; this measurement step is not.
      - name: measure the tree size
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" bash -c '
            o/bin/cosmic --make run _build/size.tl --out o/perf/size.json --binary o/bin/cosmic'

      # Same bootstrap shape as the perf baseline fetch above, over the
      # `size.json` asset: baseline.tl's own --asset flag picks it, so
      # this needs no extra tooling — the same cosmic.fetch-based lister
      # that finds perf.json finds size.json.
      - name: compare tree size against the previous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" GH_TOKEN="$GH_TOKEN" bash -c '
            o/bin/cosmic --make run _perf/baseline.tl --repo ${{ github.repository }} \
              --asset size.json --out o/perf/prev/size.json | tee o/perf/size_baseline.txt
            if grep -q "^perf-baseline: SKIP" o/perf/size_baseline.txt; then
              echo "size: SKIP (no baseline: first measured release)" > o/perf/size_compare.txt
            else
              o/bin/cosmic --make run _build/size.tl compare \
                o/perf/prev/size.json o/perf/size.json | tee o/perf/size_compare.txt
            fi
            exit 0'

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cosmic-lua
          path: |
            o/bin/cosmic
            o/bin/cosmic-debug
            o/perf/perf.json
            o/perf/compare.txt
            o/perf/size.json
            o/perf/size_compare.txt

  # The peer table (docs/goals.md G6): the same task, spawn a script that
  # prints "perf-hello", measured for cosmic and the runner's CPython,
  # Node and Go. Deliberately NOT the pinned container: buildpack-deps
  # has python3 (pr.yml's `repro` job already relies on `python3 -m
  # zipfile`) but no node and no go, while the runner image ships all
  # three. The peer versions recorded per row are therefore the runner
  # image's, not a pin this repo controls -- see UNCONTAINERISED in
  # _build/workflows_test.tl. This table reports standing; it never
  # gates -- the only thing that can fail this job is a broken
  # cosmic-lua row.
  peers:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cosmic-lua
          path: dl/

      - name: recover the binary
        shell: bash
        run: |
          set -euo pipefail
          for z in $(find dl -type f -name '*.zip'); do
            python3 -m zipfile -e "$z" dl/
          done
          src=$(find dl -type f -name cosmic | head -1)
          if [ -z "$src" ]; then
            echo "cosmic binary not found in downloaded artifact:" >&2
            find dl >&2
            exit 1
          fi
          cp "$src" cosmic
          chmod +x cosmic

      - name: measure the peer table
        shell: bash
        run: |
          set -eux
          ./cosmic _perf/peers/run.tl --bin ./cosmic --out o/perf/peers.json --md o/perf/peers.md

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cosmic-peers
          path: |
            o/perf/peers.json
            o/perf/peers.md

  release:
    runs-on: ubuntu-latest
    needs: [build, peers]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE_FLAG: ${{ (github.event.inputs.prerelease == 'true' || (github.event.inputs.prerelease == '' && env.PRERELEASE == 'true')) && '--prerelease' || '' }}
        run: |
          mkdir -p release
          # upload-artifact ships a zip that download-artifact does not
          # extract. Handle both that and the delivered-directly layout,
          # and fail loudly with a listing if the binaries are missing
          # rather than trusting a hard-coded path.
          find artifacts -type f -name '*.zip' -execdir unzip -o {} \;
          cosmic_src=$(find artifacts -type f -name cosmic | head -1)
          debug_src=$(find artifacts -type f -name cosmic-debug | head -1)
          perf_src=$(find artifacts -type f -name perf.json | head -1)
          compare_src=$(find artifacts -type f -name compare.txt | head -1)
          size_src=$(find artifacts -type f -name size.json | head -1)
          size_compare_src=$(find artifacts -type f -name size_compare.txt | head -1)
          peers_json_src=$(find artifacts -type f -name peers.json | head -1)
          peers_md_src=$(find artifacts -type f -name peers.md | head -1)
          if [ -z "$cosmic_src" ] || [ -z "$debug_src" ] || [ -z "$perf_src" ] || [ -z "$compare_src" ] \
              || [ -z "$size_src" ] || [ -z "$size_compare_src" ] \
              || [ -z "$peers_json_src" ] || [ -z "$peers_md_src" ]; then
            echo "release assets not found in downloaded artifacts:" >&2
            find artifacts >&2
            exit 1
          fi
          cp "$cosmic_src" release/cosmic-lua
          cp "$debug_src" release/cosmic-lua-debug
          cp "$perf_src" release/perf.json
          cp "$compare_src" release/compare.txt
          cp "$size_src" release/size.json
          cp "$size_compare_src" release/size-compare.txt
          cp "$peers_json_src" release/peers.json
          cp "$peers_md_src" release/peers.md
          chmod +x release/cosmic-lua release/cosmic-lua-debug
          tag="$TAG"
          (cd release && sha256sum cosmic-lua cosmic-lua-debug > SHA256SUMS && cat SHA256SUMS)
          notes=$(printf '%s\n%s\n%s\n' "$(tail -n1 release/compare.txt)" "$(tail -n1 release/size-compare.txt)" "$(tail -n1 release/peers.md)")
          gh release create "$tag" \
            ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} \
            --title "$tag" \
            --notes "$notes" \
            release/cosmic-lua release/cosmic-lua-debug release/SHA256SUMS \
            release/perf.json release/compare.txt release/size.json release/size-compare.txt \
            release/peers.json release/peers.md
