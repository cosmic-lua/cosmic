name: release

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: true

env:
  PRERELEASE: true

jobs:
  # The release build runs in the same digest-pinned container as the CI
  # lanes (#734, see pr.yml for the full rationale): the shipped binaries
  # are built by the same make machinery the gate checks, and the
  # reproducible step only proves determinism WITHIN one environment —
  # pinning here keeps the artifact's build environment a deliberate,
  # reviewable input. The container-compat of the build is proven by
  # pr.yml's lanes in the identical image. The `release` job stays on the
  # bare runner: it runs no build machinery, only artifact download +
  # `gh release create` (gh is not in the image).
  build:
    runs-on: ubuntu-latest
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # Just the two artifacts, named. This lane used to run
      # `teal test build`, which re-ran a gate pr.yml had already run over
      # the same commit — every main commit arrives by push, and push
      # triggers the gate — and which built `o/bin/cosmic-debug` only as a
      # SIDE EFFECT of the test stage (cosmic_debug_test runs it). An
      # upload that depends on a gate stage's side effect breaks silently
      # the day that test moves; naming both binaries says what a release
      # is made of.
      - name: build the release binaries
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            bin/make -j cosmic cosmic-debug

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cosmic-lua
          path: |
            o/bin/cosmic
            o/bin/cosmic-debug

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          PRERELEASE_FLAG: ${{ (github.event.inputs.prerelease == 'true' || (github.event.inputs.prerelease == '' && env.PRERELEASE == 'true')) && '--prerelease' || '' }}
        run: |
          mkdir -p release
          # upload-artifact >= v7 ships the artifact as a zip (archive: true
          # by default) and download-artifact >= v8 does not extract it, while
          # older versions delivered the files directly -- the v4 -> v7/v8
          # bump silently broke every release after 2026-03-24. Handle both
          # layouts and fail loudly (with a listing) if the binaries are
          # missing, instead of trusting a hard-coded path.
          find artifacts -type f -name '*.zip' -execdir unzip -o {} \;
          cosmic_src=$(find artifacts -type f -name cosmic | head -1)
          debug_src=$(find artifacts -type f -name cosmic-debug | head -1)
          if [ -z "$cosmic_src" ] || [ -z "$debug_src" ]; then
            echo "cosmic binaries not found in downloaded artifacts:" >&2
            find artifacts >&2
            exit 1
          fi
          cp "$cosmic_src" release/cosmic-lua
          cp "$debug_src" release/cosmic-lua-debug
          chmod +x release/cosmic-lua release/cosmic-lua-debug
          tag="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          (cd release && sha256sum cosmic-lua cosmic-lua-debug > SHA256SUMS && cat SHA256SUMS)
          gh release create "$tag" \
            ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} \
            --title "$tag" \
            release/cosmic-lua release/cosmic-lua-debug release/SHA256SUMS
