name: release

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: true

env:
  PRERELEASE: true

jobs:
  # The same digest-pinned container as the gate lanes (see pr.yml): the
  # shipped binaries are built by the machinery the gate checks, and
  # reproducibility holds WITHIN an environment, so the environment is
  # part of what a release pins. The `release` job below stays on the
  # bare runner — it runs no build machinery, only artifact download and
  # `gh release create`, and gh is not in the image.
  build:
    runs-on: ubuntu-latest
    container:
      image: buildpack-deps@sha256:cfb30ff3856780c63b00ec3ad2e4aed77ae6afce5975ebb8ad9525ec45354e2e # noble (Ubuntu 24.04)
      options: --privileged
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: prepare non-root builder
        shell: bash
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" "$HOME"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # The two binaries a release is made of, named. The gate has
      # already run over this commit — every commit on main arrives by
      # push, and push triggers it — so this lane builds and nothing
      # else.
      - name: build the release binaries
        shell: bash
        run: |
          set -eux
          runuser -u builder -- env HOME="$HOME" PATH="$PATH" \
            bin/make -j cosmic cosmic-debug

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cosmic-lua
          path: |
            o/bin/cosmic
            o/bin/cosmic-debug

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          PRERELEASE_FLAG: ${{ (github.event.inputs.prerelease == 'true' || (github.event.inputs.prerelease == '' && env.PRERELEASE == 'true')) && '--prerelease' || '' }}
        run: |
          mkdir -p release
          # upload-artifact ships a zip that download-artifact does not
          # extract. Handle both that and the delivered-directly layout,
          # and fail loudly with a listing if the binaries are missing
          # rather than trusting a hard-coded path.
          find artifacts -type f -name '*.zip' -execdir unzip -o {} \;
          cosmic_src=$(find artifacts -type f -name cosmic | head -1)
          debug_src=$(find artifacts -type f -name cosmic-debug | head -1)
          if [ -z "$cosmic_src" ] || [ -z "$debug_src" ]; then
            echo "cosmic binaries not found in downloaded artifacts:" >&2
            find artifacts >&2
            exit 1
          fi
          cp "$cosmic_src" release/cosmic-lua
          cp "$debug_src" release/cosmic-lua-debug
          chmod +x release/cosmic-lua release/cosmic-lua-debug
          tag="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          (cd release && sha256sum cosmic-lua cosmic-lua-debug > SHA256SUMS && cat SHA256SUMS)
          gh release create "$tag" \
            ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} \
            --title "$tag" \
            release/cosmic-lua release/cosmic-lua-debug release/SHA256SUMS
